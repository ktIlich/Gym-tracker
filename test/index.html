<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TEST · Gym Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root{
            /* Палитра из темы Telegram, fallback — тёмная как в v1 (для браузера) */
            --bg:   var(--tg-theme-bg-color, #09090b);
            --card: var(--tg-theme-secondary-bg-color, #18181b);
            --text: var(--tg-theme-text-color, #f4f4f5);
            --mut:  var(--tg-theme-hint-color, #a1a1aa);
            --btn:  var(--tg-theme-button-color, #f59e0b);
            --btn-text: var(--tg-theme-button-text-color, #09090b);
            --link: var(--tg-theme-link-color, #fbbf24);
            /* Нейтральные к теме служебные цвета */
            --border: rgba(128,128,128,.22);
            --card2:  rgba(128,128,128,.14);
            --dim:    var(--mut);
            --green:#34d399; --red:#f87171;
            --rest-bg: rgba(52,211,153,.10);
            --touch:44px;
            --accent:#ff9f0a; --accent-bg:rgba(255,159,10,.14);
        }
        *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
        html,body{margin:0; overflow-x:hidden; max-width:100%}
        body{background:var(--bg); color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:15px;
            padding-bottom:calc(64px + env(safe-area-inset-bottom))}
        #app{max-width:480px; margin:0 auto; padding:0 14px 24px}
        button{font-family:inherit; font-size:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0}
        input{font-family:inherit; font-size:15px; color:var(--text); background:var(--card);
            border:1px solid var(--border); border-radius:12px; padding:9px 12px; outline:none; width:100%}
        input:focus{border-color:var(--btn)}
        input::placeholder{color:var(--dim); opacity:.7}
        textarea{font-family:inherit; font-size:14px; color:var(--text); background:var(--card);
            border:1px solid var(--border); border-radius:12px; padding:10px 12px; outline:none; width:100%;
            min-height:140px; resize:vertical; line-height:1.5}
        textarea:focus{border-color:var(--btn)}
        textarea::placeholder{color:var(--dim); opacity:.7}
        .num{font-variant-numeric:tabular-nums}
        svg.icon{width:18px; height:18px; flex-shrink:0; vertical-align:-4px}

        header{position:sticky; top:0; z-index:10; background:var(--bg);
            border-bottom:1px solid var(--border); margin:0 -14px; padding:10px 14px 6px}
        .strip{display:flex; gap:4px; height:8px; border-radius:99px; overflow:hidden; position:relative}
        .strip>i{flex:1}
        .s-work{background:color-mix(in srgb, var(--btn) 35%, transparent)}
        .s-rest{background:rgba(52,211,153,.35)}
        .dot{position:absolute; top:0; width:8px; height:8px; border-radius:50%; background:var(--text); box-shadow:0 0 4px rgba(0,0,0,.5)}
        .strip-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:4px}

        .env-badge{display:inline-block; background:var(--accent); color:var(--btn-text); font-weight:800; font-size:11px; letter-spacing:.08em; border-radius:6px; padding:2px 8px; line-height:1.3}
        .alias-row{display:flex; align-items:center; gap:6px; margin-top:8px}
        .alias-row input{flex:1; min-width:0; min-height:44px}
        .alias-arrow{flex-shrink:0; color:var(--dim)}
        .alias-del{flex-shrink:0; min-width:44px; min-height:44px; justify-content:center}
        .env-fixed{position:fixed; z-index:1000; pointer-events:none;
            top:calc(var(--tg-content-safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + 4px);
            right:calc(var(--tg-safe-area-inset-right, env(safe-area-inset-right, 0px)) + 6px)}

        .datenav{display:flex; align-items:center; justify-content:space-between; margin-top:12px}
        .datenav .nav{padding:6px 10px; color:var(--mut); font-size:24px; line-height:1; min-width:var(--touch); min-height:var(--touch)}
        .datenav .nav svg.icon{width:22px; height:22px; vertical-align:-6px}
        .dmain{text-align:center}
        .dtitle{font-weight:600; text-transform:capitalize; font-size:16px}
        .badge{font-size:12px; font-weight:600; margin-top:12px; display:inline-block; padding:4px 10px; border-radius:99px; background:var(--card2);
            text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; min-height:0}
        .badge svg.icon{width:12px; height:12px; vertical-align:-1px}
        .b-work{color:var(--link)} .b-rest{color:var(--green)}
        .today-link{font-size:13px; color:var(--dim); text-decoration:underline; margin-top:7px}

        .subtitle-row{margin:10px 0 2px}
        .subtitle-row input{background:transparent; border:1px dashed var(--border); text-align:center;
            font-weight:600; font-size:16px; border-radius:14px}
        .subtitle-row input:focus{border-style:solid}

        .rest-hint{text-align:center; color:var(--green); font-size:14px;
            background:var(--rest-bg); border:1px solid rgba(52,211,153,.25); border-radius:14px; padding:12px; margin-top:12px}

        .backup-banner{display:flex; align-items:center; gap:10px;
            background:var(--accent-bg); border:1px solid rgba(255,159,10,.3); border-radius:14px;
            padding:8px 8px 8px 14px; margin-top:12px; font-size:13px; color:var(--text)}
        .backup-banner .txt{flex:1; min-width:0; line-height:1.35}
        .backup-banner .btns{display:flex; align-items:center; gap:4px; flex-shrink:0}
        .backup-banner .save-btn{background:var(--accent); color:var(--btn-text); border-radius:10px; padding:0 14px;
            font-weight:700; font-size:13px; min-height:var(--touch); display:flex; align-items:center; flex-shrink:0}
        .backup-banner .close-btn{width:var(--touch); height:var(--touch); display:flex; align-items:center; justify-content:center;
            color:var(--mut); flex-shrink:0; font-size:16px}

        .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 14px; margin-top:12px}
        .ex-head{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
        .ex-name{font-weight:600; line-height:1.25; font-size:16px; text-align:left; color:inherit}
        .ex-last{font-size:12px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
        .ex-last svg.icon{width:13px; height:13px; vertical-align:-2px}
        .del-ex{width:44px; height:44px; flex-shrink:0; margin:-2px 0 0 0;
            display:flex; align-items:center; justify-content:center}
        .del-ex .box{width:40px; height:40px; display:flex; align-items:center; justify-content:center;
            color:var(--red); background:rgba(248,113,113,.12); border-radius:12px}
        .del-ex:active .box{background:rgba(248,113,113,.28)}

        .sets{margin-top:6px; display:flex; flex-direction:column; gap:6px}
        .set{display:flex; align-items:center; gap:10px; min-height:var(--touch)}
        .set .idx{width:18px; font-size:12px; color:var(--dim)}
        .set .val{flex:1; font-weight:600; font-size:16px}
        .set .unit{color:var(--dim); font-weight:400; font-size:14px}
        .set .x{color:var(--dim); margin:0 6px; opacity:.6}
        .del-set{width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
        .del-set .box{width:40px; height:40px; display:flex; align-items:center; justify-content:center;
            color:var(--red); background:rgba(248,113,113,.12); border-radius:12px; font-size:16px}
        .del-set:active .box{background:rgba(248,113,113,.28)}

        .addset{display:flex; gap:6px; margin-top:10px}
        .addset input{width:58px; padding:10px 6px; font-size:14px; background:var(--card2); border-color:transparent; text-align:center}
        .addset input::placeholder{text-align:center}
        .addset .btn-main{flex:1; justify-content:center}
        .addset-extras{display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:2px solid color-mix(in srgb, var(--btn) 45%, transparent)}
        .addset-extras>*{flex:1; justify-content:center}
        .btn-main{background:var(--btn); color:var(--btn-text); border-radius:12px; padding:0 10px; font-weight:700;
            display:flex; align-items:center; min-height:var(--touch); font-size:15px}
        .btn-main:active{opacity:.85}
        .btn-gray{background:var(--card2); color:var(--mut); border-radius:12px; padding:0 10px; display:flex; align-items:center; gap:6px; min-height:var(--touch); font-size:14px}
        .btn-gray:active{opacity:.7}

        .addex{display:flex; gap:8px; margin-top:12px}
        .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
        .chip{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--mut);
            background:var(--card); border:1px solid var(--border); border-radius:99px; padding:9px 14px; min-height:40px}
        .chip:active{background:var(--card2)}
        .chip.danger{color:var(--red); border-color:rgba(248,113,113,.35)}
        .chip svg.icon{width:15px; height:15px; vertical-align:-3px}
        .sec-label{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:20px 0 4px}

        .row{margin-top:12px}
        .lbl{font-size:13px; color:var(--mut); margin-bottom:6px}
        .row2{display:flex; gap:10px}
        .row2>div{flex:1}
        .wide-btn{width:100%; display:flex; justify-content:center; align-items:center; gap:8px;
            background:var(--card2); border-radius:12px; padding:12px; font-size:14px; margin-top:10px; min-height:var(--touch)}
        .wide-btn:active{opacity:.7}
        .wide-btn.primary{background:var(--btn); color:var(--btn-text); font-weight:700}
        .wide-btn.danger{color:var(--red); border:1px solid rgba(248,113,113,.35); background:transparent}
        .note{font-size:12px; color:var(--dim); margin-top:10px; line-height:1.45}
        .note svg.icon{width:13px; height:13px; vertical-align:-2px}
        .switch-row{display:flex; align-items:center; justify-content:space-between; min-height:var(--touch); margin-top:6px}
        .switch{position:relative; width:50px; height:30px; flex-shrink:0}
        .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2}
        .switch i{position:absolute; inset:0; background:var(--card2); border-radius:99px; transition:background .15s}
        .switch i::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
            background:var(--text); opacity:.85; transition:transform .15s}
        .switch input:checked + i{background:var(--btn)}
        .switch input:checked + i::after{transform:translateX(20px); background:var(--btn-text); opacity:1}

        .setup{min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px}
        .setup .card.full{max-width:none}
        .diag-pre{white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.5; user-select:text}
        .res-err{color:var(--danger,#ff453a)}
        .setup .card{max-width:340px; width:100%; padding:22px}
        .setup p{color:var(--mut); font-size:14px; line-height:1.5}

        .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
        .cal-title{font-weight:600; text-transform:capitalize}
        .cal-nav{padding:6px 14px; color:var(--mut); font-size:22px; line-height:1; min-width:var(--touch); min-height:var(--touch)}
        .cal-nav svg.icon{width:20px; height:20px; vertical-align:-5px}
        .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
        .cal-dow{font-size:10px; color:var(--dim); text-align:center; padding-bottom:2px}
        .cal-day{aspect-ratio:1; border-radius:10px; border:1px solid transparent;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-size:13px; color:var(--mut); overflow:hidden}
        .cal-day.rest{background:var(--rest-bg)}
        .cal-day.has{color:var(--text)}
        .cal-day.sel{border-color:var(--btn)}
        .cal-day.today .n{color:var(--link); font-weight:800}
        .cal-day .t{font-size:8px; color:var(--link); line-height:1.1; margin-top:2px;
            max-width:95%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
        .cal-day .dotm{width:4px; height:4px; border-radius:50%; background:var(--btn); margin-top:3px}
        .cal-legend{display:flex; gap:14px; font-size:10px; color:var(--dim); margin-top:8px}
        .cal-legend i{display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:4px; vertical-align:-1px}

        .confirm{display:flex; align-items:center; gap:10px; justify-content:space-between;
            background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.3);
            border-radius:14px; padding:10px 14px; margin-top:12px; font-size:13px}
        .confirm .btns{display:flex; gap:8px; flex-shrink:0}
        .btn-red{background:var(--red); color:#09090b; border-radius:10px; padding:9px 12px; font-weight:700; font-size:13px}
        .btn-red:active{opacity:.85}

        .tpl-item .tpl-name{font-weight:600; font-size:16px}
        .tpl-item .tpl-sub{font-size:12px; color:var(--dim); margin-top:2px}
        .tpl-item .tpl-btns{display:flex; gap:8px; margin-top:10px}
        .tpl-item .tpl-btns button{flex:1; justify-content:center; font-size:14px}

        .et-block{position:relative}
        .et-block.ss{border-left:3px solid var(--btn)}
        .et-bhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px}
        .et-btitle{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
        .et-bbtns{display:flex; gap:6px}
        .mini-btn{min-width:38px; height:38px; display:flex; align-items:center; justify-content:center;
            background:var(--card2); border-radius:10px; color:var(--mut); font-size:15px; padding:0 8px}
        .mini-btn:active{opacity:.7}
        .mini-btn.warn{color:var(--red)}
        .mini-btn svg.icon{width:16px; height:16px; vertical-align:-3px}
        .et-item{border-top:1px solid var(--border); padding-top:10px; margin-top:10px}
        .et-item:first-of-type{border-top:none; padding-top:0; margin-top:6px}
        .et-row{display:flex; gap:6px; margin-top:6px; align-items:center}
        .et-row .plan{width:96px; text-align:center; flex-shrink:0}
        .et-row .plan::placeholder{text-align:center}
        .chip-x{display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; color:inherit; border-radius:99px}
        .chip-x svg.icon{width:14px; height:14px}
        .et-chip{min-height:44px; padding-top:0; padding-bottom:0; padding-right:0}
        .et-vadd{flex-shrink:0; min-height:44px; white-space:nowrap}
        .et-vars{display:flex; gap:6px; margin-top:6px; align-items:center; font-size:13px; color:var(--mut)}
        .et-vars input.alt{width:52px; text-align:center; flex-shrink:0}
        .et-vars input.alt::placeholder{text-align:center}

        .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20;
            background:var(--bg); border-top:1px solid var(--border);
            display:flex; padding:4px 6px calc(4px + env(safe-area-inset-bottom));}
        .tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:1px;
            padding:6px 0; color:var(--dim); font-size:9px; border-radius:12px; min-height:52px}
        .tabbar button .ti{font-size:21px; line-height:1.2}
        .tabbar button .ti svg.icon{width:22px; height:22px; vertical-align:-6px}
        .tabbar button.on{color:var(--btn)}

        .toast{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom)); transform:translateX(-50%);
            background:var(--card); border:1px solid var(--border); color:var(--text);
            padding:10px 16px; border-radius:99px; font-size:13px; opacity:0; transition:opacity .2s;
            pointer-events:none; white-space:nowrap; z-index:50; display:flex; gap:12px; align-items:center;
            box-shadow:0 4px 16px rgba(0,0,0,.25)}
        .toast.show{opacity:1; pointer-events:auto}
        .toast svg.icon{width:15px; height:15px; vertical-align:-3px}
        .toast button{color:var(--link); font-weight:700; font-size:13px; padding:2px 4px}
        .ver{text-align:center; font-size:10px; color:var(--dim); opacity:.55; margin-top:28px}
        .rec-badge{display:inline-flex; align-items:center; background:var(--accent-bg); color:var(--accent); font-weight:600; border-radius:6px; padding:2px 8px; font-size:13px; font-variant-numeric:tabular-nums; flex-shrink:0}
        .rec-btn{display:inline-flex; align-items:center; background:var(--accent-bg); color:var(--accent); font-weight:600; border-radius:10px; padding:4px 12px; font-size:13px; min-height:40px; font-variant-numeric:tabular-nums; margin-top:4px; cursor:pointer}
        .rec-btn:active{opacity:.8}
        .set-inp{width:auto; text-align:center; padding:5px 6px; font-size:14px; font-weight:600; background:transparent; border-color:transparent; min-width:0; border-radius:8px}
        .set-inp::placeholder{text-align:center}
        .set-inp:focus{background:var(--card2); border-color:var(--btn)}
        .set-inp::-webkit-inner-spin-button,.set-inp::-webkit-outer-spin-button{-webkit-appearance:none}
        .day-ss{border-left:3px solid var(--btn); padding-left:8px; margin-top:12px}
        .day-ss>.et-btitle{display:block; margin-bottom:2px}
        .day-ss>.card{margin-top:8px}
        .dtitle-btn{font-weight:600; text-transform:capitalize; font-size:16px; color:inherit; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px}
        .timer-btn{min-height:var(--touch); color:var(--mut); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; background:var(--card2); border-radius:12px; padding:0 8px}
        .timer-btn.active{color:var(--accent); background:var(--accent-bg)}
        .note-toggle{font-size:13px; color:var(--link); padding:4px 0; display:block; text-align:left; margin-top:4px}
        .note-toggle svg.icon{width:15px; height:15px; vertical-align:-3px}
        .day-note-area{font-size:14px; min-height:64px; margin-top:6px}
        .ex-note-area{font-size:13px; min-height:52px; margin-top:6px; border-radius:10px}
        .ex-note-text{font-size:12px; color:var(--dim); margin-top:2px; font-style:italic}
        .chip.on{background:var(--btn); color:var(--btn-text); border-color:var(--btn)}
        .hist-back{color:var(--link); font-size:15px; padding:10px 0; display:inline-block; margin-top:8px}
        .hist-back svg.icon{width:16px; height:16px; vertical-align:-3px}
        .hist-table{width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed}
        .hist-table td{padding:5px 6px; border-bottom:1px solid var(--border); overflow-wrap:break-word; word-break:break-word}
        .hist-table tr:last-child td{border-bottom:none}
        .import-preview{margin-top:8px}
        .import-day{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-top:10px}
        .import-day-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
        .import-day-head svg.icon{width:14px; height:14px; vertical-align:-2px}
        .import-ex-row{margin-top:10px; padding-top:10px; border-top:1px solid var(--border)}
        .import-ex-row:first-of-type{margin-top:8px; padding-top:0; border-top:none}
        .import-day-head input[type=date]{font-size:13px; padding:5px 8px; width:auto; border-radius:8px}
        .prog-ex-btn{width:100%; text-align:left; padding:10px 12px; border-radius:10px; font-size:13px; margin-top:4px; background:var(--card2); color:var(--text)}
        .prog-ex-btn:active{opacity:.7}
        .prog-ex-open{color:var(--btn)}
        .variant-btn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
        .variant-btn.variant-active{color:var(--btn)}
        .variant-list{margin-top:6px; border-top:1px solid var(--border); padding-top:6px}
        .swatch{width:30px; height:30px; border-radius:50%; border:3px solid transparent; cursor:pointer; flex-shrink:0}
        .swatch.sel{border-color:var(--text)}
        .theme-radios{display:flex;flex-direction:column;gap:4px}
        .theme-radio{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;padding:0 2px}
        .theme-radio input[type=radio]{accent-color:var(--btn);width:18px;height:18px;flex-shrink:0}
    </style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar">
    <button data-tab="prg"><span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>Прогресс</button>
    <button data-tab="cal"><span class="ti"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Календарь</button>

<script>
    "use strict";
    const APP_VERSION="2.10.0"; // фаза 10: test-среда, модель лога, варианты, бэкапы через Worker
    // ============ среда: test / prod, изоляция ключей ============
    const ENV = location.pathname.includes("/test/") ? "test" : "prod";
    const KP  = ENV === "test" ? "tst_" : "";   // префикс ключей CloudStorage и localStorage
    const K   = function(name){ return KP + name; };  // tpl_x → tst_tpl_x, w_2026-09-28 → tst_w_2026-09-28
    // защита: в test любая запись/удаление ключа без префикса tst_ запрещена
    function guardKey(fullKey){
        if(ENV==="test" && String(fullKey).indexOf("tst_")!==0){
            try{ toast("Попытка записи в боевые данные заблокирована"); }catch(e){}
            throw new Error("Blocked write to prod key: "+fullKey);
        }
    }
    // localStorage: единственная точка доступа; clear() не используется нигде
    function lsGet(name){ return localStorage.getItem(K(name)); }
    function lsSet(name,v){ const k=K(name); guardKey(k); if(typeof frozen!=="undefined"&&frozen) return; localStorage.setItem(k,v); }
    function lsDel(name){ const k=K(name); guardKey(k); localStorage.removeItem(k); }
    // имена (без префикса) ключей localStorage, начинающихся с prefix; только чтение
    function lsKeys(prefix){
        const out=[], full=K(prefix);
        for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(full)===0) out.push(k.slice(KP.length)); }
        return out.sort();
    }
    // ============ Telegram ============
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    let cs = null;
    try{
        if(tg){ tg.ready(); tg.expand();
            if(tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") && tg.CloudStorage) cs = tg.CloudStorage;
            if(tg.isVersionAtLeast && tg.isVersionAtLeast("7.7") && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            document.documentElement.style.colorScheme = tg.colorScheme || "dark";
        } else document.documentElement.style.colorScheme = "dark";
    }catch(e){}
    function hap(kind){ try{ if(tg && tg.HapticFeedback){
        if(kind==="ok") tg.HapticFeedback.notificationOccurred("success");
        else tg.HapticFeedback.impactOccurred(kind);
    }}catch(e){} }

    // ============ state ============
    const CACHE_KEY="gt2:cache", OLD_KEY="gym-tracker-v1", SNAPSHOT_KEY="gt2:snapshot"; // имена без префикса: префикс добавляют lsGet/lsSet/lsDel
    const DEFAULT_TEMPLATES=[
        { name:"Жимовая (пн)", title:"Жимовая", exercises:[
                "Отведения в Пек-Дек на заднюю дельту (3х12-20)","Жим штанги лёжа под углом в Смите (3х8-12)",
                "Жим гантелями лёжа под углом (2х8-12)","Сведения в кроссовере (2х10-15)",
                "Отведения в тренажёре на плечи (3х10-15)","Отведения по 1 руке с нижнего блока (2х10-15)",
                "Жим Смит / гантели на плечи (2х10)","Разгибания в блоке с прямой рукоятью (4х10-15)","Пресс (4х12-20)"]},
        { name:"Тяговая (ср)", title:"Тяговая", exercises:[
                "Пуловер в кроссовере (2х10-15)","Вертикальная тяга широким хватом (3х8-12)","Тяга Т-грифа (2х8-12)",
                "Вертикальная тяга средним параллельным хватом (3х12-15)","Горизонтальная тяга сидя широким хватом (2х10-15)",
                "Гиперэкстензия (3х12)","Сгибания с гантелями стоя по 1 руке (2х8-15)","Молотки, свободный вес или блок (2х8-15)",
                "Гиперэкстензия, акцент разгибатели и поясница (3х12-15)"]},
        { name:"Ноги (пт)", title:"Ноги", exercises:[
                "Сгибания голени сидя или стоя (2х8-12)","Сведения ног сидя (2х10-15)","Приседания в гакк-машине (2х8-12)",
                "Жим ногами, стандартная постановка (2х8-12)","Болгарские приседания (2х10-15)","Разгибания сидя (2х10-15)",
                "Голень стоя (3х10-20)","Задняя дельта Пек-Дек (3х12)","Задняя дельта гантели в наклоне (2х15)"]}
    ];
    function emptyData(){ return { cfg:{ cycle:{workWeeks:2,restWeeks:1,anchorDate:null}, view:{lastWork:true,lastRest:true,viewRec:true,viewWarmup:true,viewNotes:true,viewPastNotes:true}, defaultWeightStep:null, warmupCount:4, warmupPercent:35, restTimerSec:90, autoTimer:true, theme:"tg", accent:"#ff9f0a", weekOverrides:{}, lastBackup:null, backupReminderDays:14, backupSnooze:null, schema:1 }, templates:[], log:{} }; }
    function normalizeData(d){
        const base=emptyData();
        const hadSchema=d.cfg&&d.cfg.schema;
        d.cfg=Object.assign(base.cfg, d.cfg||{});
        d.cfg.schema=hadSchema||1; // отсутствует → 1
        d.cfg.cycle=Object.assign(base.cfg.cycle, d.cfg.cycle||{});
        d.cfg.view=Object.assign({lastWork:true,lastRest:true,viewRec:true,viewWarmup:true,viewNotes:true,viewPastNotes:true}, d.cfg.view||{});
        if(!d.cfg.weekOverrides) d.cfg.weekOverrides={};
        if(!d.cfg.aliases||typeof d.cfg.aliases!=="object") d.cfg.aliases=Object.assign({},DEFAULT_ALIASES);
        if(!d.cfg.variantAliases||typeof d.cfg.variantAliases!=="object") d.cfg.variantAliases=Object.assign({},DEFAULT_VARIANT_ALIASES);
        if(d.cfg.compact){ d.cfg.view.lastWork=false; d.cfg.view.lastRest=false; delete d.cfg.compact; }
        d.templates=(d.templates||[]).map(normalizeTpl); d.log=d.log||{};
        return d;
    }
    // шаблон: {id,name,title,blocks:[{type:"single"|"superset",items:[{name,plan,vars?,alt?}]}]}
    function splitPlan(s){
        const m=String(s).match(/^(.*?)\s*\(([^()]*\d+\s*[хx×*][^()]*)\)\s*$/i);
        if(m) return {name:m[1].trim(), plan:m[2].trim()};
        return {name:String(s).trim(), plan:""};
    }
    function normalizeTpl(t){
        if(!t.blocks){
            t.blocks=(t.exercises||[]).map(function(s){ const p=splitPlan(s); return {type:"single",items:[{name:p.name,plan:p.plan}]}; });
        }
        delete t.exercises;
        t.blocks=(t.blocks||[]).filter(function(b){return b.items&&b.items.length;});
        for(const b of t.blocks){
            b.type=(b.type==="superset"&&b.items.length>1)?"superset":"single";
            for(const it of b.items){
                it.name=(it.name||"").trim(); it.plan=(it.plan||"").trim();
                if(it.vars){
                    const seenV={};
                    it.vars=it.vars.map(function(v){return String(v).trim();}).filter(function(v){ const k=v.toLowerCase(); if(!v||seenV[k]) return false; seenV[k]=1; return true; });
                    if(!it.vars.length){ delete it.vars; delete it.alt; }
                }
                if(it.vars) it.alt=Math.max(1,parseInt(it.alt,10)||1);
            }
        }
        return t;
    }
    function fullEx(it){ return it.name+(it.plan?" ("+it.plan+")":""); }

    // ============ модель упражнения в логе: { id, name, base, plan, variant, sets, note?, ss? } ============
    // name сохраняется для совместимости и всегда собирается из полей
    const DEFAULT_ALIASES={
        "Голень стоя":"Голень стоя (икры)",
        "Гиперэкстензия, акцент на разгибатели и поясница":"Гиперэкстензия, акцент разгибатели и поясница",
        "Сгибания голени сидя или стоя":"Сгибания голени",
        "Приседания в гаке лицом назад":"Приседания в гакк-машине · вариант «Спиной»",
        "Приседания в гаке лицом к тренажёру":"Приседания в гакк-машине · вариант «лицом»"
    };
    const DEFAULT_VARIANT_ALIASES={ "свободный вес":"Свободный" };
    let migCtx=null;   // во время migrateAll алиасы берутся из мигрируемых данных, а не из глобальных
    function aliasCfg(){ return (migCtx&&migCtx.cfg)||data.cfg||{}; }
    function composeName(base,plan,variant){ return base+(plan?" ("+plan+")":"")+(variant?" · "+variant:""); }
    // разбор старого name: 1) вариант — по последнему " · "; 2) план — последняя скобка вида (NхM[-K]) в конце
    function parseExName(name){
        let str=String(name==null?"":name).trim(), variant=null, plan=null;
        const i=str.lastIndexOf(" · ");
        if(i>=0){ variant=str.slice(i+3).trim()||null; str=str.slice(0,i).trim(); }
        const m=str.match(/^(.*?)\s*\((\d+)\s*[хx×]\s*(\d+(?:\s*[-–—]\s*\d+)?)\)\s*$/i);
        if(m){ str=m[1].trim(); plan=m[2]+"х"+m[3].replace(/\s+/g,"").replace(/[–—]/g,"-"); }
        return {base:str, plan:plan, variant:variant};
    }
    function aliasLookup(map,key){
        const k=String(key==null?"":key).trim().toLowerCase(); if(!k||!map) return null;
        for(const a of Object.keys(map)) if(a.trim().toLowerCase()===k) return map[a];
        return null;
    }
    // цель алиаса: «База · вариант «X»» или «База · X» → {base, variant}
    function parseAliasTarget(t){
        t=String(t).trim();
        const m=t.match(/^(.*?)\s*·\s*вариант\s*«(.+?)»\s*$/i);
        if(m) return {base:m[1].trim(), variant:m[2].trim()};
        const i=t.lastIndexOf(" · ");
        if(i>=0) return {base:t.slice(0,i).trim(), variant:t.slice(i+3).trim()||null};
        return {base:t, variant:null};
    }
    // написание варианта как в актуальном шаблоне: приоритет — упражнение шаблона с тем же base, затем свежесть шаблона (up)
    function templateVariant(v,base){
        const low=v.toLowerCase(), bl=base?String(base).trim().toLowerCase():null;
        const tpls=(migCtx&&migCtx.templates)||(typeof data!=="undefined"&&data.templates)||[];
        let best=null;
        for(const t of tpls) for(const b of (t.blocks||[])) for(const it of (b.items||[])) for(const x of (it.vars||[])){
            if(String(x).trim().toLowerCase()!==low) continue;
            const score=[bl&&String(it.name||"").trim().toLowerCase()===bl?1:0, t.up||0];
            if(!best||score[0]>best.score[0]||(score[0]===best.score[0]&&score[1]>best.score[1])) best={score:score, v:String(x).trim()};
        }
        return best?best.v:null;
    }
    function canonVariant(v,base){
        v=v==null?"":String(v).trim(); if(!v) return null;
        const t=aliasLookup(aliasCfg().variantAliases,v);
        if(t) v=String(t).trim()||v;
        return templateVariant(v,base)||v;
    }
    // алиасы применяются к base и variant (регистр и пробелы при сравнении не важны); собственный variant записи не перетирается
    function applyAliases(base,variant){
        const t=aliasLookup(aliasCfg().aliases,base);
        if(t){ const p=parseAliasTarget(t); base=p.base; if(p.variant&&!variant) variant=p.variant; }
        base=String(base==null?"":base).trim();
        return {base:base, variant:canonVariant(variant,base)};
    }
    // приводит запись к модели: заполняет base/plan/variant (из name, если base нет), применяет алиасы, пересобирает name
    function ensureEx(ex){
        if(!ex.base){ const p=parseExName(ex.name); ex.base=p.base; ex.plan=p.plan; ex.variant=p.variant; }
        ex.plan=ex.plan||null;
        const a=applyAliases(ex.base,ex.variant);
        ex.base=a.base; ex.variant=a.variant;
        ex.name=composeName(ex.base,ex.plan,ex.variant);
        return ex;
    }
    function newEx(base,plan,variant,extra){
        const ex={id:uid(), name:"", base:base, plan:plan||null, variant:variant||null, sets:[]};
        if(extra) Object.assign(ex,extra);
        return ensureEx(ex);
    }
    function exShell(src){ const q=ensureEx({name:src.name,base:src.base,plan:src.plan,variant:src.variant}); return newEx(q.base,q.plan,q.variant); }
    function setExVariant(ex,v){ ensureEx(ex); ex.variant=canonVariant(v,ex.base); ex.name=composeName(ex.base,ex.plan,ex.variant); }
    // повторное применение алиасов ко всему логу (не через needs(): у мигрированных записей base уже есть)
    function recomputeLog(pre){
        const changed=[];
        for(const k of Object.keys(data.log).sort()){
            const d=data.log[k]; let ch=false;
            for(const e of (d.exercises||[])){
                const before=e.name+"|"+e.base+"|"+e.plan+"|"+e.variant;
                if(pre) pre(e);
                ensureEx(e);
                if(before!==e.name+"|"+e.base+"|"+e.plan+"|"+e.variant) ch=true;
            }
            if(ch){ d.up=Date.now(); changed.push(k); }
        }
        for(const k of changed) persistDay(k);
        return changed;
    }
    function tplExCount(t){ return t.blocks.reduce(function(a,b){return a+b.items.length;},0); }
    // сколько тренировок с этим упражнением (по base, без учёта плана и варианта) было строго до текущей даты
    function countBase(base){
        const bl=applyAliases(base,null).base.trim().toLowerCase(); let n=0;
        for(const k of Object.keys(data.log)){
            if(k>=curDate) continue;
            if((data.log[k].exercises||[]).some(function(e){ return exBaseOf(e).trim().toLowerCase()===bl; })) n++;
        }
        return n;
    }
    // Семантика alt в коде: период чередования «каждые alt тренировок» (в редакторе: «кажд. N тр.»), а не индекс.
    // Индекс варианта = floor(count/alt) по кругу; читается всегда нормализованным: idx=((raw % n)+n)%n; при n=0 вариант = null.
    function variantIndex(count,alt,n){
        if(!(n>0)) return -1;
        const step=Math.max(1,parseInt(alt,10)||1), raw=Math.floor((parseInt(count,10)||0)/step);
        return ((raw%n)+n)%n;
    }
    function pickVariant(it,count){
        const vars=it.vars||[], i=variantIndex(count,it.alt,vars.length);
        return i<0?null:vars[i];
    }
    let data=emptyData();
    let curDate=toKey(new Date());
    let ui={ tab:"day", savingTpl:false, confirmDel:false, tplDelId:null, wipeStep:0, setupStep:1, setupDate:null, tplFromText:false, tplParsed:null, editTpl:null, histEx:null, importText:false, importParsed:null, dayNoteOpen:false, exNoteOpen:{}, variantOpen:{}, weekTypeOpen:false,
        backupRestoreOpen:false, backupParsed:null, backupParsedSrc:null, backupMode:"merge", backupConfirmStep:0,
        progMode:"ex", progPeriod:"3m" };
    let calMonth=curDate.slice(0,7);
    let lastDel=null;
    let timerEnd=0, timerInterval=null;
    let progEx=null;
    let summaryCache={period:null, result:null};

    // ============ helpers ============
    function toKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
    function parseKey(k){ const p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
    function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return toKey(d); }
    function fmtDate(k){ return parseKey(k).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"}); }
    function fmtShort(k){ return k.slice(8,10)+"."+k.slice(5,7); }
    function uid(){ return Math.random().toString(36).slice(2,9); }
    function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
    function fmtW(w){ return (Math.round(w*100)/100).toString().replace(".",","); }
    function ruPlural(n,one,few,many){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return many; if(n1>1&&n1<5) return few; if(n1===1) return one; return many; }
    function daysSinceBackup(){ if(!data.cfg.lastBackup) return Infinity; return Math.floor((Date.now()-new Date(data.cfg.lastBackup).getTime())/86400000); }
    function shouldShowBackupBanner(){
        if(!Object.keys(data.log).length) return false;
        const n=data.cfg.backupReminderDays;
        if(!n) return false;
        if(data.cfg.backupSnooze&&Date.now()<data.cfg.backupSnooze) return false;
        return daysSinceBackup()>=n;
    }

    function getMondayKey(dateKey){
        const d=parseKey(dateKey);
        const dow=(d.getDay()+6)%7; // Mon=0..Sun=6
        return toKey(new Date(d.getTime()-dow*86400000));
    }
    function weekInfo(dateKey){
        const c=data.cfg.cycle;
        if(!c.anchorDate) return null;
        const total=c.workWeeks+c.restWeeks, cycleLen=total*7;
        const date=parseKey(dateKey);
        const dayWithinWeek=(date.getDay()+6)%7;
        const mondayDate=new Date(date.getTime()-dayWithinWeek*86400000);
        const mondayKey=toKey(mondayDate);
        // Find last override ≤ mondayKey
        const overrides=c.weekOverrides||{};
        const ovKeys=Object.keys(overrides).filter(function(k){return k<=mondayKey;}).sort();
        let pos;
        if(ovKeys.length){
            const ovKey=ovKeys[ovKeys.length-1];
            const ov=overrides[ovKey];
            const weeksElapsed=Math.round((mondayDate.getTime()-parseKey(ovKey).getTime())/604800000);
            const ovPos=ov.type==='work'?(ov.index||0):c.workWeeks+(ov.index||0);
            pos=((ovPos+weeksElapsed)%total+total)%total;
        } else {
            const diff=Math.round((date.getTime()-parseKey(c.anchorDate).getTime())/86400000);
            pos=((Math.floor(diff/7)%total)+total)%total;
        }
        const day=pos*7+dayWithinWeek;
        return { pos:pos, day:day, cycleLen:cycleLen, isRest:pos>=c.workWeeks };
    }
    function weekLabel(wi){
        if(!wi) return "";
        const c=data.cfg.cycle;
        if(wi.isRest) return c.restWeeks>1 ? "Отдых · неделя "+(wi.pos-c.workWeeks+1) : "Отдых";
        return "Рабочая · неделя "+(wi.pos+1);
    }
    function dayWeekType(k){
        const d=data.log[k];
        if(d && d.weekType) return d.weekType;
        const wi=weekInfo(k);
        return wi ? (wi.isRest?"rest":"work") : null;
    }

    let toastTimer;
    function toast(msg,btnLabel,btnFn){
        const t=document.getElementById("toast"), m=document.getElementById("toastMsg"), b=document.getElementById("toastBtn");
        m.textContent=msg;
        if(btnLabel){ b.style.display=""; b.textContent=btnLabel; b.onclick=function(){ t.classList.remove("show"); btnFn(); }; }
        else { b.style.display="none"; b.onclick=null; }
        t.classList.add("show");
        clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove("show");},3500);
    }

    // ============ storage: localStorage cache + Telegram CloudStorage ============
    function saveCache(){ try{ lsSet(CACHE_KEY, JSON.stringify(data)); }catch(e){} maybeSnapshot(); }
    function loadCache(){ try{ const r=lsGet(CACHE_KEY); if(r){ data=normalizeData(JSON.parse(r)); return true; } }catch(e){} return false; }

    // ============ backup / restore ============
    function buildBackupDump(){
        return { app:"gym-tracker", version:APP_VERSION, created:new Date().toISOString(),
            cfg:data.cfg, templates:data.templates, log:data.log };
    }
    function getSnapshot(){ try{ const r=lsGet(SNAPSHOT_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
    function maybeSnapshot(){
        try{
            const prev=getSnapshot();
            if(prev&&prev.created&&(Date.now()-new Date(prev.created).getTime())<86400000) return;
            lsSet(SNAPSHOT_KEY, JSON.stringify(buildBackupDump()));
        }catch(e){}
    }
    function isBackupDump(o){ return o&&typeof o==="object"&&o.app==="gym-tracker"&&o.log&&typeof o.log==="object"; }
    function backupSummary(dump){
        const days=Object.keys(dump.log||{});
        let nEx=0; for(const k of days) nEx+=((dump.log[k].exercises||[]).length);
        return { days:days.length, ex:nEx, tpl:(dump.templates||[]).length, created:dump.created||null };
    }
    // «merge»: добавляются только дни/шаблоны, которых нет сейчас; «replace»: данные и облако перетираются полностью
    function applyBackupDump(dump, mode){
        const toSyncDays=[], toSyncTpl=[];
        if(mode==="replace"){
            data=normalizeData({ cfg:dump.cfg||{}, templates:(dump.templates||[]).slice(), log:dump.log||{} });
            applyMigrations(); saveCache();
            return { mode:mode, days:Object.keys(data.log).length, tpl:data.templates.length, cloudReplace:true };
        }
        let nDays=0, nTpl=0;
        for(const k of Object.keys(dump.log||{})){
            if(data.log[k]) continue;
            data.log[k]=dump.log[k]; nDays++; toSyncDays.push(k);
        }
        for(const t of (dump.templates||[])){
            const exists=data.templates.some(function(x){return x.id===t.id||x.name===t.name;});
            if(exists) continue;
            const nt=normalizeTpl(JSON.parse(JSON.stringify(t)));
            data.templates.push(nt); nTpl++; toSyncTpl.push(nt);
        }
        applyMigrations(); saveCache();
        return { mode:mode, days:nDays, tpl:nTpl, toSyncDays:toSyncDays, toSyncTpl:toSyncTpl };
    }
    function downloadJson(filename, text){
        const blob=new Blob([text],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=filename; document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); },1000);
    }
    function copyToClipboard(text){
        if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
        return new Promise(function(resolve,reject){
            try{
                const ta=document.createElement("textarea");
                ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
                document.body.appendChild(ta); ta.focus(); ta.select();
                const ok=document.execCommand("copy");
                document.body.removeChild(ta);
                ok?resolve():reject(new Error("execCommand failed"));
            }catch(e){ reject(e); }
        });
    }

    // низкоуровневый слой (полные ключи). Запись/удаление — только через guardKey
    let lastCsErr="";
    function rawGetItems(keys){ return new Promise(function(res){ if(!cs||!keys.length) return res({}); cs.getItems(keys,function(e,v){ if(e) lastCsErr="getItems: "+String(e); res(e?{}:(v||{})); }); }); }
    function rawSet(k,v){ return new Promise(function(res){ if(!cs||frozen) return res(false); guardKey(k); try{ cs.setItem(k,v,function(e,ok){ if(e) lastCsErr="setItem: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="setItem: "+String(err&&err.message||err); res(false); } }); }
    function rawDel(k){ return new Promise(function(res){ if(!cs) return res(false); guardKey(k); try{ cs.removeItem(k,function(e,ok){ if(e) lastCsErr="removeItem: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="removeItem: "+String(err&&err.message||err); res(false); } }); }
    // одним вызовом, но только по явному списку: каждый ключ проходит guardKey, «все ключи» не удаляются никогда
    function rawDelMany(keys){ return new Promise(function(res){ if(!keys.length) return res(true); if(!cs) return res(false); keys.forEach(guardKey); try{ cs.removeItems(keys,function(e,ok){ if(e) lastCsErr="removeItems: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="removeItems: "+String(err&&err.message||err); res(false); } }); }
    // простой пул: не больше limit одновременных задач; onDone(i) вызывается после каждой
    async function runPool(items,limit,worker,onDone){
        let next=0, done=0; const results=new Array(items.length);
        async function lane(){ while(next<items.length){ const i=next++; results[i]=await worker(items[i],i); done++; if(onDone) onDone(done,items.length); } }
        const lanes=[]; for(let i=0;i<Math.min(limit,items.length);i++) lanes.push(lane());
        await Promise.all(lanes); return results;
    }
    function rawKeys(){ return new Promise(function(res){ if(!cs) return res(null); try{ cs.getKeys(function(e,k){ if(e) lastCsErr="getKeys: "+String(e); res(e?null:(k||[])); }); }catch(err){ lastCsErr="getKeys: "+String(err&&err.message||err); res(null); } }); }
    // логический слой: приложение работает с именами без префикса ("cfg", "w_2026-09-28"), K() добавляется здесь
    function csGetItems(keys){
        return rawGetItems(keys.map(K)).then(function(o){ const r={}; for(const k of keys) if(o[K(k)]!=null) r[k]=o[K(k)]; return r; });
    }
    function csSet(k,v){ return rawSet(K(k),v); }
    function csDel(k){ return rawDel(K(k)); }
    // в test возвращает только ключи с префиксом tst_ (без префикса); чужие ключи test не видит
    function csKeys(){
        return rawKeys().then(function(all){
            if(all===null) return null;
            if(ENV!=="test") return all;
            return all.filter(function(k){ return k.indexOf(KP)===0; }).map(function(k){ return k.slice(KP.length); });
        });
    }

    let warnedCloud=false;
    function csSetWarn(k,v){ csSet(k,v).then(function(ok){ if(cs&&!ok&&!warnedCloud){ warnedCloud=true; toast("Запись в облако не прошла ("+k+")"); } }); }
    function persistDay(k){ saveCache(); if(data.log[k]) csSetWarn("w_"+k, JSON.stringify(data.log[k])); else csDel("w_"+k); }
    function persistCfg(){ data.cfg.up=Date.now(); saveCache(); csSetWarn("cfg", JSON.stringify(data.cfg)); }
    function persistTpl(t){ t.up=Date.now(); saveCache(); csSetWarn("tpl_"+t.id, JSON.stringify(t)); }
    function unpersistTpl(id){ saveCache(); csDel("tpl_"+id); }

    // ============ миграции данных (по записям, а не по cfg.schema) ============
    // Состояние миграции определяется самими записями: cfg может быть новее отдельных дней (слияние, старый клиент).
    // Миграция: { id, needs(rec,kind)→bool, run(rec,kind)→rec }, kind = "day" | "tpl". run идемпотентна.
    // cfg.schema — только информационная метка, для решения о запуске миграций не используется.
    const APP_SCHEMA=2;   // 2 — модель упражнения base/plan/variant
    const MIGRATIONS=[
        // schema 2: у каждого упражнения дня появляются base/plan/variant, применяются алиасы, name пересобирается
        { id:"log-fields",
          needs:function(rec,kind){ return kind==="day" && (rec.exercises||[]).some(function(e){ return !e.base; }); },
          run:function(rec){ for(const e of (rec.exercises||[])) if(!e.base) ensureEx(e); return rec; } }
    ];
    const PREMIG_KEEP=3;
    function migNeeds(m,rec,kind){ try{ return !!m.needs(rec,kind); }catch(e){ return false; } }
    // Проходит по всем дням и шаблонам d, применяет миграции там, где needs()===true. Меняет d на месте.
    // Не трогает up. Возвращает {days:[ключи], tpls:[id], errors, snapshot}
    function migrateAll(d, list){
        migCtx={cfg:d.cfg||{}, templates:d.templates||[]};
        try{ return migrateAllInner(d,list); }finally{ migCtx=null; }
    }
    function migrateAllInner(d, list){
        list=list||MIGRATIONS;
        const res={days:[], tpls:[], errors:0, snapshot:null};
        if(!list.length) return res;
        const todo=[];
        for(const k of Object.keys(d.log||{}).sort()) if(list.some(function(m){ return migNeeds(m,d.log[k],"day"); })) todo.push(["day",k]);
        for(const t of (d.templates||[])) if(list.some(function(m){ return migNeeds(m,t,"tpl"); })) todo.push(["tpl",t.id]);
        if(!todo.length) return res;
        // снапшот перед применением: localStorage (в CloudStorage лимит 4096 символов), храним PREMIG_KEEP последних
        const snapName="premig_"+new Date().toISOString().replace(/[:.]/g,"-");
        try{
            lsSet(snapName, JSON.stringify(d));
            const all=lsKeys("premig_");
            while(all.length>PREMIG_KEEP) lsDel(all.shift());
            res.snapshot=snapName;
        }catch(e){ res.errors=todo.length; return res; }   // без снапшота не мигрируем
        for(const item of todo){
            const kind=item[0], key=item[1];
            const idx=kind==="day"?null:d.templates.findIndex(function(t){ return t.id===key; });
            const orig=kind==="day"?d.log[key]:d.templates[idx];
            try{
                let rec=JSON.parse(JSON.stringify(orig));
                for(const m of list) if(migNeeds(m,rec,kind)) rec=m.run(rec,kind)||rec;
                if(orig.up===undefined) delete rec.up; else rec.up=orig.up;   // эквивалентное преобразование: up не меняется
                if(JSON.stringify(rec)===JSON.stringify(orig)) continue;
                if(kind==="day"){ d.log[key]=rec; res.days.push(key); }
                else { d.templates[idx]=rec; res.tpls.push(key); }
            }catch(e){ res.errors++; }
        }
        return res;
    }
    // «грязные» записи (мигрированы, но ещё не записаны в облако) переживают перезапуск
    function getDirty(){ try{ const o=JSON.parse(lsGet("migdirty")||"null"); if(o) return {days:o.days||[],tpls:o.tpls||[]}; }catch(e){} return {days:[],tpls:[]}; }
    function setDirty(o){ try{ if(o.days.length||o.tpls.length) lsSet("migdirty",JSON.stringify(o)); else lsDel("migdirty"); }catch(e){} }
    function serializeKey(k){
        if(k==="cfg") return JSON.stringify(data.cfg);
        if(k.indexOf("w_")===0){ const r=data.log[k.slice(2)]; return r?JSON.stringify(r):null; }
        if(k.indexOf("tpl_")===0){ const t=data.templates.find(function(x){ return x.id===k.slice(4); }); return t?JSON.stringify(t):null; }
        return null;
    }
    let flushing=false;
    async function flushDirty(){
        if(flushing) return; flushing=true;
        try{
            const dirty=getDirty();
            if(!dirty.days.length&&!dirty.tpls.length) return;
            const left={days:[],tpls:[]};
            for(const k of dirty.days){ const v=serializeKey("w_"+k); if(v===null) continue; if(!(await csSet("w_"+k,v))) left.days.push(k); }
            for(const id of dirty.tpls){ const v=serializeKey("tpl_"+id); if(v===null) continue; if(!(await csSet("tpl_"+id,v))) left.tpls.push(id); }
            setDirty(left);
        }finally{ flushing=false; }
    }
    // единая точка: вызывается везде, где данные попадают в память (загрузка, слияние, восстановление, импорт, клон).
    // true — если что-то мигрировало
    function applyMigrations(){
        if((data.cfg.schema||1)<APP_SCHEMA) data.cfg.schema=APP_SCHEMA;
        const r=migrateAll(data);
        if(r.errors) toast("Часть данных не мигрирована ("+r.errors+"), будет повтор при следующей загрузке");
        const changed=r.days.length+r.tpls.length>0;
        if(changed){
            const dirty=getDirty();
            for(const k of r.days) if(dirty.days.indexOf(k)<0) dirty.days.push(k);
            for(const id of r.tpls) if(dirty.tpls.indexOf(id)<0) dirty.tpls.push(id);
            setDirty(dirty); saveCache();
        }
        flushDirty();
        return changed;
    }

    // ============ test: клонирование боевых данных (только чтение прода) ============
    function showAlertP(msg){
        return new Promise(function(res){
            if(tg&&tg.showAlert&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")){ tg.showAlert(msg,function(){ res(); }); return; }
            window.alert(msg); res();
        });
    }
    function errText(e){ return String(e&&e.message||e||"неизвестная ошибка"); }
    function askConfirm(msg){
        return new Promise(function(res){
            try{ if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")){ tg.showConfirm(msg,function(ok){ res(!!ok); }); return; } }catch(e){}
            res(window.confirm(msg));
        });
    }
    // результат клонирования показывается всегда: успех — showAlert с итогом и перезагрузка, ошибка — showAlert с названием шага
    function cloneDone(msg,isErr){
        ui.cloneBusy=false; ui.cloneProgress=null; ui.cloneMsg=msg; ui.cloneIsErr=!!isErr;
        if(isErr) ui.lastCloneError=msg;
        render();
        if(isErr) hap("error");
    }
    // маркер состояния клонирования (tst_clone_state): "running" → "done;<дата>;<число ключей>"
    const CLONE_STATE="clone_state", CLONE_BATCH=50, CLONE_PARALLEL=6;
    function cloneOverlay(text){
        let o=document.getElementById("cloneOverlay");
        if(text===null){ if(o) o.remove(); return; }
        if(!o){
            o=document.createElement("div"); o.id="cloneOverlay";
            o.style.cssText="position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:20px;font-weight:700;text-align:center;padding:24px;touch-action:none";
            o.innerHTML='<div id="cloneOverlayText"></div><div style="font-size:13px;font-weight:400;opacity:.8">Не закрывайте приложение до окончания копирования</div>';
            document.body.appendChild(o);
        }
        document.getElementById("cloneOverlayText").textContent=text;
    }
    function cloneProgress(done,total){
        ui.cloneProgress={done:done,total:total};
        const txt="Копирование "+done+"/"+total;
        cloneOverlay(txt);
        const btn=document.querySelector('[data-act="cloneProd"]'); if(btn) btn.innerHTML=ICON_SYNC+" "+txt;
    }
    function ms(t0){ return Math.round(performance.now()-t0); }
    async function cloneFromProd(){
        if(ui.cloneBusy) return;
        ui.cloneBusy=true; ui.cloneMsg="Копирование…"; ui.cloneIsErr=false; render();
        let step="Проверка среды", ownBusy=false, success=null, closingOn=false, markerWritten=false;
        const T={ read:0, del:0, write:0, total:0, keys:0, batches:0, deleted:0, parallel:CLONE_PARALLEL };
        const tAll=performance.now();
        try{
            if(ENV!=="test") throw new Error("клонирование доступно только в test");
            if(!cs) throw new Error("CloudStorage недоступен (открыто не в Telegram или версия клиента ниже 6.9). См. «Диагностика».");
            if(syncState.busy) throw new Error("идёт синхронизация с облаком, повторите через несколько секунд");
            syncState.busy=true; ownBusy=true;
            // ---- чтение: все ключи без префикса tst_ (в них ничего не пишем), значения пачками
            step="Чтение списка ключей"; lastCsErr="";
            let t0=performance.now();
            const all=await rawKeys();
            if(all===null) throw new Error("не удалось прочитать список ключей CloudStorage"+(lastCsErr?" — "+lastCsErr:""));
            const prod=all.filter(function(k){ return k.indexOf(KP)!==0; });
            const mine=all.filter(function(k){ return k.indexOf(KP)===0; });
            step="Проверка основных данных";
            if(!prod.length) throw new Error("основные данные не найдены: в CloudStorage нет ключей без префикса «"+KP+"» (всего ключей: "+all.length+"). Проверьте, что test открыт тем же ботом, — см. «Диагностика».");
            // лимит CloudStorage: 1024 ключа на бота и пользователя
            if(prod.length*2>=1000) throw new Error("слишком много ключей ("+prod.length+"): копия не поместится в лимит 1024 (нужно: прод-ключи × 2 < 1000)");
            step="Чтение значений"; const items={};
            for(let i=0;i<prod.length;i+=CLONE_BATCH){
                const part=prod.slice(i,i+CLONE_BATCH); lastCsErr="";
                const got=await rawGetItems(part); T.batches++;
                for(const k of part){ if(got[k]==null) throw new Error("не удалось прочитать значение ключа «"+k+"»"+(lastCsErr?" — "+lastCsErr:"")+". Тестовые данные не тронуты."); items[k]=got[k]; }
            }
            T.read=ms(t0); T.keys=prod.length;
            // ---- подтверждение (после прерванного копирования — не спрашиваем)
            step="Подтверждение";
            const hasTestData=mine.some(function(k){ return k.indexOf(KP+"w_")===0; })||!!data.cfg.cycle.anchorDate;
            if(hasTestData && !ui.cloneIncomplete && !(await askConfirm("Перезаписать тестовые данные копией основных?"))){ cloneDone("Отменено: тестовые данные не изменены",false); return; }
            step="Снимок текущих тестовых данных";
            lsSet("preclone", JSON.stringify(data));
            // ---- с этого момента пользователь не должен уйти: оверлей + подтверждение закрытия
            if(tg&&tg.enableClosingConfirmation){ tg.enableClosingConfirmation(); closingOn=true; }
            cloneProgress(0,prod.length);
            step="Запись маркера «running»";
            if(!(await rawSet(KP+CLONE_STATE,"running"))) throw new Error("не удалось записать маркер состояния"+(lastCsErr?" — "+lastCsErr:""));
            markerWritten=true;
            // ---- удаление: только лишние tst_-ключи (которых нет в новой копии); остальные перезапишутся
            step="Удаление лишних тестовых ключей"; t0=performance.now();
            const target={}; for(const k of prod) target[KP+k]=1;
            const extra=mine.filter(function(k){ return k!==KP+CLONE_STATE && !target[k]; });
            lastCsErr="";
            if(!(await rawDelMany(extra))) throw new Error("не удалены ключи ("+extra.length+"): "+extra.slice(0,5).join(", ")+(lastCsErr?" — "+lastCsErr:""));
            T.del=ms(t0); T.deleted=extra.length;
            // ---- запись: параллельно, не более CLONE_PARALLEL одновременных запросов
            step="Запись копии"; t0=performance.now(); lastCsErr="";
            const wr=await runPool(prod,CLONE_PARALLEL,function(k){ return rawSet(KP+k,items[k]); },cloneProgress);
            T.write=ms(t0);
            const wrFail=prod.filter(function(k,i){ return !wr[i]; });
            if(wrFail.length) throw new Error("не записано ключей: "+wrFail.length+" из "+prod.length+" (например, "+wrFail.slice(0,3).join(", ")+")"+(lastCsErr?" — "+lastCsErr:""));
            step="Запись маркера «done»";
            if(!(await rawSet(KP+CLONE_STATE,"done;"+new Date().toISOString()+";"+prod.length))) throw new Error("не удалось записать маркер завершения"+(lastCsErr?" — "+lastCsErr:""));
            // ---- кэш localStorage из только что записанных значений: первый рендер после перезагрузки сразу покажет новые данные
            step="Заполнение локального кэша";
            data=normalizeData(cloudObjFromItems(prod,items));
            applyMigrations(); saveCache();
            T.total=ms(tAll);
            ui.cloneTimings=T;
            lsSet("clone_timings",JSON.stringify(T));
            console.log("[clone] чтение "+T.read+" мс ("+T.keys+" ключей, пачек: "+T.batches+"), удаление "+T.del+" мс ("+T.deleted+" ключей), запись "+T.write+" мс (параллельно "+T.parallel+"), всего "+T.total+" мс");
            const nW=prod.filter(function(k){return k.indexOf("w_")===0;}).length, nT=prod.filter(function(k){return k.indexOf("tpl_")===0;}).length;
            success="Скопировано: "+nW+" тренировок, "+nT+" шаблонов, "+prod.length+" ключей";
        }catch(e){
            const full="Шаг «"+step+"»: "+errText(e)+(lastCsErr&&errText(e).indexOf(lastCsErr)<0?" ("+lastCsErr+")":"");
            if(markerWritten) ui.cloneIncomplete=true;   // облако могло остаться с неполной копией
            cloneOverlay(null);
            if(closingOn){ tg.disableClosingConfirmation(); closingOn=false; }
            cloneDone(full,true);
            await showAlertP("Ошибка клонирования. "+full);
            return;
        }
        finally{
            if(ownBusy) syncState.busy=false; ui.cloneBusy=false;
            if(closingOn&&!success) tg.disableClosingConfirmation();
        }
        ui.cloneIncomplete=false; ui.cloneMsg=success; ui.cloneIsErr=false;
        cloneOverlay(null);
        if(closingOn){ tg.disableClosingConfirmation(); }
        await showAlertP(success);
        location.reload();
    }
    // при старте test: если клонирование было прервано, в приложение не пускаем
    async function checkCloneState(){
        if(ENV!=="test"||!cs) return;
        const got=await rawGetItems([KP+CLONE_STATE]);
        ui.cloneStateValue=got[KP+CLONE_STATE]||null;
        if(got[KP+CLONE_STATE]==="running") ui.cloneIncomplete=true;
    }
    function incompleteHtml(){
        return '<div class="setup"><div class="card full" style="width:100%">'
            +'<div style="font-weight:800; font-size:17px; margin-bottom:10px">Копирование не завершено</div>'
            +'<p>Предыдущее копирование данных из основной версии было прервано, тестовые данные неполные. Повторите копирование или очистите тестовые данные.</p>'

    function cloudObjFromItems(keys,items){
        const cloud=emptyData();
        for(const k of keys){
            const v=items[k]; if(!v) continue;
            try{
                const o=JSON.parse(v);
                if(k==="cfg") cloud.cfg=o;
                else if(k.indexOf("tpl_")===0) cloud.templates.push(o);

    let syncState={ last:null, count:null, busy:false };
    async function cloudLoad(){
        if(!cs||syncState.busy||ui.cloneIncomplete) return;
        syncState.busy=true;
        try{
            const keys=await csKeys();
            if(keys===null){ syncState.busy=false; return; }
            if(!keys.length){ await cloudPushAll(); syncState.last=new Date(); syncState.count=1+data.templates.length+Object.keys(data.log).length; syncState.busy=false; render(); return; }
            const items=await csGetItems(keys);
            const cloud=cloudObjFromItems(keys,items);
            // слияние по меткам времени .up: новее — побеждает; чего нет в облаке — доливаем
            const before=JSON.stringify(data);
            const push=[];
            const merged=normalizeData({ cfg:cloud.cfg, templates:cloud.templates.slice(), log:cloud.log });
            if((data.cfg.up||0)>(merged.cfg.up||0)){ merged.cfg=data.cfg; push.push(["cfg",JSON.stringify(data.cfg)]); }
            merged.cfg=normalizeData({cfg:merged.cfg}).cfg;
            for(const k of Object.keys(data.log)){
                const loc=data.log[k], cld=merged.log[k];
                if(!cld||(loc.up||0)>(cld.up||0)){ merged.log[k]=loc; push.push(["w_"+k,JSON.stringify(loc)]); }
            }
            for(const t of data.templates){
                const i=merged.templates.findIndex(function(c){return c.id===t.id;});
                if(i<0){ merged.templates.push(t); push.push(["tpl_"+t.id,JSON.stringify(t)]); }
                else if((t.up||0)>(merged.templates[i].up||0)){ merged.templates[i]=t; push.push(["tpl_"+t.id,JSON.stringify(t)]); }
            }
            data=merged;
            applyMigrations();
            syncState.last=new Date(); syncState.count=keys.length;
            if(JSON.stringify(data)!==before){ saveCache(); render(); }
            else if(ui.tab==="set") render(); // обновить строку статуса
            for(const p of push){ const v=serializeKey(p[0]); if(v!==null) await csSet(p[0],v); }
        }finally{ syncState.busy=false; }
    }

    // ============ шаблоны из текста ============
    // Строка с "3х8-12" → упражнение (имя до плана); строка без плана → название нового шаблона
    const PLAN_RE=/(\d+)\s*[хx×*]\s*(\d+)\s*(?:[-–—]\s*(\d+))?/i;
    const DATE_RE=/\d{1,2}[.\/]\d{1,2}(?:[.\/]\d{2,4})?/g;
    function parseTemplatesText(text){
        const out=[]; let cur=null;
        for(let line of String(text||"").split(/\r?\n/)){
            line=line.trim(); if(!line) continue;
            const m=line.match(PLAN_RE);
            if(m){
                let name=line.slice(0,m.index).replace(/^\s*\d+[.)]\s*/,"").replace(/[\s,;:—–-]+$/,"").replace(/\(\s*$/,"").trim();
                if(!name) continue; // строка из одних цифр (результаты) — пропускаем
                const plan=m[1]+"х"+m[2]+(m[3]?"-"+m[3]:"");
                if(!cur){ cur={name:"",exercises:[]}; out.push(cur); }
                cur.exercises.push(name+" ("+plan+")");
            } else {
                const title=line.replace(DATE_RE,"").replace(/^\s*\d+[.)]\s*/,"").replace(/[\s,;:—–-]+$/,"").trim();
                cur={name:title,exercises:[]}; out.push(cur);
            }
        }
        const res=out.filter(function(t){return t.exercises.length;});
        res.forEach(function(t,i){ if(!t.name) t.name="Шаблон "+(i+1); });
        return res;
    }

    // последние результаты по типу недели (для строк «Рабочая … / Отдых …»)
    function lastByType(name,type){
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            if(dayWeekType(k)!==type) continue;
            const hit=(data.log[k].exercises||[]).find(function(e){ return e.name.toLowerCase()===name.toLowerCase() && e.sets.length; });
            if(hit) return { date:k, str:hit.sets.map(function(s){return fmtW(s.w)+"×"+s.r;}).join(", ") };
        }
        return null;
    }
    function repRange(ex){
        const plan=ex.base?ex.plan:parseExName(ex.name).plan;
        if(!plan) return null;
        const m=plan.match(/\d+\s*[хx×*]\s*(\d+)\s*(?:[-–—]\s*(\d+))?/i);
        if(!m) return null;
        const low=parseInt(m[1],10), top=m[2]?parseInt(m[2],10):low;
        return {low,top};
    }
    function weightStep(w,exStep){
        if(exStep!=null) return exStep;
        const ds=data.cfg.defaultWeightStep;
        if(ds!=null&&ds>0) return ds;
        const raw=w*0.11;
        if(raw>=3.75) return 5;
        if(raw>=1.75) return 2.5;
        return 1;
    }
    // ============ прошлая тренировка с учётом варианта ============
    function normKey(v){ const k=v==null?"":String(v).trim().toLowerCase(); return k||null; }
    // findPrev(base, variant, weekType, maxStep): даты строго раньше текущей, по убыванию; weekType "work"/"rest" (null — любой тип).
    // Шаги (каждый — по всем датам): 1) тот же base и variant; 2) тот же base, variant=null; 3) тот же base, другой variant.
    // Для рекомендаций maxStep=2: результат шага 3 (другой вариант) для них не годится.
    // Возвращает {date, sets, str, variant, step, name} | null
    function findPrev(base,variant,weekType,maxStep){
        const bl=normKey(base), vl=normKey(variant);
        if(!bl) return null;
        const cand=[];
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            if(weekType&&dayWeekType(k)!==weekType) continue;
            for(const e of (data.log[k].exercises||[])){
                if(!e.sets||!e.sets.length) continue;
                if(normKey(exBaseOf(e))!==bl) continue;
                cand.push({k:k,e:e,v:normKey(exVariantOf(e))});
            }
        }
        let hit=cand.find(function(c){return c.v===vl;}), step=1;
        if(!hit&&vl!==null){ hit=cand.find(function(c){return c.v===null;}); step=2; }
        if(!hit&&(maxStep||3)>=3){ hit=cand.find(function(c){return c.v!==vl;}); step=3; }
        if(!hit) return null;
        return { date:hit.k, sets:hit.e.sets, str:hit.e.sets.map(function(s){return fmtW(s.w)+'×'+s.r;}).join(', '),
                 variant:exVariantOf(hit.e), step:step, name:hit.e.name };
    }
    function lastExNote(name){
        const low=name.toLowerCase();
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            const hit=(data.log[k].exercises||[]).find(function(e){return e.name.toLowerCase()===low&&e.note;});
            if(hit) return {date:k, note:hit.note};
        }
        return null;
    }
    function lastDayNote(title){
        if(!(title||'').trim()) return null;
        const low=title.toLowerCase().trim();
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            const d=data.log[k];
            if(d.note&&(d.title||'').toLowerCase().trim()===low) return {date:k, note:d.note};
        }
        return null;
    }
    function getExVariants(ex){
        const bl=normKey(exBaseOf(ex)), seen={}, out=[];
        const add=function(v){ const k=normKey(v); if(!k||seen[k]) return; seen[k]=1; out.push(String(v).trim()); };
        for(const t of data.templates) for(const b of t.blocks) for(const it of b.items){
            if(normKey(it.name)===bl&&it.vars) for(const v of it.vars) add(v);
        }
        for(const k of Object.keys(data.log)) for(const e of (data.log[k].exercises||[])){
            if(normKey(exBaseOf(e))===bl) add(exVariantOf(e));
        }
        return out;
    }
    function calcRec(ex,isRest){
        const b=exBaseOf(ex), v=exVariantOf(ex);
        const wp=findPrev(b,v,"work",2);
        if(!wp||!wp.sets.length) return null;
        const workSets=wp.sets;
        const range=repRange(ex);
        if(!range) return null;
        // For deload: use most recent session if its weight >= last work week weight
        // (prevents rest-week lighter loads from dragging down deload, but uses better rest results)
        let baseSets=workSets;
        if(isRest){
            const rp=findPrev(b,v,null,2), recentSets=rp?rp.sets:null;
            if(recentSets&&recentSets.length){
                const wb=workSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
                const rb=recentSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
                if(rb.w>=wb.w) baseSets=recentSets;
            }
        }
        const base=baseSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
        const step=weightStep(base.w,null);
        const {low,top}=range;
        const r2=function(v){return Math.round(v*100)/100;};
        if(isRest){
            if(base.r>=top) return {w:base.w, r:Math.max(1,base.r-(top<=12?4:5))};
            return {w:Math.max(0,r2(base.w-step)), r:8};
        }
        if(base.r>=top) return {w:r2(base.w+step), r:low};
        const inc=(top-base.r)>=3?2:1;
        return {w:base.w, r:Math.min(base.r+inc,top)};
    }

    // ============ shared axes chart helper (переиспользуется историей упражнения и сводкой) ============
    function niceStep(range,targetTicks){
        targetTicks=targetTicks||5;
        if(!(range>0)) return 1;
        const rough=range/targetTicks;
        const mag=Math.pow(10,Math.floor(Math.log10(rough)));
        const norm=rough/mag;
        const step=norm<1.5?1:norm<3?2:norm<7?5:10;
        return step*mag;
    }
    // points: [{k:dateKey, v:number}]; opts: {yUnit, yLabel(v), pointColor(d,i), lineColor, padL}
    function chartSvg(points,opts){
        opts=opts||{};
        const n=points.length;
        if(!n) return '';
        const pointColor=opts.pointColor||function(){return 'var(--btn)';};
        const yLabel=opts.yLabel||fmtW;
        const padL=opts.padL||36;
        const vs=points.map(function(d){return d.v;});
        const minV=Math.min.apply(null,vs), maxV=Math.max.apply(null,vs);
        const range=maxV-minV;
        const ystep=niceStep(range>0?range:Math.max(1,maxV*0.2),5);
        const ymin=Math.floor(minV/ystep)*ystep, ymax=Math.ceil(maxV/ystep)*ystep;
        const yticks=[];
        for(let y=ymin;y<=ymax+ystep*0.001;y+=ystep) yticks.push(Math.round(y*1000)/1000);
        const W=340, H=180, padR=10, padT=16, padB=26;
        const pw=W-padL-padR, ph=H-padT-padB;
        const px=function(i){ return padL+(n>1?i/(n-1)*pw:pw/2); };
        const py=function(v){ const r=ymax-ymin||1; return padT+ph-(v-ymin)/r*ph; };
        const pts=points.map(function(d,i){return px(i)+','+py(d.v);}).join(' ');
        let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:hidden" xmlns="http://www.w3.org/2000/svg">';
        for(const y of yticks){
            const ypx=Math.round(py(y));
            svg+='<line x1="'+padL+'" y1="'+ypx+'" x2="'+(W-padR)+'" y2="'+ypx+'" stroke="var(--border)" stroke-width="1"/>';
            svg+='<text x="'+(padL-4)+'" y="'+(ypx+3)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+yLabel(y)+'</text>';
        }
        if(opts.yUnit) svg+='<text x="'+(padL-4)+'" y="'+(padT-3)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+esc(opts.yUnit)+'</text>';
        const xStep=Math.max(1,Math.ceil(n/6));
        const xIdxs=[];
        for(let i=0;i<n;i+=xStep) xIdxs.push(i);
        if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
        for(const i of xIdxs){
            const anchor=i===0?'start':i===n-1?'end':'middle';
            svg+='<text x="'+Math.round(px(i))+'" y="'+(H-4)+'" font-size="9" fill="var(--mut)" text-anchor="'+anchor+'">'+esc(fmtShort(points[i].k))+'</text>';
        }
        if(n>1) svg+='<polyline points="'+pts+'" fill="none" stroke="'+(opts.lineColor||'var(--btn)')+'" stroke-width="2" stroke-linejoin="round"/>';
        points.forEach(function(d,i){
            const col=pointColor(d,i);
            svg+='<circle cx="'+Math.round(px(i))+'" cy="'+Math.round(py(d.v))+'" r="3" fill="'+col+'"/>';
            if(n<3) svg+='<text x="'+Math.round(px(i))+'" y="'+(Math.round(py(d.v))-6)+'" font-size="9" fill="'+col+'" text-anchor="middle">'+yLabel(d.v)+'</text>';
        });
        svg+='</svg>';
        return svg;
    }

    // ============ Exercise history ============
    const SERIES_COLORS=["var(--btn)","var(--green)","#5ac8fa","#bf5af2","#ff453a","#ffd60a"];
    function exBaseOf(e){ return e.base||parseExName(e.name).base; }
    function exVariantOf(e){ return e.base?(e.variant||null):parseExName(e.name).variant; }
    // записи с подходами по base (регистр не важен; план на группировку не влияет)
    function groupEntries(baseName){
        const key=String(baseName).trim().toLowerCase(), out=[];
        for(const k of Object.keys(data.log).sort()) for(const e of (data.log[k].exercises||[])){
            if(!e.sets||!e.sets.length) continue;
            if(exBaseOf(e).trim().toLowerCase()!==key) continue;
            out.push({k:k, e:e, variant:exVariantOf(e), w:e.sets.reduce(function(m,s){return Math.max(m,s.w);},0)});
        }
        return out;
    }
    // серии: по одной на variant (без учёта регистра); записи без варианта — своя серия
    function groupSeries(entries){
        const map={};
        for(const it of entries){
            const vk=(it.variant||"").trim().toLowerCase();
            const sr=map[vk]||(map[vk]={key:vk, label:it.variant?it.variant.trim():"без варианта", pts:{}, n:0});
            if(it.variant) sr.label=it.variant.trim();
            sr.pts[it.k]=Math.max(sr.pts[it.k]||0,it.w); sr.n++;
        }
        const list=Object.keys(map).map(function(k){
            const sr=map[k];
            sr.points=Object.keys(sr.pts).sort().map(function(d){return {k:d,v:sr.pts[d]};});
            return sr;
        });
        list.sort(function(a,b){ return b.n-a.n || (a.key<b.key?-1:1); });
        list.forEach(function(sr,i){ sr.color=SERIES_COLORS[i%SERIES_COLORS.length]; });
        return list;
    }
    // несколько линий на общей оси дат (ось — по объединению дат группы)
    function chartSvgSeries(series,opts){
        opts=opts||{};
        const dates=Array.from(new Set([].concat.apply([],series.map(function(s){return s.points.map(function(p){return p.k;});})))).sort();
        const n=dates.length; if(!n) return '';
        const yLabel=opts.yLabel||fmtW, padL=opts.padL||36;
        const vs=[].concat.apply([],series.map(function(s){return s.points.map(function(p){return p.v;});}));
        const minV=Math.min.apply(null,vs), maxV=Math.max.apply(null,vs), range=maxV-minV;
        const ystep=niceStep(range>0?range:Math.max(1,maxV*0.2),5);
        const ymin=Math.floor(minV/ystep)*ystep, ymax=Math.ceil(maxV/ystep)*ystep, yticks=[];
        for(let y=ymin;y<=ymax+ystep*0.001;y+=ystep) yticks.push(Math.round(y*1000)/1000);
        const W=340, H=180, padR=10, padT=16, padB=26, pw=W-padL-padR, ph=H-padT-padB;
        const px=function(i){ return padL+(n>1?i/(n-1)*pw:pw/2); };
        const py=function(v){ const r=ymax-ymin||1; return padT+ph-(v-ymin)/r*ph; };
        let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:hidden" xmlns="http://www.w3.org/2000/svg">';
        for(const y of yticks){
            const ypx=Math.round(py(y));
            svg+='<line x1="'+padL+'" y1="'+ypx+'" x2="'+(W-padR)+'" y2="'+ypx+'" stroke="var(--border)" stroke-width="1"/>';
            svg+='<text x="'+(padL-4)+'" y="'+(ypx+3)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+yLabel(y)+'</text>';
        }
        if(opts.yUnit) svg+='<text x="'+(padL-4)+'" y="'+(padT-3)+'" font-size="9" fill="var(--mut)" text-anchor="end">'+esc(opts.yUnit)+'</text>';
        const xStep=Math.max(1,Math.ceil(n/6)), xIdxs=[];
        for(let i=0;i<n;i+=xStep) xIdxs.push(i);
        if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
        for(const i of xIdxs){
            const anchor=i===0?'start':i===n-1?'end':'middle';
            svg+='<text x="'+Math.round(px(i))+'" y="'+(H-4)+'" font-size="9" fill="var(--mut)" text-anchor="'+anchor+'">'+esc(fmtShort(dates[i]))+'</text>';
        }
        for(const sr of series){
            const pts=sr.points.map(function(p){return px(dates.indexOf(p.k))+','+py(p.v);}).join(' ');
            if(sr.points.length>1) svg+='<polyline data-series="'+esc(sr.label)+'" points="'+pts+'" fill="none" stroke="'+sr.color+'" stroke-width="2" stroke-linejoin="round"/>';
            for(const p of sr.points) svg+='<circle cx="'+Math.round(px(dates.indexOf(p.k)))+'" cy="'+Math.round(py(p.v))+'" r="3" fill="'+sr.color+'"/>';
        }
        return svg+'</svg>';
    }
