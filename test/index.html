    // Проверка при запуске — только после синхронизации с CloudStorage (иначе в копию попадёт устаревший кэш); не чаще одной попытки за запуск
    async function maybeAutoBackup(){
        if(TOUR_MODE) return;
        if(ui.autoBackupTried) return;
        if(cs&&!syncState.verified) return;                       // синхронизация не завершена — копию не шлём
        if(ui.onb||onboardingDue()) return;                        // сначала приветствие; после закрытия проверка повторится
        if(ui.cloneBusy||ui.cloneIncomplete||ui.tblImport||ui.backupParsed||ui.importParsed||ui.sending) return;
        ui.autoBackupTried=true;
        if(!canSendBackup()) return;                               // адрес не задан — прежнее напоминание (баннер)
        const n=data.cfg.backupReminderDays;
        if(!n||!Object.keys(data.log).length) return;
        if(data.cfg.backupSnooze&&Date.now()<data.cfg.backupSnooze) return;
        const last=data.cfg.lastBackup?new Date(data.cfg.lastBackup).getTime():null;
        if(last!==null&&Date.now()-last<=n*86400000) return;
        if(data.cfg.autoBackup!==false){ await autoBackupSend(); return; }
        const days=daysSinceBackup();
        const i=await showDialog({title:"Пора сделать копию",text:isFinite(days)?"Последняя была "+days+" "+ruPlural(days,"день","дня","дней")+" назад":"Копия ещё не делалась",
            buttons:[{label:"Отправить в чат",primary:true},{label:"Позже"}]});
        if(i===0) await sendBackup("json"); else snoozeBackup(24);
    }
    function exportCsv(){ downloadBlob(exportFilename("csv"),new Blob([buildCsv()],{type:"text/csv;charset=utf-8"})); }
    function normDate(v){
        if(v instanceof Date && !isNaN(v)) return toKey(new Date(v.getTime()+12*3600000));
        if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
        if(typeof v==="string"){
            const s=v.trim();
            let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
            m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
        }
        return null;
    }
    // ============ импорт Excel / CSV (v1 и собственный экспорт из 4.2) ============
    // CSV: BOM, разделитель «;» / «,» / табуляция (определяется по строке заголовка), кавычки, десятичная запятая
    function parseCsvText(text){
        text=String(text).replace(/^\ufeff/,"");
        const firstLine=(function(){ let q=false,i=0; for(;i<text.length;i++){ const ch=text[i]; if(ch==='"') q=!q; else if(!q&&(ch==="\n"||ch==="\r")) break; } return text.slice(0,i); })();
        const cnt=function(d){ let n=0,q=false; for(const ch of firstLine){ if(ch==='"') q=!q; else if(!q&&ch===d) n++; } return n; };
        const delim=[";","\t",","].map(function(d){return [d,cnt(d)];}).sort(function(x,y){return y[1]-x[1];})[0][0];
        const rows=[]; let row=[], cell="", q=false;
        for(let i=0;i<text.length;i++){
            const ch=text[i];
            if(q){
                if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
                else cell+=ch;
            } else if(ch==='"') q=true;
            else if(ch===delim){ row.push(cell); cell=""; }
            else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); cell=""; rows.push(row); row=[]; }
            else cell+=ch;
        }
        if(cell!==""||row.length){ row.push(cell); rows.push(row); }
        return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!=="";}); });
    }
    function normHeader(c){ return String(c==null?"":c).trim().toLowerCase().replace(/ё/g,"е").replace(/\s+/g," "); }
    // колонки — по заголовкам, порядок не важен
    function findTableColumns(rows){
        for(let i=0;i<Math.min(rows.length,10);i++){
            const h=(rows[i]||[]).map(normHeader);
            if(h.findIndex(function(c){return c.indexOf("дата")===0;})<0) continue;
            const at=function(pred){ return h.findIndex(pred); };
            const col={ hi:i,
                date:at(function(c){return c.indexOf("дата")===0;}), title:at(function(c){return c.indexOf("трениров")===0;}),
                week:at(function(c){return c.indexOf("недел")===0;}), ex:at(function(c){return c.indexOf("упражнени")===0;}),
                variant:at(function(c){return c.indexOf("вариант")===0;}), plan:at(function(c){return c.indexOf("план")===0;}),
                set:at(function(c){return c.indexOf("подход")===0;}), w:at(function(c){return c.indexOf("вес")===0;}),
                r:at(function(c){return c.indexOf("повтор")===0;}),
                note:at(function(c){return c==="заметка"||c.indexOf("заметка упражн")===0;}), dayNote:at(function(c){return c.indexOf("заметка дня")===0;}) };
            return col;
        }
        return null;
    }
    function parseNum(v){
        if(typeof v==="number") return isFinite(v)?v:NaN;
        const t=String(v==null?"":v).replace(/\s/g,"").replace(",",".");
        return t===""?NaN:Number(t);
    }
    function weekTypeFromLabel(v){ const t=normHeader(v); return t.indexOf("рабоч")===0?"work":t.indexOf("отдых")===0?"rest":null; }
    function normPlan(v){ const t=String(v==null?"":v).trim().replace(/\s+/g,"").replace(/[xX×*]/g,"х").replace(/[–—]/g,"-"); return t||null; }
    function dayNowSets(k){ return data.log[k]?(data.log[k].exercises||[]).reduce(function(a,e){return a+((e.sets||[]).length);},0):0; }
    // rows → {days:[...], invalid, hasWeek} | {error}
    function buildTableImport(rows){
        const col=findTableColumns(rows);
        if(!col) return {error:"Не нашёл строку заголовков (колонка «Дата»)"};
        const need=[["date","Дата"],["title","Тренировка"],["ex","Упражнение"],["set","Подход"],["w","Вес, кг"],["r","Повторы"]];
        const missing=need.filter(function(n){return col[n[0]]<0;}).map(function(n){return n[1];});
        if(missing.length) return {error:"В файле нет колонок: "+missing.join(", ")};
        const byDate={}; let invalid=0;
        for(let i=col.hi+1;i<rows.length;i++){
            const row=rows[i]||[];
            const dk=normDate(row[col.date]), exCell=String(row[col.ex]==null?"":row[col.ex]).trim();
            const w=parseNum(row[col.w]), r=parseNum(row[col.r]), sn=parseNum(row[col.set]);
            if(!dk||!exCell||isNaN(w)||w<0||isNaN(r)||r<1){ invalid++; continue; }
            const day=byDate[dk]||(byDate[dk]={date:dk,title:"",weekType:null,note:"",groups:[],nFile:0});
            const t=String(row[col.title]==null?"":row[col.title]).trim(); if(t&&!day.title) day.title=t;
            if(col.week>=0&&!day.weekType) day.weekType=weekTypeFromLabel(row[col.week]);
            if(col.dayNote>=0&&!day.note){ const dn=String(row[col.dayNote]==null?"":row[col.dayNote]).trim(); if(dn) day.note=dn; }
            const pe=parseExName(exCell);
            const vCell=col.variant>=0?String(row[col.variant]==null?"":row[col.variant]).trim():"";
            const pCell=col.plan>=0?normPlan(row[col.plan]):null;
            const base=pe.base, plan=pCell||pe.plan, variant=vCell||pe.variant;
            const probe=newEx(base,plan,variant);   // применяет алиасы 1.2
            let g=day.groups.find(function(x){return x.name.toLowerCase()===probe.name.toLowerCase();});
            if(!g){ g={name:probe.name,ex:probe,rows:[],note:""}; day.groups.push(g); }
            g.rows.push({n:isNaN(sn)?g.rows.length+1:sn,i:g.rows.length,w:w,r:Math.round(r)});
            if(col.note>=0&&!g.note){ const nt=String(row[col.note]==null?"":row[col.note]).trim(); if(nt) g.note=nt; }
            day.nFile++;
        }
        const days=Object.keys(byDate).sort().map(function(k){
            const d=byDate[k], nNow=dayNowSets(k), exists=!!data.log[k];
            for(const g of d.groups) g.rows.sort(function(x,y){return x.n-y.n||x.i-y.i;});
            d.exists=exists; d.nNow=nNow;
            d.action=!exists?"add":(d.nFile>nNow?"replace":"skip");   // по умолчанию: нет даты — добавить; в файле больше подходов — заменить; иначе — пропустить
            const wi=weekInfo(k);
            d.weekFile=d.weekType||(wi?(wi.isRest?"rest":"work"):null);
            d.weekNow=exists?dayWeekType(k):null;
            return d;
        });
        return {days:days, invalid:invalid, hasWeek:col.week>=0};
    }
    function readTableFile(file){
        return new Promise(function(resolve,reject){
            const isCsv=/\.csv$/i.test(file.name)||(file.type||"").indexOf("csv")>=0;
            const reader=new FileReader();
            reader.onerror=function(){ reject(new Error("не удалось прочитать файл")); };
            reader.onload=function(e){
                try{
                    if(isCsv) return resolve(parseCsvText(e.target.result));
                    if(typeof XLSX==="undefined") return reject(new Error("Нет интернета — библиотека Excel не загрузилась"));
                    const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
                    resolve(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true}));
                }catch(err){ reject(err); }
            };
            if(isCsv) reader.readAsText(file,"utf-8"); else reader.readAsArrayBuffer(file);
        });
    }
    async function importTable(file){
        try{
            const rows=await readTableFile(file);
            const res=buildTableImport(rows);
            if(res.error){ toast(res.error); return; }
            if(!res.days.length){ toast("В файле не нашлось данных"+(res.invalid?" (неразобранных строк: "+res.invalid+")":"")); return; }
            res.fileName=file.name; ui.tblImport=res; ui.tab="set"; render();
        }catch(err){ toast("Не удалось прочитать файл: "+errText(err)); }
    }

    function tblImportApply(){
        const t=ui.tblImport; if(!t) return;
        const todo=t.days.filter(function(d){return d.action!=="skip";});
        if(!todo.length){ toast("Нечего применять — все строки пропущены"); return; }
        try{ lsSet("preimport", JSON.stringify(buildBackupDump())); }
        catch(err){ toast("Не удалось сохранить снимок перед импортом: "+errText(err)); return; }
        let nSets=0; const keys=[];
        for(const d of todo){
            const old=data.log[d.date];
            const exercises=d.groups.map(function(g){
                const ex=newEx(g.ex.base,g.ex.plan,g.ex.variant);
                ex.sets=g.rows.slice().sort(function(x,y){return x.n-y.n||x.i-y.i;}).map(function(r){return {w:r.w,r:r.r};});
                let note=g.note;
                if(!note&&old){ const o=(old.exercises||[]).find(function(e){return e.note&&e.name.toLowerCase()===ex.name.toLowerCase();}); if(o) note=o.note; }
                if(note) ex.note=note;
                return ex;
            });
            const rec={ title:d.title||(old&&old.title)||"", exercises:exercises, up:Date.now() };
            const note=d.note||(old&&old.note); if(note) rec.note=note;
            const wt=d.weekType||(function(){ const wi=weekInfo(d.date); return wi?(wi.isRest?"rest":"work"):null; })();
            if(wt) rec.weekType=wt;
            data.log[d.date]=rec; keys.push(d.date); nSets+=d.nFile;
        }
        ui.tblImport=null;
        applyMigrations(); saveCache(); render();
        hap("ok"); toast("Импортировано: дней — "+keys.length+", подходов — "+nSets);
        (async function(){ for(const k of keys) await csSet("w_"+k, JSON.stringify(data.log[k])); })();
    }

        if(!next){ render(); return; }
        next.insertAdjacentHTML("beforebegin",setRowHtml(ex,ex.sets.length-1));

    // тап по числу → input (decimal для веса, numeric для повторов); blur/Enter применяют, запятая — десятичный разделитель
    function startEditNum(btn){
        const kind=btn.dataset.kind, isW=(kind==="w"||kind==="nw");
        const ex=getDay().exercises.find(function(x){return x.id===btn.dataset.id;}); if(!ex) return;
        let cur=null;
        if(kind==="nw"||kind==="nr"){ const st=ui.nextSet[ex.id]; cur=st?(isW?st.w:st.r):null; }
        else { const sv=ex.sets[+btn.dataset.i]; cur=sv?(isW?sv.w:sv.r):null; }
        const inp=document.createElement("input");
        inp.className="num-edit num"; inp.type="text"; inp.setAttribute("inputmode",isW?"decimal":"numeric");
        inp.value=cur==null?"":fmtNum(cur);
        let cancelled=false;
        const finish=function(){
            const raw=inp.value.trim().replace(",",".");
            if(!cancelled&&raw!==""){
                const v=isW?parseFloat(raw):parseInt(raw,10);
                if(!isNaN(v)&&isFinite(v)&&(isW?v>=0:v>=1)){
                    const val=isW?r2(v):v;
                    if(kind==="nw"||kind==="nr"){ const st=nextSetState(ex,false); if(isW) st.w=val; else st.r=val; }
                    else { const day=getDay(), e2=day.exercises.find(function(x){return x.id===ex.id;}), sv=e2&&e2.sets[+btn.dataset.i];
                        if(sv){ if(isW) sv.w=val; else sv.r=val; commitDay(curDate,day); } }
                }
            }
            inp.replaceWith(btn);
            if(kind==="nw"||kind==="nr") updateNextDom(ex.id);
            else { const sv=getDay().exercises.find(function(x){return x.id===ex.id;}); const s2=sv&&sv.sets[+btn.dataset.i]; if(s2) btn.innerHTML=isW?wText(s2.w):rText(s2.r); }
        };
        inp.addEventListener("blur",finish);
        inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } else if(e.key==="Escape"){ cancelled=true; inp.blur(); } });
        btn.replaceWith(inp); inp.focus(); inp.select();
    }
    function stepNext(exId,isWeight,dir){
        const ex=getDay().exercises.find(function(x){return x.id===exId;}); if(!ex) return;
        const st=nextSetState(ex,false);
        if(isWeight){
            const base=st.w==null?0:st.w, step=weightStep(base,null);
            st.w=Math.max(0,r2(base+dir*step));
        } else st.r=Math.max(1,(st.r==null?0:st.r)+dir);
        updateNextDom(exId); hap("light");
    }

    function exCardHtml(ex, exIdx, isRest){
        const lw=findPrev(exBaseOf(ex),exVariantOf(ex),"work"), lr=findPrev(exBaseOf(ex),exVariantOf(ex),"rest");
        const showRest=lr&&(!lw||lr.date>lw.date);
        const showRec=data.cfg.view.viewRec;
        const showWarmup=data.cfg.view.viewWarmup&&exIdx<(data.cfg.warmupCount||0);
        const rec=(showRec||showWarmup)?calcRec(ex,!!isRest):null;
        let warmup=null;
        if(showWarmup){
            let rw=rec?rec.w:null;
            if(!rw){
                const wf=findPrev(exBaseOf(ex),exVariantOf(ex),"work",2), ws=wf?wf.sets:null;
                if(ws&&ws.length){ const b=ws.reduce(function(a,s){return s.w>a.w||(s.w===a.w&&s.r>a.r)?s:a;}); rw=b.w; }
            }
            if(rw>0){
                const stp=weightStep(rw,null);
                const pct=(data.cfg.warmupPercent||35)/100;
                const w=Math.floor(rw*(1-pct)/stp)*stp;

        const exNoteOpen=!!ui.exNoteOpen[ex.id];
        let h='<div class="card"><div class="ex-head"><div style="min-width:0">';

        if(data.cfg.view.viewPastNotes&&!ex.note){ const pn=lastExNote(ex.name); if(pn) h+='<div class="ex-last">'+ICON_NOTE+' '+fmtShort(pn.date)+': '+esc(pn.note)+'</div>'; }

    function calPage(){
        const parts=calMonth.split("-").map(Number), y=parts[0], m=parts[1];
        const first=new Date(y,m-1,1);
        const daysIn=new Date(y,m,0).getDate();
        const lead=(first.getDay()+6)%7;
        const today=toKey(new Date());
        const monthName=first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
        let h='<div class="card"><div class="cal-head">'
            +'<button class="cal-nav" data-act="calPrev">'+ICON_CHEVRON_LEFT+'</button>'
            +'<div class="cal-title">'+esc(monthName)+'</div>'
            +'<button class="cal-nav" data-act="calNext">'+ICON_CHEVRON_RIGHT+'</button></div><div class="cal-grid" data-tour="cal-week">';
        for(const d of ["пн","вт","ср","чт","пт","сб","вс"]) h+='<div class="cal-dow">'+d+'</div>';
        for(let i=0;i<lead;i++) h+='<div></div>';
        for(let d=1;d<=daysIn;d++){
            const key=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
            const entry=data.log[key];
            const hasSets=entry&&entry.exercises.some(function(e){return e.sets.length;});
            const wi=weekInfo(key);
            let cls="cal-day";
            if(wi&&wi.isRest) cls+=" rest";
            if(entry) cls+=" has";
            if(key===curDate) cls+=" sel";
            if(key===today) cls+=" today";
            h+='<button class="'+cls+'"'+(key===today?' data-tour="cal-day"':'')+' data-act="calGo" data-date="'+key+'">'
                +'<span class="n num">'+d+'</span>'
                +(entry&&entry.title?'<span class="t">'+esc(entry.title)+'</span>':hasSets||entry?'<span class="dotm"></span>':'')
                +'</button>';
        }
        h+='</div><div class="cal-legend">'
            +'<span><i style="background:color-mix(in srgb, var(--accent-2) 35%, transparent)"></i>неделя отдыха</span>'
            +'<span><i style="background:var(--accent)"></i>есть тренировка</span>'
            +'</div></div>';
        return h;
    }

    // ---- тема: нормализация, применение переменных на :root (без render), контраст
    const HEX_RE=/^#[0-9a-f]{6}$/i;

    const FONT_SCALES=[[0.9,"Мелкий","90%"],[1,"Обычный","100%"],[1.15,"Крупный","115%"],[1.3,"Очень крупный","130%"]];
    function fontScale(){ return (data&&data.cfg&&data.cfg.fontScale)||1; }
    function applyFontScale(){ document.documentElement.style.fontSize=(16*fontScale())+"px"; }
    function normTheme(t,acc){
        let th;
        if(t&&typeof t==="object") th=t;
        else th={base:({tg:"tg",dark:"oled",light:"light"})[t]||"tg",accent:acc||DEFAULT_THEME.accent,accent2:null,custom:{}};
        const okBase=th.base==="custom"||THEME_BASES.some(function(x){return x.id===th.base;});
        return { base:okBase?th.base:"tg", accent:HEX_RE.test(th.accent||"")?th.accent.toLowerCase():DEFAULT_THEME.accent,
                 accent2:HEX_RE.test(th.accent2||"")?th.accent2.toLowerCase():null, custom:(th.custom&&typeof th.custom==="object")?th.custom:{} };
    }
    function hexToRgb(hex){ return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}; }
    function relLum(c){ const f=function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }; return 0.2126*f(c.r)+0.7152*f(c.g)+0.0722*f(c.b); }
    function contrastRatio(a,b){ const la=relLum(a), lb=relLum(b); return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05); }
    // текст на акценте — чёрный или белый по контрасту (вычисляется автоматически)
    function accentBtnText(hex){ const c=hexToRgb(hex); return contrastRatio(c,hexToRgb(THEME_INK.dark))>=contrastRatio(c,hexToRgb(THEME_INK.light))?THEME_INK.dark:THEME_INK.light; }
    function rgbToHex(c){ return "#"+[c.r,c.g,c.b].map(function(v){ return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0"); }).join(""); }
    // реальное значение токена (color-mix и var() раскрываются браузером)
    function resolveColor(token){
        const probe=document.createElement("span");
        probe.style.cssText="position:absolute;visibility:hidden;pointer-events:none;color:var("+token+")";
        document.body.appendChild(probe);
        const col=getComputedStyle(probe).color; probe.remove();
        let m=col.match(/rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/);
        if(m) return {r:+m[1],g:+m[2],b:+m[3]};
        m=col.match(/color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/);
        if(m) return {r:+m[1]*255,g:+m[2]*255,b:+m[3]*255};
        return {r:0,g:0,b:0};
    }
    function themeBaseValues(th){

    }
    function applyTheme(){

        else {
            st.setProperty("--bg",v.bg||CUSTOM_FALLBACK.bg); st.setProperty("--surface",v.surface||v.bg||CUSTOM_FALLBACK.surface); st.setProperty("--text",v.text||CUSTOM_FALLBACK.text);
            st.setProperty("--surface-2",v.surface2||"color-mix(in srgb, var(--text) 10%, var(--surface))");
            st.setProperty("--text-muted",v.muted||"color-mix(in srgb, var(--text) 62%, var(--bg))");
        }
        st.setProperty("--accent",th.accent); st.setProperty("--on-accent",accentBtnText(th.accent));
        if(th.accent2) st.setProperty("--accent-2",th.accent2); else st.removeProperty("--accent-2");

    let themeSaveTimer=null;

    // ============ гигиена данных ============
    // канонические base упражнений шаблона, по порядку (без учёта регистра)
    function tplBaseList(t){
        const out=[];
        for(const b of (t.blocks||[])) for(const it of (b.items||[])){ const k=normKey(applyAliases(it.name,null).base); if(k&&out.indexOf(k)<0) out.push(k); }
        return out;
    }
    // «Жимовая грудь (пн)» → «жимовая»: первое слово без учёта регистра после удаления хвоста в скобках
    function tplNormName(t){ return String(t.name||"").toLowerCase().replace(/\s*\([^()]*\)\s*$/,"").trim().split(/\s+/)[0]||""; }
    function jaccard(a,b){
        if(!a.length&&!b.length) return 0;
        const sb={}; for(const x of b) sb[x]=1;
        const inter=a.filter(function(x){return sb[x];}).length;
        return inter/(a.length+b.length-inter);
    }
    // дата самой поздней тренировки, чей title совпадает с именем шаблона
    function lastUsedDate(name){
        const n=normKey(name); if(!n) return null;
        const keys=Object.keys(data.log).sort().reverse();
        for(const k of keys) if(normKey(data.log[k].title)===n) return k;
        return null;
    }
    // основной — последний использованный: имя совпадает с title самой поздней тренировки; если таких несколько или нет — максимальный up
    function pickMainTemplate(members){
        const byUp=function(list){ return list.slice().sort(function(a,b){ return (b.up||0)-(a.up||0); })[0]; };
        const names={}; members.forEach(function(t){ names[normKey(t.name)]=1; });
        const keys=Object.keys(data.log).sort().reverse();
        for(const k of keys){
            const tn=normKey(data.log[k].title);
            if(tn&&names[tn]){
                const cand=members.filter(function(t){return normKey(t.name)===tn;});
                return cand.length===1?cand[0]:byUp(cand);
            }
        }
        return byUp(members);
    }
    // группы похожих шаблонов: совпало нормализованное имя ИЛИ Жаккар множеств base ≥ 0.6 (транзитивно); группы из одного шаблона не показываются
    function findDupGroups(){
        const T=data.templates, n=T.length, parent=T.map(function(_,i){return i;});
        const find=function(i){ while(parent[i]!==i){ parent[i]=parent[parent[i]]; i=parent[i]; } return i; };
        const bases=T.map(tplBaseList), names=T.map(tplNormName);
        for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
            if((names[i]&&names[i]===names[j])||jaccard(bases[i],bases[j])>=0.6) parent[find(j)]=find(i);
        }
        const by={};
        for(let i=0;i<n;i++) (by[find(i)]||(by[find(i)]=[])).push(T[i]);
        return Object.keys(by).map(function(k){return by[k];}).filter(function(m){return m.length>1;}).map(function(members){
            const keep=pickMainTemplate(members);
            return { key:members.map(function(t){return t.id;}).sort().join("+"), members:members, keep:keep, drop:members.filter(function(t){return t.id!==keep.id;}) };
        }).sort(function(a,b){ return a.key<b.key?-1:1; });
    }
    // все ссылки на id шаблона: в коде их нет в сохранённых данных (расписания по дням недели и выбора в календаре не хранится);
    // на всякий случай перенаправляем: состояние экранов, значения-id в cfg и поля tplId/templateId в днях
    function redirectTemplateRefs(fromId,toId){
        let n=0;
        if(ui.tplDelId===fromId){ ui.tplDelId=toId; n++; }
        if(ui.editTpl&&ui.editTpl.id===fromId){ ui.editTpl.id=toId; n++; }
        let cfgChanged=false;
        const scan=function(obj){
            for(const k of Object.keys(obj)){
                const v=obj[k];
                if(v===fromId){ obj[k]=toId; n++; cfgChanged=true; }
                else if(v&&typeof v==="object") scan(v);
            }
        };
        scan(data.cfg);
        if(cfgChanged) persistCfg();
        for(const k of Object.keys(data.log).sort()){
            const d=data.log[k]; let ch=false;
            for(const f of ["tplId","templateId"]) if(d[f]===fromId){ d[f]=toId; ch=true; n++; }
            if(ch) persistDay(k);
        }
        return n;
    }
    function blockIndexOfBase(main,key){
        for(let bi=0;bi<main.blocks.length;bi++) for(const it of main.blocks[bi].items) if(normKey(applyAliases(it.name,null).base)===key) return bi;
        return -1;
    }
    function mergeVars(dst,src){
        const add=(src.vars||[]).filter(function(v){ return !(dst.vars||[]).some(function(x){ return normKey(canonVariant(x,dst.name))===normKey(canonVariant(v,dst.name)); }); });
        if(!add.length) return;
        dst.vars=(dst.vars||[]).concat(add.map(function(v){return String(v).trim();}));
        dst.alt=Math.max(1,parseInt(dst.alt,10)||1);   // alt основного не меняется
    }
    // кандидаты на добавление: упражнения удаляемых шаблонов, которых нет в основном (без повторов)
    function mergeCandidates(main,drops){
        const have=tplBaseList(main), out=[];
        for(const t of drops) for(const b of t.blocks) for(const it of b.items){
            const k=normKey(applyAliases(it.name,null).base);
            if(!k||have.indexOf(k)>=0) continue;
            have.push(k); out.push({key:k,name:it.name,plan:it.plan||"",vars:it.vars||null,from:t.name,tplId:t.id});
        }
        return out;
    }
    // применяет объединение к основному шаблону (in place); off — множество base, снятых с добавления. Возвращает число добавленных упражнений
    function mergeTemplatesInto(main,drops,off){
        let added=0;
        for(const t of drops){
            let anchor=-1;
            for(const b of t.blocks) for(const it of b.items){
                const k=normKey(applyAliases(it.name,null).base); if(!k) continue;
                const bi=blockIndexOfBase(main,k);
                if(bi>=0){
                    const dst=main.blocks[bi].items.find(function(x){return normKey(applyAliases(x.name,null).base)===k;});
                    mergeVars(dst,it); anchor=bi;
                } else if(!(off&&off[k])){
                    const item={name:it.name,plan:it.plan||""};
                    if(it.vars&&it.vars.length){ item.vars=it.vars.slice(); item.alt=Math.max(1,parseInt(it.alt,10)||1); }
                    const blk={type:"single",items:[item]};
                    if(anchor>=0){ main.blocks.splice(anchor+1,0,blk); anchor=anchor+1; } else { main.blocks.push(blk); anchor=main.blocks.length-1; }
                    added++;
                }
            }
        }
        return added;
    }
    function groupMainId(g){ return (ui.tplMain&&ui.tplMain[g.key])||g.keep.id; }
    function groupPlan(g){
        const mainId=groupMainId(g), main=g.members.find(function(t){return t.id===mainId;})||g.keep;
        const drops=g.members.filter(function(t){return t.id!==main.id;});
        return {main:main,drops:drops,extras:mergeCandidates(main,drops)};
    }
    function applyGroupMerge(g){
        const pl=groupPlan(g), off={};
        for(const x of pl.extras) if(ui.tplOff&&ui.tplOff[g.key+"|"+x.key]) off[x.key]=1;
        const before=JSON.stringify(pl.main.blocks);
        const added=mergeTemplatesInto(pl.main,pl.drops,off);
        if(JSON.stringify(pl.main.blocks)!==before) persistTpl(pl.main);   // основной пишем, только если он изменился
        for(const t of pl.drops){
            redirectTemplateRefs(t.id,pl.main.id);
            data.templates=data.templates.filter(function(x){return x.id!==t.id;});
            unpersistTpl(t.id);
        }
        return {removed:pl.drops.length,added:added};
    }
    // перед применением — снимок K("pretplmerge"); без снимка не применяем
    function mergeGroups(keys){
        try{ lsSet("pretplmerge",JSON.stringify(buildBackupDump())); }
        catch(err){ toast("Не удалось сохранить снимок перед объединением: "+errText(err)); return null; }
        let removed=0, added=0;
        for(const key of keys){
            const g=findDupGroups().find(function(x){return x.key===key;}); if(!g) continue;
            const r=applyGroupMerge(g); removed+=r.removed; added+=r.added;
        }
        toast("Удалено "+removed+" "+plural(removed,"шаблон","шаблона","шаблонов")+", добавлено "+added+" "+plural(added,"упражнение","упражнения","упражнений"));
        return {removed:removed,added:added};
    }

    function planSetsCount(plan){ const m=String(plan||"").match(/^\s*(\d+)\s*[хx×*]/i); return m?parseInt(m[1],10):null; }
    function medianOf(a){ const s=a.slice().sort(function(x,y){return x-y;}), n=s.length; return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2; }
    // проверка данных: только список, без автоисправлений
    function findDataIssues(){
        const today=toKey(new Date()), out={emptyDay:[],emptyEx:[],overPlan:[],lowWeight:[]};
        const weights={};
        const keys=Object.keys(data.log).sort();
        for(const k of keys) for(const e of (data.log[k].exercises||[])){
            const wk=normKey(exBaseOf(e))+"|"+(normKey(exVariantOf(e))||"");
            for(const st of (e.sets||[])) (weights[wk]||(weights[wk]=[])).push(st.w);
        }
        for(const k of keys){
            const exs=data.log[k].exercises||[];
            const withSets=exs.filter(function(e){return e.sets&&e.sets.length;});
            if(k<today){
                if(exs.length&&!withSets.length) out.emptyDay.push({date:k,text:"Ни у одного упражнения нет подходов"});
                else for(const e of exs) if(!(e.sets&&e.sets.length)) out.emptyEx.push({date:k,text:e.name+" — без подходов"});
            }
            for(const e of exs){
                const planN=planSetsCount(e.base?e.plan:parseExName(e.name).plan);
                if(planN!=null&&(e.sets||[]).length>=planN+1) out.overPlan.push({date:k,text:e.name+" — подходов "+e.sets.length+", в плане "+planN});
                const wk=normKey(exBaseOf(e))+"|"+(normKey(exVariantOf(e))||""), ws=weights[wk];
                if(ws&&ws.length>=3){
                    const med=medianOf(ws), low=(e.sets||[]).find(function(st){return st.w>0&&st.w<med*0.3;});
                    if(low) out.lowWeight.push({date:k,text:e.name+" — "+fmtW(low.w)+" кг при медиане "+fmtW(med)+" кг"});
                }
            }
        }
        return out;
    }

    function stripNameExtras(str,keepVariantTarget){

    function aliasAffected(kind,val){

        else { const t=parseAliasTarget(val), b=normKey(t.base), v=normKey(t.variant); for(const it of entriesOfLog()) if(normKey(exBaseOf(it.e))===b&&(!v||normKey(exVariantOf(it.e))===v)) days[it.k]=1; }

    function unmatchedNames(){
        const tpl=templateNameSet("ex"), cnt={}, shown={};
        for(const it of entriesOfLog()){ const n=exBaseOf(it.e).trim(), k=normKey(n); if(!k||tpl[k]) continue; cnt[k]=(cnt[k]||0)+1; shown[k]=n; }
        return Object.keys(cnt).map(function(k){return {name:shown[k],count:cnt[k]};}).sort(function(a,b){return b.count-a.count||(a.name<b.name?-1:1);});
    }
    function aliasFormState(f){
        const res={errLeft:"",errRight:"",warn:"",hint:"",preview:"",ok:false,left:"",right:""};
        let L=String(f.left||"").trim(), R=String(f.right||"").trim();
        if(f.kind==="ex"){
            const sl=stripNameExtras(L,false), sr=stripNameExtras(R,true);
            if(sl.stripped||sr.stripped||f.stripHint) res.hint="План и вариант убраны — они хранятся отдельно";
            L=sl.base; R=sr.base;
        }
        res.left=L; res.right=R;
        const entries=aliasEntries(f.kind).filter(function(e){ return e[0]!==f.editKey; });
        if(L&&R&&normKey(L)===normKey(R)) res.errRight="Названия совпадают";
        if(L&&entries.some(function(e){return normKey(e[0])===normKey(L);})) res.errLeft="Для этого названия алиас уже есть — отредактируй его";
        const rTarget=f.kind==="ex"?parseAliasTarget(R).base:R;
        if(R){
            const hit=entries.find(function(e){return normKey(e[0])===normKey(R)||normKey(e[0])===normKey(rTarget);});
            if(hit) res.errRight="Это название само объединено с «"+hit[1]+"» — укажи его";
        }
        if(L&&!res.errLeft){
            const tgt=entries.find(function(e){ const t=f.kind==="ex"?parseAliasTarget(e[1]).base:e[1]; return normKey(t)===normKey(L); });
            if(tgt) res.errLeft="На это название уже ссылается алиас «"+tgt[0]+"» — цепочки не поддерживаются";
        }
        if(R&&!res.errRight){
            const known=Object.assign({},logNameSet(f.kind),templateNameSet(f.kind));
            if(!known[normKey(rTarget)]) res.warn="Такого названия нет в шаблонах";
        }
        if(L){
            const st=aliasMatchStats(f.kind,L);
            res.preview=st.days?"Будет объединено: "+st.days+" "+plural(st.days,"тренировка","тренировки","тренировок")+", "+st.sets+" "+plural(st.sets,"подход","подхода","подходов"):"В истории нет записей с таким названием";
        }
        res.ok=!!(L&&R&&!res.errLeft&&!res.errRight);
        return res;
    }

    async function aliasCommit(pre){

    function aliasRetarget(kind,prevTarget,newv){
        if(normKey(prevTarget)===normKey(newv)) return null;
        if(kind==="var") return function(e){ if(e.variant&&normKey(e.variant)===normKey(prevTarget)) e.variant=newv; };
        const po=parseAliasTarget(prevTarget), pn=parseAliasTarget(newv);
        return function(e){
            if(!e.base||normKey(e.base)!==normKey(po.base)) return;
            if(po.variant&&normKey(e.variant)!==normKey(po.variant)) return;
            e.base=pn.base; if(po.variant) e.variant=pn.variant;
        };
    }

    function onbUpdate(){
        const o=ui.onb, ov=document.getElementById("onb"); if(!o||!ov) return;
        const n=onbCards().length, last=o.idx===n-1;
        ov.querySelector(".onb-track").style.transform="translateX(-"+(o.idx*100)+"%)";
        ov.querySelectorAll(".onb-dots i").forEach(function(d,i){ d.classList.toggle("on",i===o.idx); });
        ov.querySelector('[data-onb="next"]').textContent=last?"Начать":"Далее";
        ov.querySelector('[data-onb="skip"]').style.visibility=last?"hidden":"visible";
        ov.querySelector('[data-onb="help"]').style.display=last?"":"none";
        syncBackButton();

    function onbGo(i){ if(!ui.onb) return; ui.onb.idx=Math.max(0,Math.min(onbCards().length-1,i)); onbUpdate(); }
    function openOnboarding(fromSettings){
        if(ui.onb) return;
        ui.onb={idx:0,fromSettings:!!fromSettings};
        const ov=document.createElement("div"); ov.id="onb"; ov.setAttribute("role","dialog"); ov.innerHTML=onbHtml();
        let x0=null;
        ov.addEventListener("click",function(e){
            const b=e.target.closest("[data-onb]"); if(!b) return;
            const a=b.dataset.onb;
            if(a==="next"){ if(ui.onb.idx<onbCards().length-1) onbGo(ui.onb.idx+1); else closeOnboarding(true,false); }
            else if(a==="skip") closeOnboarding(true,false);
            else if(a==="help"){ closeOnboarding(true); startTour("all"); }
        });
        const vp=ov.querySelector(".onb-viewport");
        vp.addEventListener("pointerdown",function(e){ x0=e.clientX; });
        vp.addEventListener("pointerup",function(e){ if(x0===null) return; const dx=e.clientX-x0; x0=null; if(dx<-50) onbGo(ui.onb.idx+1); else if(dx>50) onbGo(ui.onb.idx-1); });
        vp.addEventListener("pointercancel",function(){ x0=null; });
        document.body.appendChild(ov);
        onbUpdate();
    }

    function helpIcons(str){
        const map={check:ICON_CHECK,plus:ICON_PLUS,minus:ICON_MINUS,trash:ICON_TRASH,timer:ICON_TIMER,note:ICON_NOTE,help:ICON_HELP,link:ICON_LINK,close:ICON_CLOSE};
        return str.replace(/\{(\w+)\}/g,function(m,k){ return map[k]?'<span class="help-ic">'+map[k]+'</span>':m; });
    }
    // текст справки → HTML: экранируем всё, кроме <b></b>, переносы строк → <br>
    function helpText(str){
        return helpIcons(esc(str).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>").replace(/\n/g,"<br>"));
    }
    function helpHtml(){
        const h=ui.help;
        let out='<div class="help-in"><button class="hist-back" data-act="helpClose">'+ICON_CHEVRON_LEFT+' Назад</button><div class="help-title">Справка</div>';
        for(const sec of HELP){
            const items=sec.items.filter(function(it){ return !it.only||it.only===ENV; });
            const open=!!h.open[sec.id];
            out+='<button class="help-head'+(open?' on':'')+'" data-act="helpToggle" data-id="'+sec.id+'" aria-expanded="'+open+'"><span class="lbl2">'+esc(sec.title)+'</span>'+(open?ICON_CHEVRON_DOWN:ICON_CHEVRON_RIGHT)+'</button>';
            if(open){
                out+='<div class="help-body" data-sec="'+sec.id+'">';
                for(const it of items) out+='<div class="help-q">'+esc(it.q)+'</div><div class="help-a">'+helpText(typeof it.a==="function"?it.a():it.a)+'</div>';
                out+='</div>';

    function makeTourData(real){
        const M=getMondayKey(toKey(new Date()));
        return normalizeData({
            cfg:{ cycle:{workWeeks:2,restWeeks:1,anchorDate:addDays(M,-21)}, timerMode:"manual", restTimerSec:90, warmupCount:1, warmupPercent:35,
                  theme:real.theme, accent:real.accent, fontScale:real.fontScale, onboardingSeen:ONBOARDING_VERSION, autoBackup:false },
            templates:[JSON.parse(JSON.stringify(TOUR_DEMO.tpl))], log:{} });
    }
    // вызывается, когда data уже демо и TOUR_MODE включён: прошлые дни + сегодняшний с записанным подходом
    function fillTourLog(){
        const D=TOUR_DEMO, M=getMondayKey(toKey(new Date()));
        for(const pd of D.past){
            const k=addDays(M,pd.off), ex=newEx(D.base,D.plan,pd.variant);
            ex.sets=pd.sets.map(function(s){ return {w:s.w,r:s.r}; });
            const wi=weekInfo(k);
            data.log[k]={ title:D.name, exercises:[ex], weekType:wi&&wi.isRest?"rest":"work", up:1 };
        }
        applyTemplate(data.templates[0]);
        const day=getDay();
        day.exercises[0].sets.push({w:D.today.w,r:D.today.r});
        commitDay(curDate,day);
    }
    function tourSteps(mode){
        const out=[];
        for(const pair of TOUR_ORDER){
            if(mode!=="all"&&pair[0]!==ui.tab) continue;
            for(const s of TOUR[pair[1]]) out.push(Object.assign({tab:pair[0]},s));
        }
        return out;
    }
    function startTour(mode){
        if(tour) return;
        if(ui.help) closeHelp();
        if(ui.onb) closeOnboarding(false);
        const steps=tourSteps(mode);
        if(!steps.length) return;
        const saved={data:data,ui:ui,cur:curDate,cal:calMonth,prog:progEx,scroll:window.scrollY};
        TOUR_MODE=true;
        ui=Object.assign({},saved.ui,{ nextSet:{}, drafts:{}, exNoteOpen:{}, variantOpen:{}, dayNoteOpen:false, weekTypeOpen:false, savingTpl:false, confirmDel:false, tplDelId:null,
            editTpl:null, histEx:null, tplParsed:null, tplFromText:false, importText:false, importParsed:null, tblImport:null, themeScreen:false, aliasScreen:false, aliasForm:null,
            hygiene:null, testScreen:false, diag:false, cloneIncomplete:false, progMode:"ex", onb:null, onbSuppressed:true, help:null, cloudChecked:true, stateChecked:true });
        data=makeTourData(saved.data.cfg); curDate=toKey(new Date()); calMonth=curDate.slice(0,7); progEx=null;
        fillTourLog();
        applyTheme();
        const el=document.createElement("div"); el.id="tour";
        el.innerHTML='<div class="tour-banner">Пример — данные не сохраняются</div><div class="tour-hole"></div>'
            +'<div class="tour-tip" role="dialog"><button class="tour-skip" data-t="skip">Пропустить</button><div class="tour-title"></div><div class="tour-text"></div>'
            +'<div class="tour-foot"><span class="tour-count"></span><span class="tour-btns"><button data-t="prev">Назад</button><button data-t="help">Вся справка</button><button class="primary" data-t="next">Далее</button></span></div>'
            +'<i class="tour-arrow"></i></div>';
        tour={ el:el, steps:steps, idx:-1, path:[], cur:null, saved:saved, mode:mode, x0:null };
        el.addEventListener("click",function(e){
            const b=e.target.closest("[data-t]"); if(!b||!tour) return;
            const a=b.dataset.t;
            if(a==="next") tourNext(); else if(a==="prev") tourPrev(); else if(a==="skip") tourEnd();
            else if(a==="help") tourEnd(tourHelpId());
        });
        el.addEventListener("pointerdown",function(e){ if(tour&&!e.target.closest("[data-t]")) tour.x0=e.clientX; });
        el.addEventListener("pointerup",function(e){
            if(!tour||tour.x0===null) return; const dx=e.clientX-tour.x0; tour.x0=null;
            if(dx<-50) tourNext(); else if(dx>50) tourPrev();
        });
        el.addEventListener("pointercancel",function(){ if(tour) tour.x0=null; });
        el.addEventListener("wheel",function(e){ e.preventDefault(); },{passive:false});
        tour.onPlace=function(){ tourPlace(false); };
        tour.onHide=function(){ if(document.hidden) tourEnd(); };
        tour.onKey=function(e){ if(e.key==="Escape") tourEnd(); };
        window.addEventListener("resize",tour.onPlace); window.addEventListener("scroll",tour.onPlace,true);
        document.addEventListener("visibilitychange",tour.onHide); document.addEventListener("keydown",tour.onKey);
        if(tg&&tg.onEvent) for(const ev of ["viewportChanged","safeAreaChanged","contentSafeAreaChanged"]) tg.onEvent(ev,tour.onPlace);
        document.body.appendChild(el);
        el.classList.add("noanim");
        if(!tourShow(0,1)){ tourEnd(); return; }
        syncBackButton();
    }
    function tourHelpId(){ const s=tour.cur; return s?s.tab:"day"; }
    // показывает ближайший шаг с найденной целью начиная с i в направлении dir; false — показывать нечего
    function tourShow(i,dir,noPush){
        const t=tour;
        while(i>=0&&i<t.steps.length){
            const s=t.steps[i];
            tourSetup(s);
            const tgt=document.querySelector('[data-tour="'+s.target+'"]');
            if(tgt){
                t.idx=i; t.cur=s; if(!noPush) t.path.push(i);
                t.el.classList.toggle("noanim",!t.shown); t.shown=true;
                tourFill(s);
                if(getComputedStyle(tgt).position!=="fixed") tgt.scrollIntoView({block:"center",inline:"nearest",behavior:"instant"});
                tourPlace(true);
                syncBackButton();
                return true;
            }
            console.warn("[tour] цель шага не найдена: "+s.target);
            i+=dir;
        }
        return false;
    }
    function tourSetup(s){
        ui.tab=s.tab; ui.editTpl=null; ui.histEx=null; ui.progMode="ex"; progEx=null;
        if(s.demo==="editor") ui.editTpl=JSON.parse(JSON.stringify(data.templates[0]));
        else if(s.demo==="prog-open") progEx=TOUR_DEMO.base;
        else if(s.demo==="summary") ui.progMode="summary";
        render();
    }
    function tourFill(s){
        const t=tour, tip=t.el.querySelector(".tour-tip"), last=t.idx===t.steps.length-1;
        tip.querySelector(".tour-title").textContent=s.title;
        tip.querySelector(".tour-text").textContent=typeof s.text==="function"?s.text():s.text;
        tip.querySelector(".tour-count").textContent=(t.idx+1)+" / "+t.steps.length;
        tip.querySelector('[data-t="prev"]').style.display=t.path.length>1?"":"none";
        tip.querySelector('[data-t="help"]').style.display=last?"":"none";
        tip.querySelector('[data-t="skip"]').style.display=last?"none":"";
        tip.querySelector('[data-t="next"]').textContent=last?"Готово":"Далее";
    }
    function tourNext(){
        const t=tour; if(!t) return;
        if(t.idx>=t.steps.length-1||!tourShow(t.idx+1,1)) tourEnd();
    }
    function tourPrev(){
        const t=tour; if(!t||t.path.length<2) return;

    function cssPx(name){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0; }
    // окно вокруг цели + подсказка со стрелкой; anim=false — мгновенно (scroll/resize)
    function tourPlace(anim){
        const t=tour; if(!t||!t.cur) return;
        const tgt=document.querySelector('[data-tour="'+t.cur.target+'"]'); if(!tgt) return;
        const el=t.el, hole=el.querySelector(".tour-hole"), tip=el.querySelector(".tour-tip"), arrow=tip.querySelector(".tour-arrow");
        if(!anim) el.classList.add("noanim");
        const vw=window.innerWidth, vh=window.innerHeight, pad=6, gap=12;
        const r=tgt.getBoundingClientRect();
        let T=r.top-pad, B=r.bottom+pad;
        if(T<0) T=0; if(B>vh) B=vh;                      // цель выше экрана — окно по границам видимой части
        const L=r.left-pad, R=r.right+pad;
        hole.style.left=L+"px"; hole.style.top=T+"px"; hole.style.width=(R-L)+"px"; hole.style.height=(B-T)+"px";
        const banner=el.querySelector(".tour-banner").getBoundingClientRect();
        const topLim=Math.max(cssPx("--sa-top")+cssPx("--csa-top"),banner.bottom)+8;
        const tb=document.getElementById("tabbar"), tbr=tb&&tb.style.display!=="none"?tb.getBoundingClientRect():null;
        const botLim=(tbr&&tbr.height>0?tbr.top:vh-cssPx("--sa-bottom")-cssPx("--csa-bottom"))-8;
        const tw=tip.offsetWidth, th=tip.offsetHeight, m=12+Math.max(cssPx("--sa-left"),cssPx("--sa-right"));
        const below=botLim-(B+gap), above=(T-gap)-topLim;
        let place=t.cur.place; if(place!=="top"&&place!=="bottom") place=null;
        if(!place) place=below>=th?"bottom":above>=th?"top":(below>=above?"bottom":"top");
        let top=place==="bottom"?B+gap:T-gap-th, fits=true;
        if(top<topLim){ top=topLim; fits=false; }
        if(top+th>botLim){ top=Math.max(topLim,botLim-th); fits=false; }
        const cx=(r.left+r.right)/2, left=Math.max(m,Math.min(vw-m-tw,cx-tw/2));
        tip.style.left=left+"px"; tip.style.top=top+"px";
        const ax=Math.max(20,Math.min(tw-20,cx-left));
        arrow.style.left=ax+"px"; arrow.style.display=fits?"":"none";
        arrow.style.top=place==="bottom"?"-0.4375rem":"auto"; arrow.style.bottom=place==="top"?"-0.4375rem":"auto";
        tip.dataset.place=place;
    }

            const d=getDay();

            if(!ex) return;
            const i=+e.target.dataset.i;

            if(setField==="w"){
                const v=parseFloat(String(e.target.value).replace(",","."));
                if(isNaN(v)||v<0){ e.target.value=s.w; return; }

        const et=e.target.dataset.et;

            if(et==="name") it.name=e.target.value.trim();

        if(chg==="anchorDate"&&e.target.value){ c.anchorDate=e.target.value; persistCfg(); render(); return; }
        if(chg==="workWeeks"){ c.workWeeks=Math.min(8,Math.max(1,parseInt(e.target.value,10)||2)); persistCfg(); render(); return; }
        if(chg==="restWeeks"){ c.restWeeks=Math.min(4,Math.max(1,parseInt(e.target.value,10)||1)); persistCfg(); render(); return; }

    function applyTemplate(t){
        const day=getDay();
        if(!day.title&&(t.title||t.name)) day.title=t.title||t.name;
        for(const b of t.blocks){
            const ssId=b.type==="superset"?uid():null;
            for(const it of b.items){
                if(!it.name) continue;
                const fam=fullEx(it);
                const vr=pickVariant(it,countBase(it.name));
                const ex=newEx(it.name,it.plan||null,vr);
                if(!day.exercises.some(function(x){return x.name.toLowerCase()===ex.name.toLowerCase();})){
                    if(ssId) ex.ss=ssId;
                    day.exercises.push(ex);
                }
            }
        }
        setDay(day);
    }
    function deleteDay(){
        delete data.log[curDate]; delete ui.drafts[curDate];
        ui.confirmDel=false; persistDay(curDate); render();

    function doAction(act,ds){
        const day=getDay();
        switch(act){
            case "setupNext":{
                const v=document.getElementById("startInput").value;
                if(!v) return;
                ui.setupDate=v; ui.setupStep=2; renderSetup();
                break;
            }
            case "setupSkip":
                data.cfg.cycle.anchorDate=ui.setupDate; ui.setupStep=1;
                persistCfg(); render();
                break;
            case "setupParse":{
                const parsed=parseTemplatesText(document.getElementById("setupText").value);
                if(!parsed.length){ toast("Не нашёл упражнений — нужен формат «Жим 3х8-12»"); return; }
                data.templates=[]; // свои шаблоны вместо дефолтных
                let nEx=0;
                for(const p of parsed){
                    const t=normalizeTpl({id:uid(),name:p.name,title:p.name,exercises:p.exercises});
                    data.templates.push(t); persistTpl(t); nEx+=p.exercises.length;
                }
                data.cfg.cycle.anchorDate=ui.setupDate; ui.setupStep=1;
                persistCfg(); render();
                hap("ok"); toast("Шаблонов: "+parsed.length+", упражнений: "+nEx);
                break;
            }
            case "etNew": ui.editTpl={id:null,name:"",blocks:[{type:"single",items:[{name:"",plan:""}]}]}; render(); break;
            case "etEdit":{
                const t=data.templates.find(function(x){return x.id===ds.id;}); if(!t) return;
                ui.editTpl=JSON.parse(JSON.stringify(t)); render(); break;
            }
            case "etCancel": ui.editTpl=null; render(); break;
            case "etAddEx": ui.editTpl.blocks.push({type:"single",items:[{name:"",plan:""}]}); render(); break;
            case "etDelItem":{
                const b=ui.editTpl.blocks[+ds.k];
                b.items.splice(+ds.i,1);
                if(!b.items.length) ui.editTpl.blocks.splice(+ds.k,1);
                else if(b.items.length===1) b.type="single";
                render(); break;
            }
            case "etBlockUp": case "etBlockDown":{
                const k=+ds.k, k2=act==="etBlockUp"?k-1:k+1, bl=ui.editTpl.blocks;
                if(k2<0||k2>=bl.length) return;
                const tmp=bl[k]; bl[k]=bl[k2]; bl[k2]=tmp;
                render(); break;
            }
            case "etItemUp": case "etItemDown":{
                const its=ui.editTpl.blocks[+ds.k].items, i=+ds.i, i2=act==="etItemUp"?i-1:i+1;
                if(i2<0||i2>=its.length) return;
                const tmp=its[i]; its[i]=its[i2]; its[i2]=tmp;
                render(); break;
            }
            case "etJoin":{
                const k=+ds.k, bl=ui.editTpl.blocks;
                if(k+1>=bl.length) return;
                bl[k]={type:"superset",items:bl[k].items.concat(bl[k+1].items)};
                bl.splice(k+1,1);
                render(); break;
            }
            case "etSplit":{
                const k=+ds.k, bl=ui.editTpl.blocks;
                const singles=bl[k].items.map(function(it){return {type:"single",items:[it]};});
                bl.splice.apply(bl,[k,1].concat(singles));
                render(); break;
            }
            case "etVarAdd":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                const inp=document.getElementById("etv-"+ds.k+"-"+ds.i);
                let v=((inp&&inp.value)||"").trim();
                if(!v){ toast("Введите название варианта"); return; }
                const al=aliasLookup(data.cfg.variantAliases,v); if(al) v=String(al).trim()||v;
                const vars=it.vars||[];
                if(vars.some(function(x){return x.trim().toLowerCase()===v.toLowerCase();})){ toast("Такой вариант уже есть"); return; }
                it.vars=vars.concat([v]); it.alt=Math.max(1,parseInt(it.alt,10)||1); it._v=true;
                render();
                const again=document.getElementById("etv-"+ds.k+"-"+ds.i); if(again) again.focus();
                break;
            }
            case "etVarDel":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                if(!it.vars) return;
                it.vars.splice(+ds.vi,1);
                if(!it.vars.length){ delete it.vars; delete it.alt; }
                it._v=true;
                render(); break;
            }
            case "etVarsToggle":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                const showing=it._v===true||(it._v!==false&&!!it.vars);
                it._v=!showing;
                render(); break;
            }
            case "etSave":{
                const t=normalizeTpl(JSON.parse(JSON.stringify(ui.editTpl)));
                t.blocks.forEach(function(b){ b.items=b.items.filter(function(it){return it.name;}); });
                t.blocks=t.blocks.filter(function(b){return b.items.length;});
                t.blocks.forEach(function(b){ b.items.forEach(function(it){ delete it._v; }); if(b.items.length===1) b.type="single"; });
                if(!t.name){ toast("Дайте шаблону название"); return; }
                if(!t.blocks.length){ toast("Добавьте хотя бы одно упражнение"); return; }
                t.title=t.name;
                if(!t.id){ t.id=uid(); data.templates.push(t); }
                else { const i=data.templates.findIndex(function(x){return x.id===t.id;}); if(i>=0) data.templates[i]=t; else data.templates.push(t); }
                persistTpl(t); ui.editTpl=null; render();
                hap("ok"); toast("Шаблон «"+t.name+"» сохранён");
                break;
            }
            case "tplFromText": ui.tplFromText=true; render(); break;
            case "tplTextCancel": ui.tplFromText=false; ui.tplParsed=null; render(); break;
            case "tplTextParse":{
                const parsed=parseTemplatesText(document.getElementById("tplText").value);
                if(!parsed.length){ toast("Не нашёл упражнений — нужен формат «Жим 3х8-12»"); return; }
                ui.tplParsed=parsed.map(function(t){
                    return { name:t.name, exercises:t.exercises.map(function(s){ const p=splitPlan(s); return {name:p.name, plan:p.plan}; }) };
                });
                render();
                break;
            }
            case "tplParsedDelTpl":
                if(ui.tplParsed){ ui.tplParsed.splice(+ds.ti,1); render(); }
                break;
            case "tplParsedDelEx":{
                const t=ui.tplParsed&&ui.tplParsed[+ds.ti];
                if(t){ t.exercises.splice(+ds.ei,1); render(); }
                break;
            }
            case "tplTextSave":{
                let hasEmptyName=false;
                for(const t of ui.tplParsed) for(const it of t.exercises) if(!it.name||!it.name.trim()) hasEmptyName=true;
                if(hasEmptyName){ toast("Укажите название для всех упражнений"); render(); return; }
                const toSave=ui.tplParsed.filter(function(t){return t.exercises.length;});
                if(!toSave.length){ toast("Добавьте хотя бы одно упражнение"); return; }
                let nEx=0;
                toSave.forEach(function(p,i){
                    const name=(p.name||"").trim()||("Шаблон "+(i+1));
                    const old=data.templates.find(function(t){return t.name===name;});
                    if(old){ data.templates=data.templates.filter(function(t){return t.id!==old.id;}); unpersistTpl(old.id); }
                    const exercises=p.exercises.map(function(it){return it.plan?it.name+" ("+it.plan+")":it.name;});
                    const t=normalizeTpl({id:uid(),name:name,title:name,exercises:exercises});
                    data.templates.push(t); persistTpl(t); nEx+=exercises.length;
                });
                const n=toSave.length;
                ui.tplParsed=null; ui.tplFromText=false; render();
                hap("ok"); toast("Шаблонов: "+n+", упражнений: "+nEx);
                break;
            }
            case "openCal": ui.tab="cal"; ui.histEx=null; calMonth=curDate.slice(0,7); hap("light"); render(); break;
            case "openHist": ui.histEx=ds.name; render(); break;
            case "histBack": ui.histEx=null; render(); break;
            case "histVariant": ui.histEx=ds.name; render(); break;
            case "noteToggle": ui.dayNoteOpen=!ui.dayNoteOpen; render(); break;
            case "exNoteToggle": ui.exNoteOpen[ds.id]=!ui.exNoteOpen[ds.id]; render(); break;
            case "variantToggle": ui.variantOpen[ds.id]=!ui.variantOpen[ds.id]; render(); break;
            case "applyVariant":{
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                setExVariant(ex,ds.variant||null); if(!ex.sets.length) delete ui.nextSet[ex.id];
                ui.variantOpen[ds.id]=false;
                setDay(day); break;
            }
            case "newVariant":{
                const inp=document.getElementById("nv-"+ds.id);
                const v=(inp&&inp.value.trim())||''; if(!v) return;
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                setExVariant(ex,v); if(!ex.sets.length) delete ui.nextSet[ex.id];
                const base=composeName(ex.base,ex.plan,null), cv=ex.variant||v;
                const baseLow=base.toLowerCase();
                for(const t of data.templates){
                    let found=false;
                    for(const b of t.blocks){
                        const it=b.items.find(function(i){return fullEx(i).toLowerCase()===baseLow;});
                        if(it){ if(!it.vars) it.vars=[]; if(it.vars.indexOf(cv)<0){ it.vars.push(cv); if(!it.alt) it.alt=1; } persistTpl(t); found=true; break; }

                if(!parsed.length){ toast("Не нашёл тренировок — проверь формат (дата ДД.ММ, упражнения с Nх…)"); return; }
                const todayKey=toKey(new Date());
                parsed.forEach(function(w){

                        e.name=canonicalExName(e.name); e.id=uid();

            }
            case "importConfirm":{
                if(!ui.importParsed) return;
                // Validate dates
                ui.importParsed.forEach(function(w){ delete w._dateError; });
                let hasDateErr=false;
                ui.importParsed.forEach(function(w){
                    if(!w.date||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)){ w._dateError=true; hasDateErr=true; }
                });
                if(hasDateErr){ toast("Укажите дату для всех тренировок"); render(); return; }
                const seenDates=new Set();
                for(const w of ui.importParsed){
                    if(seenDates.has(w.date)){ toast("Даты тренировок не должны повторяться"); return; }

                let hasNameErr=false, hasSetsErr=false;
                for(const w of ui.importParsed) for(const e of w.exercises){
                    if(!e.name||!e.name.trim()) hasNameErr=true;

                if(hasSetsErr){ toast("Проверьте строку подходов — есть нераспознанные значения"); render(); return; }
                const toSync=[];
                let nDays=0, nEx=0, nSets=0;
                for(const w of ui.importParsed){
                    if(data.log[w.date]&&w.conflicts==="skip") continue;
                    const exercises=w.exercises.map(function(e){

                        const x=newEx(pe.base,pe.plan,pe.variant,{id:e.id}); x.sets=e.sets; return x;
                    });

                (async function(){ for(const dk of toSync) await csSet("w_"+dk, JSON.stringify(data.log[dk])); })();

            case "prev": curDate=addDays(curDate,-1); ui.confirmDel=false; render(); break;

            case "aliasNew": ui.aliasForm={kind:"ex",left:"",right:"",editKey:null}; render(); break;
            case "aliasEdit":{
                const ent=aliasEntries(ds.kind).find(function(e){return e[0]===ds.key;}); if(!ent) return;
                ui.aliasForm={kind:ds.kind,left:ent[0],right:ent[1],editKey:ent[0]}; render(); break;
            }
            case "aliasFromUnmatched": ui.aliasForm={kind:"ex",left:ds.name,right:"",editKey:null}; render(); break;
            case "aliasFormKind": if(ui.aliasForm&&!ui.aliasForm.editKey){ ui.aliasForm.kind=ds.kind; render(); } break;
            case "aliasFormCancel": ui.aliasForm=null; render(); break;
            case "aliasUnmatchedToggle":{ const now=lsGet("al_unm_collapsed")!=="0"; try{ lsSet("al_unm_collapsed",now?"0":"1"); }catch(err){ toast("Не удалось запомнить состояние блока"); } render(); break; }
            case "aliasSave":{
                const f=ui.aliasForm; if(!f) return;
                const r=aliasFormState(f); if(!r.ok) return;
                const entries=aliasEntries(f.kind); let pre=null;
                if(f.editKey){
                    const i=entries.findIndex(function(e){return e[0]===f.editKey;});
                    if(i>=0){ pre=aliasRetarget(f.kind,entries[i][1],r.right); entries[i]=[r.left,r.right]; }
                } else entries.push([r.left,r.right]);
                aliasWrite(f.kind,entries); ui.aliasForm=null;
                aliasCommit(pre); break;
            }
            case "aliasDelAsk":{
                const kind=ds.kind, key=ds.key;
                showDialog({title:"Удалить алиас?",text:"«"+key+"» больше не будет объединяться. Уже пересчитанные записи сохранят каноническое название.",buttons:[{label:"Удалить",primary:true},{label:"Отмена"}]}).then(function(i){
                    if(i!==0) return;
                    aliasWrite(kind,aliasEntries(kind).filter(function(e){return e[0]!==key;}));
                    aliasCommit(null);
                });
                break;
            }
            case "clearTest": clearTestData(); break;
            case "diagOpen": if(ENV!=="test") break; ui.diag=true; ui.diagData=null; render(); collectDiag().then(render); break;
            case "diagClose": ui.diag=false; render(); break;
            case "diagCopy":
                copyToClipboard(diagReportText()).then(function(){ toast("Отчёт скопирован"); }).catch(function(){ toast("Не удалось скопировать — выделите текст отчёта вручную"); });
                break;
            case "backupCopy":{
                const dump=buildBackupDump();
                copyToClipboard(JSON.stringify(dump)).then(function(){
                    data.cfg.lastBackup=new Date().toISOString(); persistCfg(); render();
                    toast("Скопировано. Вставьте в «Избранное» в Telegram");
                }).catch(function(){ toast("Не удалось скопировать — попробуйте «Скачать файл»"); });
                break;
            }
            case "backupRestoreToggle":
                ui.backupRestoreOpen=!ui.backupRestoreOpen;
                if(!ui.backupRestoreOpen){ ui.backupParsed=null; ui.backupConfirmStep=0; }
                render(); break;
            case "backupParseText":{
                const raw=(document.getElementById("backupText")||{}).value||"";
                let obj;
                try{ obj=JSON.parse(raw); }catch(e){ toast("Не удалось разобрать JSON"); return; }
                if(!isBackupDump(obj)){ toast("Это не похоже на резервную копию Gym Tracker"); return; }
                ui.backupParsed=obj; ui.backupParsedSrc="paste"; ui.backupMode="merge"; ui.backupConfirmStep=0;
                render();
                break;
            }
            case "backupSnapshotRestore":{
                const snap=getSnapshot();
                if(!snap){ toast("Локального снимка пока нет"); return; }
                ui.backupRestoreOpen=true; ui.backupParsed=snap; ui.backupParsedSrc="snapshot"; ui.backupMode="merge"; ui.backupConfirmStep=0;
                render();
                break;
            }
            case "backupReplaceAsk": ui.backupConfirmStep=1; render(); break;
            case "backupConfirmNext": ui.backupConfirmStep=2; render(); break;
            case "backupConfirmCancel": ui.backupConfirmStep=0; render(); break;
            case "backupApplyGo":{
                if(!ui.backupParsed) return;
                const mode=ui.backupMode;
                if(mode==="replace"&&ui.backupConfirmStep!==2) return;
                // снимок текущих данных перед применением: K("prerestore") в localStorage; без него не применяем
                try{ lsSet("prerestore", JSON.stringify(buildBackupDump())); }
                catch(err){ toast("Не удалось сохранить снимок перед восстановлением: "+errText(err)); return; }
                const res=applyBackupDump(ui.backupParsed, mode);
                ui.backupParsed=null; ui.backupParsedSrc=null; ui.backupRestoreOpen=false; ui.backupConfirmStep=0; ui.backupMode="merge";
                applyTheme(); render();
                hap("ok");
                if(res.cloudReplace){
                    toast("Данные заменены: дней — "+res.days+", шаблонов — "+res.tpl+". Синхронизация с облаком…");
                    cloudReplaceAll().then(function(){ toast("Облако обновлено"); });
                } else {
                    toast("Объединено: добавлено дней — "+res.days+", заменено — "+res.replaced+", шаблонов — "+res.tpl);
                    (async function(){
                        for(const dk of res.toSyncDays) await csSet("w_"+dk, JSON.stringify(data.log[dk]));
                        for(const t of res.toSyncTpl){ const cur=data.templates.find(function(x){return x.id===t.id;})||t; await csSet("tpl_"+t.id, JSON.stringify(cur)); }
                    })();
                }
                break;
            }
            case "backupApplyCancel":
                ui.backupParsed=null; ui.backupParsedSrc=null; ui.backupRestoreOpen=false; ui.backupConfirmStep=0; ui.backupMode="merge";
                render(); break;
            case "bannerBackupOpen": ui.tab="set"; hap("light"); render(); break;
            case "bannerBackupSnooze": data.cfg.backupSnooze=Date.now()+3*86400000; persistCfg(); render(); break;

            case "addEx":{
                const inp=document.getElementById("newEx");
                const name=inp.value.trim(); if(!name) return;
                const pn=parseExName(name); day.exercises.push(newEx(pn.base,pn.plan,pn.variant));
                hap("light"); setDay(day); break;
            }
            case "delEx":{
                const i=day.exercises.findIndex(function(x){return x.id===ds.id;}); if(i<0) return;
                const removed=day.exercises[i], remDate=curDate;
                day.exercises.splice(i,1);
                hap("medium"); setDay(day);
                toast("«"+removed.name.slice(0,24)+(removed.name.length>24?"…":"")+"» удалено","Вернуть",function(){
                    const d2=dayFor(remDate);
                    d2.exercises.splice(Math.min(i,d2.exercises.length),0,removed);
                    commitDay(remDate,d2); render();
                });
                break;
            }
            case "syncNow":
                cloudLoad().then(function(){ toast(syncState.last?"Синхронизировано · записей: "+syncState.count:"Не удалось связаться с облаком"); });
                break;

            case "wipe1": ui.wipeStep=1; render(); break;
            case "wipe2": ui.wipeStep=2; render(); break;
            case "wipeNo": ui.wipeStep=0; render(); break;
            case "wipeYes":
                (async function(){
                    ui.wipeStep=0;
                    const keys=await csKeys();
                    if(keys) for(const k of keys) await csDel(k);
                    try{ lsDel(CACHE_KEY); lsDel(SNAPSHOT_KEY); }catch(e){}
                    data=emptyData();
                    data.templates=makeDefaultTemplates();
                    syncState.last=null; syncState.count=null; warnedCloud=false;
                    curDate=toKey(new Date()); ui.tab="day";
                    saveCache(); render();
                    hap("ok"); toast("Все данные удалены");
                })();
                break;

            case "addSet":{
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                const st=nextSetState(ex,false);
                if(st.w==null||st.r==null||!(st.r>=1)){ toast("Задайте вес и повторы"); return; }
                ex.sets.push({w:st.w,r:st.r});
                ui.nextSet[ex.id]={w:st.w,r:st.r};      // следующий подход — значениями только что записанного
                commitDay(curDate,day);                  // сохранение без полного render()
                hap("light");
                if(data.cfg.timerMode==="auto") startTimer();
                appendSetDom(ex,false);
                break;
            }
            case "editNum": startEditNum(actEl); break;
            case "stepW": stepNext(ds.id,true,parseInt(ds.dir,10)); break;
            case "stepR": stepNext(ds.id,false,parseInt(ds.dir,10)); break;
            case "delSet":{
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                const i=Number(ds.i);
                lastDel={date:curDate,exId:ds.id,i:i,set:ex.sets[i]};
                ex.sets.splice(i,1);
                hap("medium"); setDay(day);
                toast("Подход удалён","Вернуть",function(){
                    if(!lastDel) return;
                    const d2=dayFor(lastDel.date);
                    let ex2=d2.exercises.find(function(x){return x.id===lastDel.exId;});
                    if(!ex2) return;
                    ex2.sets.splice(Math.min(lastDel.i,ex2.sets.length),0,lastDel.set);
                    const dd=lastDel.date; lastDel=null;
                    commitDay(dd,d2); render();
                });
                break;
            }
            case "copyLast":{
                const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
                if(!dates.length) return;
                const prev=data.log[dates[0]];
                if(!day.title&&prev.title) day.title=prev.title;
                for(const p of prev.exercises)
                    if(!day.exercises.some(function(x){return x.name.toLowerCase()===p.name.toLowerCase();}))
                        day.exercises.push(exShell(p));
                setDay(day); break;
            }
            case "tplStart": ui.savingTpl=true; render(); break;
            case "tplCancel": ui.savingTpl=false; render(); break;
            case "tplSave":{
                const name=(document.getElementById("tplName").value||"").trim();
                if(!name||!day.exercises.length) return;
                const old=data.templates.find(function(t){return t.name===name;});
                if(old){ data.templates=data.templates.filter(function(t){return t.id!==old.id;}); unpersistTpl(old.id); }
                const t=normalizeTpl({id:uid(),name:name,title:day.title||"",exercises:day.exercises.map(function(x){return x.base?composeName(x.base,x.plan,null):x.name;})});
                data.templates.push(t);
                ui.savingTpl=false; persistTpl(t); render();
                hap("ok"); toast("Шаблон «"+name+"» сохранён");
                break;
            }
            case "tplApply":{
                const t=data.templates.find(function(x){return x.id===ds.id;}); if(t) applyTemplate(t);
                break;
            }
            case "tplApplyGo":{
                const t=data.templates.find(function(x){return x.id===ds.id;}); if(!t) return;
                applyTemplate(t); ui.tab="day"; hap("ok"); render();
                toast("Шаблон применён к "+fmtShort(curDate));
                break;
            }
            case "tplDelAsk": ui.tplDelId=ds.id; render(); break;
            case "tplDelNo": ui.tplDelId=null; render(); break;
            case "tplDelYes":{
                data.templates=data.templates.filter(function(t){return t.id!==ds.id;});
                unpersistTpl(ds.id); ui.tplDelId=null; render();
                toast("Шаблон удалён");
                break;
            }
            case "selectProg": progEx=(progEx!=null&&progEx.trim().toLowerCase()===ds.name.trim().toLowerCase()?null:ds.name); render(); break;
            case "progVariant": progEx=ds.name; render(); break;
            case "progMode": ui.progMode=ds.mode; render(); break;
            case "progPeriod": ui.progPeriod=ds.period; render(); break;
            case "fontScale":{
                const v=parseFloat(ds.v); if(!FONT_SCALES.some(function(f){return f[0]===v;})) return;
                data.cfg.fontScale=v; applyFontScale(); persistCfg();
                document.querySelectorAll("#fontSeg button").forEach(function(b){ b.classList.toggle("on",parseFloat(b.dataset.v)===v); });
                fitVariantButtons(); break;   // без полного render(): размеры в rem меняются сами
            }
            case "themeOpen": ui.themeScreen=true; render(); break;
            case "themeClose": ui.themeScreen=false; render(); break;
            case "themeBase": themeUpdate(function(t){ t.base=ds.v; },true); break;
            case "themeAccent": themeUpdate(function(t){ t.accent=ds.v; },true); break;
            case "themeAccent2": themeUpdate(function(t){ t.accent2=ds.v||null; },true); break;
            case "themeResetAsk":
                showDialog({title:"Сбросить тему?",text:"Основа, акцент и свои цвета вернутся к стандартным.",buttons:[{label:"Сбросить",primary:true},{label:"Отмена"}]}).then(function(i){
                    if(i!==0) return;
                    themeUpdate(function(t){ t.base=DEFAULT_THEME.base; t.accent=DEFAULT_THEME.accent; t.accent2=null; t.custom={}; },true);
                });
                break;
            case "weekTypeToggle": ui.weekTypeOpen=!ui.weekTypeOpen; render(); break;
            case "setWeekType":{
                const mKey=getMondayKey(curDate);
                if(!data.cfg.weekOverrides) data.cfg.weekOverrides={};
                if(ds.type==='reset'){
                    delete data.cfg.weekOverrides[mKey];
                } else {
                    data.cfg.weekOverrides[mKey]={type:ds.type,index:parseInt(ds.index,10)||0};
                }
                // Update weekType on existing day entry so recommendations stay correct
                const d2=data.log[curDate];
                if(d2){ const wi2=weekInfo(curDate); if(wi2) d2.weekType=wi2.isRest?"rest":"work"; d2.up=Date.now(); data.log[curDate]=d2; persistDay(curDate); }
                persistCfg(); ui.weekTypeOpen=false;
                toast(ds.type==='reset'?"Тип недели сброшен (по циклу)":"Неделя задана вручную");
                render(); break;
            }
            case "delWeekOverride":
                if(data.cfg.weekOverrides) delete data.cfg.weekOverrides[ds.key];
                persistCfg(); render(); break;
        }
    }

    // ============ init ============
    (function init(){
        const hadCache=loadCache();
        if(!hadCache){
            if(migrateOld()) toast("Данные перенесены из старой версии");
            else if(cs){ ui.needDefaults=true; saveCache(); }   // облако ещё не проверено — шаблоны по умолчанию создадим после проверки
            else { data.templates=makeDefaultTemplates(); saveCache(); }
        }
        applyMigrations();
        applyTheme();
        if(tg&&tg.BackButton&&tg.BackButton.onClick) tg.BackButton.onClick(function(){ const a=currentBackAction(); if(a) a(); });
        if(ENV==="test"){
            const b=document.createElement("div"); b.id="envBadge"; b.className="env-badge env-fixed"; b.textContent="TEST"; document.body.appendChild(b);
        }
        render();
        // до первой проверки облака мастер в test не показываем: тестовые данные могут уже лежать в tst_-ключах
        const cloudChecked=function(){ if(!ui.cloudChecked){ ui.cloudChecked=true; render(); } };
        setTimeout(function(){ ui.stateChecked=true; cloudChecked(); },6000);
        checkCloneState().then(function(){ ui.stateChecked=true; },function(e){ ui.stateChecked=true; ui.lastCloneError="Шаг «Проверка маркера клонирования»: "+errText(e); })
            .then(function(){ render(); return cloudLoad(); }).then(cloudChecked,cloudChecked).then(maybeAutoBackup); // фоновая синхронизация с Telegram CloudStorage
    })();
</script>
</body>
</html>
