<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TEST · Gym Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root{
            /* Цветовые токены. Все цвета интерфейса — только через эти переменные; основа и акцент задаются темой (applyTheme), «Как в Telegram» берёт themeParams */
            --bg:         var(--tg-theme-bg-color, #09090b);
            --surface:    var(--tg-theme-secondary-bg-color, #18181b);
            --text:       var(--tg-theme-text-color, #f4f4f5);
            --text-muted: var(--tg-theme-hint-color, #a1a1aa);
            --surface-2:  color-mix(in srgb, var(--text) 10%, var(--surface));
            --accent:     #ff9f0a;
            --on-accent:  #09090b;
            --accent-2:   var(--accent);
            --danger:     #f87171;
            --on-danger:  #09090b;
            --warn:       #fbbf24;
            --black:      #000000;
            --border:     color-mix(in srgb, var(--text) 18%, transparent);
            --accent-bg:  color-mix(in srgb, var(--accent) 14%, transparent);
            --accent-2-bg:color-mix(in srgb, var(--accent-2) 14%, transparent);
            --danger-bg:  color-mix(in srgb, var(--danger) 12%, transparent);
            /* линии графиков (первая — акцент) */
            --c2:#5ac8fa; --c3:#bf5af2; --c4:#30d158; --c5:#ff453a; --c6:#ffd60a;
            --tour-bg:#f7f7f8; --tour-ink:#18181b; --tour-ink-2:#3f3f46; --tour-muted:#52525b; --tour-btn:#e4e4e7;
            --touch:max(44px,2.75rem); --touch-w:44px; --touch-2:max(52px,3.25rem);
            /* safe-area и высота viewport: переменные Telegram, для старых клиентов — env()/100vh; JS обновляет их по событиям без render() */
            --sa-top:var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            --sa-bottom:var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
            --sa-left:var(--tg-safe-area-inset-left, env(safe-area-inset-left, 0px));
            --sa-right:var(--tg-safe-area-inset-right, env(safe-area-inset-right, 0px));
            --csa-top:var(--tg-content-safe-area-inset-top, 0px);
            --csa-bottom:var(--tg-content-safe-area-inset-bottom, 0px);
            --stable-h:var(--tg-viewport-stable-height, 100vh);
        }
        *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
        html,body{margin:0; overflow-x:hidden; max-width:100%}
        body{background:var(--bg); color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:0.9375rem;
            min-height:var(--stable-h);
            padding-top:calc(var(--sa-top) + var(--csa-top));
            padding-bottom:calc(4rem + var(--sa-bottom) + var(--csa-bottom))}
        body::before{content:""; position:fixed; top:0; left:0; right:0; height:calc(var(--sa-top) + var(--csa-top)); background:var(--bg); z-index:30; pointer-events:none}
        #app{max-width:480px; margin:0 auto; padding:0 max(0.875rem, var(--sa-left)) 1.5rem max(0.875rem, var(--sa-right))}
        button{font-family:inherit; font-size:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0}
        input:not([type=checkbox]):not([type=radio]):not([type=color]), select{min-height:var(--touch)}
        input{font-family:inherit; font-size:0.9375rem; color:var(--text); background:var(--surface);
            border:1px solid var(--border); border-radius:0.75rem; padding:0.5625rem 0.75rem; outline:none; width:100%}
        input:focus{border-color:var(--accent)}
        input::placeholder{color:var(--text-muted); opacity:.7}
        textarea{font-family:inherit; font-size:0.875rem; color:var(--text); background:var(--surface);
            border:1px solid var(--border); border-radius:0.75rem; padding:0.625rem 0.75rem; outline:none; width:100%;
            min-height:8.75rem; resize:vertical; line-height:1.5}
        textarea:focus{border-color:var(--accent)}
        textarea::placeholder{color:var(--text-muted); opacity:.7}
        .num{font-variant-numeric:tabular-nums}
        svg.icon{width:1.125rem; height:1.125rem; flex-shrink:0; vertical-align:-0.25rem}

        header{position:sticky; top:calc(var(--sa-top) + var(--csa-top)); z-index:10; background:var(--bg);
            border-bottom:1px solid var(--border); margin:0 -0.875rem; padding:0.625rem 0.875rem 0.375rem}
        .strip{display:flex; gap:0.25rem; height:0.5rem; border-radius:6.1875rem; overflow:hidden; position:relative}
        .strip>i{flex:1}
        .s-work{background:color-mix(in srgb, var(--accent) 35%, transparent)}
        .s-rest{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent-2) 45%, transparent) 0 0.25rem, color-mix(in srgb, var(--accent-2) 18%, transparent) 0.25rem 0.5rem)}
        .dot{position:absolute; top:0; width:0.5rem; height:0.5rem; border-radius:50%; background:var(--text); box-shadow:0 0 4px color-mix(in srgb, var(--black) 50%, transparent)}
        .strip-labels{display:flex; justify-content:space-between; font-size:0.625rem; color:var(--text-muted); margin-top:0.25rem}

        .env-badge{display:inline-block; background:var(--accent); color:var(--on-accent); font-weight:800; font-size:0.6875rem; letter-spacing:.08em; border-radius:0.375rem; padding:2px 0.5rem; line-height:1.3}
        .alias-row{display:flex; align-items:center; gap:0.375rem; margin-top:0.5rem}
        .alias-row input{flex:1; min-width:0; min-height:var(--touch)}
        .alias-arrow{flex-shrink:0; color:var(--text-muted)}
        .alias-del{flex-shrink:0; min-width:var(--touch-w); min-height:var(--touch); justify-content:center}
        .env-fixed{position:fixed; z-index:1000; pointer-events:none;
            top:calc(var(--csa-top) + var(--sa-top) + 0.25rem);
            right:calc(var(--sa-right) + 0.375rem)}

        .sec-sub{font-size:0.75rem; color:var(--text-muted); margin:0 0 0.375rem; line-height:1.35}
        .warn,.note.warn{color:var(--warn)}
        .link-row{display:flex; align-items:center; gap:0.5rem; width:100%; min-height:var(--touch); text-align:left; padding:0.375rem 0; border-top:1px solid var(--border)}
        .link-row:first-child{border-top:none}
        .link-row .lbl2{flex:1; min-width:0}
        .link-row .cnt{color:var(--text-muted)}
        .link-row svg.icon{color:var(--text-muted)}
        #dlg{position:fixed; inset:0; z-index:3500; background:color-mix(in srgb, var(--black) 60%, transparent); display:flex; align-items:center; justify-content:center; padding:calc(1.5rem + var(--sa-top)) 1.5rem calc(1.5rem + var(--sa-bottom))}
        .dlg-card{background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:1.25rem; max-width:360px; width:100%; box-shadow:0 8px 32px color-mix(in srgb, var(--black) 40%, transparent)}
        .dlg-title{font-weight:800; font-size:1.0625rem; margin-bottom:0.5rem}
        .dlg-text{color:var(--text-muted); font-size:0.875rem; line-height:1.45; white-space:pre-wrap; word-break:break-word}
        .dlg-btns{display:flex; flex-direction:column; gap:0.5rem; margin-top:1rem}
        .al-explain p{margin:0 0 0.5rem; color:var(--text-muted); font-size:0.8125rem; line-height:1.45}
        .al-explain p:last-child{margin:0}
        .al-card{display:flex; align-items:flex-start; gap:0.5rem; padding:0.625rem 0.75rem; background:var(--surface); border:1px solid var(--border); border-radius:0.75rem; margin-top:0.5rem; cursor:pointer}
        .al-txt{flex:1; min-width:0; overflow-wrap:anywhere; word-break:break-word}
        .al-arrow{color:var(--text-muted)}
        .al-cap{font-size:0.6875rem; color:var(--text-muted); margin-top:0.125rem}
        .al-old{overflow-wrap:anywhere}
        .al-new{font-weight:700; overflow-wrap:anywhere}
        .al-divider{display:flex; align-items:center; gap:0.5rem; margin:0.5rem 0; color:var(--text-muted)}
        .al-divider i{flex:1; height:1px; background:var(--text-muted)}
        .al-divider svg.icon{width:1rem; height:1rem; vertical-align:0}
        .al-count{font-size:0.75rem; color:var(--text-muted); margin-top:2px}
        .al-del{flex:0 0 var(--touch-w); width:var(--touch-w); height:var(--touch); margin:-0.5rem -0.5rem -0.5rem 0; display:flex; align-items:center; justify-content:center; color:var(--danger)}
        .al-err{color:var(--danger); font-size:0.8125rem; margin-top:0.375rem}
        .al-warn{color:var(--warn); font-size:0.8125rem; margin-top:0.375rem}
        .al-hint,.al-preview{color:var(--text-muted); font-size:0.8125rem; margin-top:0.375rem}
        .seg{display:flex; background:var(--surface-2); border-radius:0.625rem; padding:2px; gap:2px}
        .seg button{flex:1; min-width:0; min-height:var(--touch); padding:0 0.25rem; border-radius:0.5rem; color:var(--text-muted); font-weight:600; font-size:0.875rem; line-height:1.15; overflow-wrap:anywhere}
        .seg button.on{background:var(--accent); color:var(--on-accent)}
        header{display:flex; align-items:center; gap:0.25rem}
        .hdr-main{flex:1; min-width:0}
        .help-btn{flex:0 0 var(--touch-w); width:var(--touch-w); height:var(--touch); margin-right:-0.625rem; display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:50%}
        .help-btn:active{background:var(--surface-2)}
        .help-btn svg.icon{width:1.375rem; height:1.375rem; vertical-align:0}
        .env-fixed{left:50% !important; right:auto !important; transform:translateX(-50%); z-index:3000 !important}
        #helpOv{position:fixed; inset:0; z-index:2500; background:var(--bg); overflow-y:auto; overscroll-behavior:contain;
            padding:calc(var(--sa-top) + var(--csa-top) + 0.5rem) max(0.875rem, var(--sa-right)) calc(1.5rem + var(--sa-bottom) + var(--csa-bottom)) max(0.875rem, var(--sa-left))}
        #helpOv .help-in{max-width:480px; margin:0 auto}
        .help-title{font-weight:800; font-size:1.25rem; margin:0.25rem 0 0.625rem}
        .help-head{display:flex; align-items:center; gap:0.5rem; width:100%; min-height:3rem; padding:0.375rem 0.75rem; margin-top:0.5rem; background:var(--surface); border:1px solid var(--border); border-radius:0.75rem; text-align:left; font-weight:700; font-size:1rem}
        .help-head .lbl2{flex:1; min-width:0}
        .help-head.on{border-color:var(--accent)}
        .help-body{padding:0.25rem 0.75rem 0.5rem}
        .help-q{font-weight:700; margin-top:0.75rem}
        .help-a{color:var(--text-muted); font-size:0.875rem; line-height:1.5; margin-top:2px}
        .help-ic{display:inline-block; color:var(--text)}
        .help-ic svg.icon{width:1rem; height:1rem; vertical-align:-0.1875rem}
        #tour{position:fixed; inset:0; z-index:2700; touch-action:none; user-select:none; -webkit-user-select:none}
        .tour-banner{position:absolute; top:calc(var(--csa-top) + var(--sa-top) + 0.25rem); left:calc(var(--sa-left) + 0.375rem); z-index:3; padding:0.25rem 0.625rem; border-radius:1rem; background:var(--accent); color:var(--on-accent); font-size:0.75rem; font-weight:700; max-width:calc(100vw - 6rem)}
        .tour-hole{position:absolute; z-index:1; pointer-events:none; box-sizing:border-box; border-radius:0.75rem; outline:2px solid var(--accent); box-shadow:0 0 0 9999px color-mix(in srgb, var(--black) 72%, transparent); transition:left .2s ease, top .2s ease, width .2s ease, height .2s ease}
        .tour-tip{position:absolute; z-index:2; box-sizing:border-box; width:20rem; max-width:calc(100vw - 1.5rem); padding:0.875rem; border-radius:0.875rem; background:var(--tour-bg); color:var(--tour-ink); box-shadow:0 0.5rem 2rem color-mix(in srgb, var(--black) 45%, transparent); transition:left .2s ease, top .2s ease}
        #tour.noanim .tour-hole, #tour.noanim .tour-tip{transition:none}
        .tour-title{font-weight:800; font-size:1rem; padding-right:5.5rem; line-height:1.25}
        .tour-text{font-size:0.875rem; line-height:1.45; margin-top:0.25rem; color:var(--tour-ink-2)}
        .tour-skip{position:absolute; top:0.25rem; right:0.375rem; min-height:var(--touch); padding:0 0.5rem; font-size:0.8125rem; color:var(--tour-muted)}
        .tour-foot{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.5rem; margin-top:0.75rem}
        .tour-count{font-size:0.75rem; color:var(--tour-muted)}
        .tour-btns{display:flex; flex-wrap:wrap; gap:0.375rem; justify-content:flex-end}
        .tour-btns button{min-height:var(--touch); padding:0 0.875rem; border-radius:0.625rem; background:var(--tour-btn); color:var(--tour-ink); font-weight:600; font-size:0.875rem}
        .tour-btns button.primary{background:var(--accent); color:var(--on-accent)}
        .tour-arrow{position:absolute; width:0.875rem; height:0.875rem; background:var(--tour-bg); transform:translateX(-50%) rotate(45deg); pointer-events:none}
        @media (prefers-reduced-motion: reduce){ .tour-hole,.tour-tip{transition:none !important} }
        #onb{position:fixed; inset:0; z-index:2600; background:var(--bg); display:flex; flex-direction:column;
            padding:calc(var(--sa-top) + var(--csa-top) + 0.5rem) max(1rem, var(--sa-right)) calc(1rem + var(--sa-bottom) + var(--csa-bottom)) max(1rem, var(--sa-left))}
        .onb-top{display:flex; justify-content:flex-end; min-height:var(--touch)}
        .onb-skip{min-height:var(--touch); padding:0 0.5rem; color:var(--text-muted); font-size:0.9375rem}
        .onb-viewport{flex:1; min-height:0; overflow:hidden; touch-action:pan-y; user-select:none}
        .onb-track{display:flex; height:100%; transition:transform .2s ease}
        .onb-card{flex:0 0 100%; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 0.75rem}
        .onb-ic{color:var(--accent)}
        .onb-ic svg.icon{width:3rem; height:3rem; vertical-align:0; stroke-width:1.75}
        .onb-title{font-weight:800; font-size:1.375rem; margin:1.125rem 0 0.625rem}
        .onb-text{color:var(--text-muted); font-size:0.9375rem; line-height:1.5; max-width:340px}
        .onb-text b{color:var(--text)}
        .onb-dots{display:flex; justify-content:center; gap:0.5rem; margin:0.75rem 0 0.875rem}
        .onb-dots i{width:0.5rem; height:0.5rem; border-radius:50%; background:var(--surface-2)}
        .onb-dots i.on{background:var(--accent)}
        .onb-btns{max-width:480px; width:100%; margin:0 auto}
        @media (prefers-reduced-motion: reduce){ .onb-track{transition:none} }
        .font-seg{flex-wrap:wrap}
        .font-seg button{flex:1 1 45%; font-size:.8125rem; line-height:1.2}
        .font-seg .fs-pct{color:var(--text-muted); font-weight:400}
        .font-seg button.on .fs-pct{color:var(--on-accent)}
        .font-sample{margin-top:.75rem; padding:.75rem; border-radius:.75rem; background:var(--surface-2)}
        .sw-grid{display:flex; flex-wrap:wrap; gap:0.625rem 0.75rem}
        .sw-wrap{display:flex; flex-direction:column; align-items:center; gap:2px; width:3.25rem}
        .sw-cap{font-size:0.625rem; color:var(--text-muted); text-align:center; line-height:1.15; overflow-wrap:anywhere}
        .swatch{width:var(--touch-w); height:var(--touch); border-radius:50%; border:2px solid var(--border); cursor:pointer; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-weight:800}
        .swatch.sel{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--text)}
        .swatch input[type=color]{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; padding:0; border:none}
        .datenav{display:flex; align-items:center; justify-content:space-between; margin-top:0.75rem}
        .datenav .nav{padding:0.375rem 0.625rem; color:var(--text-muted); font-size:1.5rem; line-height:1; min-width:var(--touch); min-height:var(--touch)}
        .datenav .nav svg.icon{width:1.375rem; height:1.375rem; vertical-align:-0.375rem}
        .dmain{text-align:center}
        .dtitle{font-weight:600; text-transform:capitalize; font-size:1rem}
        .badge{font-size:0.75rem; font-weight:600; margin-top:0.75rem; display:inline-block; padding:0.25rem 0.625rem; border-radius:6.1875rem; background:var(--surface-2);
            text-decoration:underline; text-decoration-style:dotted; text-underline-offset:2px; min-height:0}
        .badge svg.icon{width:0.75rem; height:0.75rem; vertical-align:-0.0625rem}
        .b-work{color:var(--accent)} .b-rest{color:var(--accent-2)}
        .today-link{font-size:0.8125rem; color:var(--text-muted); text-decoration:underline; margin-top:0.4375rem}

        .subtitle-row{margin:0.625rem 0 2px}
        .subtitle-row input{background:transparent; border:1px dashed var(--border); text-align:center;
            font-weight:600; font-size:1rem; border-radius:0.875rem}
        .subtitle-row input:focus{border-style:solid}

        .rest-hint{text-align:center; color:var(--accent-2); font-size:0.875rem;
            background:var(--accent-2-bg); border:1px solid color-mix(in srgb, var(--accent-2) 25%, transparent); border-radius:0.875rem; padding:0.75rem; margin-top:0.75rem}

        .backup-banner{display:flex; align-items:center; gap:0.625rem;
            background:var(--accent-bg); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:0.875rem;
            padding:0.5rem 0.5rem 0.5rem 0.875rem; margin-top:0.75rem; font-size:0.8125rem; color:var(--text)}
        .backup-banner .txt{flex:1; min-width:0; line-height:1.35}
        .backup-banner .btns{display:flex; align-items:center; gap:0.25rem; flex-shrink:0}
        .backup-banner .save-btn{background:var(--accent); color:var(--on-accent); border-radius:0.625rem; padding:0 0.875rem;
            font-weight:700; font-size:0.8125rem; min-height:var(--touch); display:flex; align-items:center; flex-shrink:0}
        .backup-banner .close-btn{width:var(--touch); height:var(--touch); display:flex; align-items:center; justify-content:center;
            color:var(--text-muted); flex-shrink:0; font-size:1rem}

        .card{background:var(--surface); border:1px solid var(--border); border-radius:1rem; padding:0.75rem 0.875rem; margin-top:0.75rem}
        .ex-head{display:flex; justify-content:space-between; gap:0.5rem; align-items:flex-start}
        .ex-name{font-weight:600; line-height:1.25; font-size:1rem; text-align:left; color:inherit}
        .ex-last{font-size:0.75rem; color:var(--text-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
        .ex-last svg.icon{width:0.8125rem; height:0.8125rem; vertical-align:-0.125rem}
        .del-ex{width:var(--touch-w); height:var(--touch); flex-shrink:0; margin:-0.125rem 0 0 0;
            display:flex; align-items:center; justify-content:center}
        .del-ex .box{width:2.5rem; height:2.5rem; display:flex; align-items:center; justify-content:center;
            color:var(--danger); background:color-mix(in srgb, var(--danger) 12%, transparent); border-radius:0.75rem}
        .del-ex:active .box{background:color-mix(in srgb, var(--danger) 28%, transparent)}

        /* подходы: единая сетка № | вес | повторы | действие */
        .sets-wrap{margin-top:0.5rem; max-width:480px; padding:0 0.375rem}
        .set-grid{display:grid; grid-template-columns:1.25rem minmax(0,1fr) minmax(0,1fr) var(--touch-w); gap:0.375rem; align-items:center}
        .set-grid>*{min-width:0}
        .set-labels{font-size:0.6875rem; color:var(--text-muted); text-align:center; margin-bottom:2px}
        .set-row{margin-top:2px}
        .set-row .idx{font-size:0.75rem; color:var(--text-muted); text-align:center}
        .set-row .cell{display:flex; align-items:center; justify-content:center; line-height:1; width:100%; min-height:var(--touch); border-radius:0.625rem; font-weight:600; font-size:1rem; text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap}
        .set-row .cell .u{color:var(--text-muted); font-weight:400; font-size:0.8125rem}
        .set-next{position:relative; margin-top:0.625rem}
        .set-next::before{content:""; position:absolute; inset:-0.25rem -0.375rem; border:1.5px dashed var(--accent-2); border-radius:0.75rem; pointer-events:none}
        .set-next .idx{font-size:0.8125rem; font-weight:700; color:var(--accent-2); text-align:center}
        .set-next .idx.muted{color:var(--text-muted); font-weight:400}
        .stepper{display:flex; align-items:center; height:var(--touch); background:var(--surface-2); border-radius:0.625rem; min-width:0}
        .stepper .step{flex:0 0 2rem; width:2rem; height:var(--touch); display:flex; align-items:center; justify-content:center; color:var(--text-muted)}
        .stepper .step:active{color:var(--text)}
        .stepper .val{display:flex; align-items:center; justify-content:center; line-height:1; flex:1 1 0; min-width:0; height:var(--touch); font-weight:700; font-size:0.9375rem; text-align:center; white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums}
        .stepper .val .u{color:var(--text-muted); font-weight:400; font-size:0.75rem}

        .sets-wrap{container:sw / inline-size}
        @container sw (max-width: 12.5rem){ .set-grid{grid-template-columns:1rem minmax(0,1fr) minmax(0,1fr) var(--touch-w); gap:0.25rem; margin-inline:-0.375rem} .stepper .step{flex-basis:1.0625rem; width:1.0625rem} }

        .check{width:var(--touch-w); height:var(--touch); border-radius:0.625rem; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center}

        .check svg.icon{width:1.375rem; height:1.375rem; vertical-align:0}

        .del-set:active .box{background:color-mix(in srgb, var(--danger) 28%, transparent)}
        .addset-extras{display:grid; grid-template-columns:repeat(var(--n,3),minmax(0,1fr)); gap:0.375rem; margin-top:0.625rem; padding-top:0.625rem; border-top:2px solid color-mix(in srgb, var(--accent) 45%, transparent)}
        .addset-extras>*{min-width:0; height:var(--touch-2); justify-content:center}
        .btn-main{background:var(--accent); color:var(--on-accent); border-radius:0.75rem; padding:0 0.625rem; font-weight:700;
            display:flex; align-items:center; min-height:var(--touch); font-size:0.9375rem}
        .btn-main:active{opacity:.85}
        .btn-gray{background:var(--surface-2); color:var(--text-muted); border-radius:0.75rem; padding:0 0.625rem; display:flex; align-items:center; gap:0.375rem; min-height:var(--touch); font-size:0.875rem}

        .addex{display:flex; gap:0.5rem; margin-top:0.75rem}

            background:var(--surface); border:1px solid var(--border); border-radius:6.1875rem; padding:0.5625rem 0.875rem; min-height:var(--touch)}

        .row{margin-top:0.75rem}

        .row2>div{flex:1}
        .wide-btn{width:100%; display:flex; justify-content:center; align-items:center; gap:0.5rem;
            background:var(--surface-2); border-radius:0.75rem; padding:0.75rem; font-size:0.875rem; margin-top:0.625rem; min-height:var(--touch)}
        .wide-btn:active{opacity:.7}
        .wide-btn.primary{background:var(--accent); color:var(--on-accent); font-weight:700}
        .wide-btn.danger{color:var(--danger); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); background:transparent}
        .note{font-size:0.75rem; color:var(--text-muted); margin-top:0.625rem; line-height:1.45}

        .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2}
        .switch i{position:absolute; inset:0; background:var(--surface-2); border-radius:6.1875rem; transition:background .15s}
        .switch i::after{content:""; position:absolute; top:0.1875rem; left:0.1875rem; width:1.5rem; height:1.5rem; border-radius:50%;
            background:var(--text); opacity:.85; transition:transform .15s}
        .switch input:checked + i{background:var(--accent)}
        .switch input:checked + i::after{transform:translateX(1.25rem); background:var(--on-accent); opacity:1}

        .setup{min-height:calc(var(--stable-h) * .8); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.75rem}

        .confirm{display:flex; align-items:center; gap:0.625rem; justify-content:space-between;

            border-radius:0.875rem; padding:0.625rem 0.875rem; margin-top:0.75rem; font-size:0.8125rem}

        .tpl-item .tpl-name{font-weight:600; font-size:1rem}

        .rec-btn{display:inline-flex; align-items:center; background:var(--accent-2-bg); color:var(--accent-2); font-weight:600; border-radius:0.625rem; padding:0.25rem 0.75rem; font-size:0.8125rem; min-height:var(--touch); font-variant-numeric:tabular-nums; margin-top:0.25rem; cursor:pointer}

        .import-preview{margin-top:0.5rem}
        .import-day{background:var(--surface); border:1px solid var(--border); border-radius:0.875rem; padding:0.75rem 0.875rem; margin-top:0.625rem}

    </style>
</head>

<script>

    const APP_VERSION="2.13.0"; // фаза 13: вёрстка, пикер цвета, цвет отдыха, заголовок тура, браузер

        {id:"graphite",name:"Графит с синевой",bg:"#131722",surface:"#1d2333",surface2:"#2a3246",text:"#e9edf5",muted:"#9ca6ba"},
        {id:"light",name:"Светлая",bg:"#f2f2f7",surface:"#ffffff",surface2:"#e9e9ef",text:"#111113",muted:"#62626b"},
        {id:"warm",name:"Тёплая светлая",bg:"#f6efe4",surface:"#fffaf1",surface2:"#ece1cf",text:"#2a2016",muted:"#6f604d"}
    ];
    const ACCENT_COLORS=[["Оранжевый","#ff9f0a"],["Жёлтый","#ffd60a"],["Лаймовый","#a3e635"],["Зелёный","#30d158"],["Бирюзовый","#2dd4bf"],["Голубой","#5ac8fa"],
        ["Синий","#3b82f6"],["Фиолетовый","#8b5cf6"],["Розовый","#ff6fae"],["Красный","#ff453a"],["Коралловый","#ff7a64"],["Серый","#8e8e93"]];
    const THEME_INK={dark:"#09090b",light:"#ffffff"};   // кандидаты для --on-accent
    const DANGER_HEX="#f87171";
    const CUSTOM_FALLBACK={bg:"#09090b",surface:"#18181b",text:"#f4f4f5"};
    const DEFAULT_THEME={base:"tg",accent:"#ff9f0a",accent2:null,custom:{}};
    // THEME-DATA-END
    // ============ среда: test / prod, изоляция ключей ============

        return { days:days.length, ex:nEx, tpl:(dump.templates||[]).length, created:dump.created||null, version:dump.version||null };
    }
    // «merge» — по датам: конфликтная дата (есть и в копии, и сейчас) → берётся запись с бо́льшим up (при равенстве остаётся текущая);
    // «replace» — данные и облако перетираются полностью
    function mergePlan(dump){
        const days={add:[],take:[],keep:[]};
        for(const k of Object.keys(dump.log||{}).sort()){
            const loc=data.log[k];
            if(!loc) days.add.push(k);
            else if(((dump.log[k]||{}).up||0)>(loc.up||0)) days.take.push(k);
            else days.keep.push(k);
        }
        const tpl={add:[],take:[],keep:[],skipName:[]};
        for(const t of (dump.templates||[])){
            const same=data.templates.find(function(x){return x.id===t.id;});
            if(same){ ((t.up||0)>(same.up||0)?tpl.take:tpl.keep).push(t.id); }
            else if(data.templates.some(function(x){return x.name===t.name;})) tpl.skipName.push(t.id);
            else tpl.add.push(t.id);
        }
        return {days:days,tpl:tpl,conflicts:days.take.length+days.keep.length};
    }
    function applyBackupDump(dump, mode){
        if(mode==="replace"){
            data=normalizeData({ cfg:dump.cfg||{}, templates:(dump.templates||[]).slice(), log:dump.log||{} });
            data.cfg.up=Date.now();
            applyMigrations(); saveCache();
            return { mode:mode, days:Object.keys(data.log).length, tpl:data.templates.length, cloudReplace:true };
        }
        const plan=mergePlan(dump), toSyncDays=[], toSyncTpl=[];
        for(const k of plan.days.add.concat(plan.days.take)){ data.log[k]=JSON.parse(JSON.stringify(dump.log[k])); toSyncDays.push(k); }
        for(const t of (dump.templates||[])){
            const nt=normalizeTpl(JSON.parse(JSON.stringify(t)));
            if(plan.tpl.add.indexOf(t.id)>=0){ data.templates.push(nt); toSyncTpl.push(nt); }
            else if(plan.tpl.take.indexOf(t.id)>=0){ const i=data.templates.findIndex(function(x){return x.id===t.id;}); data.templates[i]=nt; toSyncTpl.push(nt); }
        }
        applyMigrations(); saveCache();
        return { mode:mode, days:plan.days.add.length, replaced:plan.days.take.length, kept:plan.days.keep.length, tpl:toSyncTpl.length, toSyncDays:toSyncDays, toSyncTpl:toSyncTpl };
    }

    // низкоуровневый слой (полные ключи). Запись/удаление — только через guardKey
    let lastCsErr="";
    function rawGetItems(keys){ return new Promise(function(res){ if(!cs||!keys.length) return res({}); cs.getItems(keys,function(e,v){ if(e) lastCsErr="getItems: "+String(e); res(e?{}:(v||{})); }); }); }
    function rawSet(k,v){ return new Promise(function(res){ if(!cs||frozen) return res(false); guardKey(k); try{ cs.setItem(k,v,function(e,ok){ if(e) lastCsErr="setItem: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="setItem: "+String(err&&err.message||err); res(false); } }); }
    function rawDel(k){ return new Promise(function(res){ if(!cs) return res(false); guardKey(k); try{ cs.removeItem(k,function(e,ok){ if(e) lastCsErr="removeItem: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="removeItem: "+String(err&&err.message||err); res(false); } }); }
    // одним вызовом, но только по явному списку: каждый ключ проходит guardKey, «все ключи» не удаляются никогда
    function rawDelMany(keys){ return new Promise(function(res){ if(!keys.length) return res(true); if(!cs) return res(false); keys.forEach(guardKey); try{ cs.removeItems(keys,function(e,ok){ if(e) lastCsErr="removeItems: "+String(e); res(!e&&!!ok); }); }catch(err){ lastCsErr="removeItems: "+String(err&&err.message||err); res(false); } }); }
    // простой пул: не больше limit одновременных задач; onDone(i) вызывается после каждой
    async function runPool(items,limit,worker,onDone){
        let next=0, done=0; const results=new Array(items.length);
        async function lane(){ while(next<items.length){ const i=next++; results[i]=await worker(items[i],i); done++; if(onDone) onDone(done,items.length); } }
        const lanes=[]; for(let i=0;i<Math.min(limit,items.length);i++) lanes.push(lane());
        await Promise.all(lanes); return results;
    }
    function rawKeys(){ return new Promise(function(res){ if(!cs) return res(null); try{ cs.getKeys(function(e,k){ if(e) lastCsErr="getKeys: "+String(e); res(e?null:(k||[])); }); }catch(err){ lastCsErr="getKeys: "+String(err&&err.message||err); res(null); } }); }
    // логический слой: приложение работает с именами без префикса ("cfg", "w_2026-09-28"), K() добавляется здесь
    function csGetItems(keys){
        return rawGetItems(keys.map(K)).then(function(o){ const r={}; for(const k of keys) if(o[K(k)]!=null) r[k]=o[K(k)]; return r; });
    }
    function csSet(k,v){ return rawSet(K(k),v); }
    function csDel(k){ return rawDel(K(k)); }
    // в test возвращает только ключи с префиксом tst_ (без префикса); чужие ключи test не видит
    function csKeys(){
        return rawKeys().then(function(all){
            if(all===null) return null;
            if(ENV!=="test") return all;
            return all.filter(function(k){ return k.indexOf(KP)===0; }).map(function(k){ return k.slice(KP.length); });
        });
    }

    let warnedCloud=false;
    function csSetWarn(k,v){ csSet(k,v).then(function(ok){ if(cs&&!ok&&!warnedCloud){ warnedCloud=true; toast("Запись в облако не прошла ("+k+")"); } }); }
    function persistDay(k){ if(TOUR_MODE) return; saveCache(); if(data.log[k]) csSetWarn("w_"+k, JSON.stringify(data.log[k])); else csDel("w_"+k); }
    function persistCfg(){ if(TOUR_MODE) return; data.cfg.up=Date.now(); saveCache(); csSetWarn("cfg", JSON.stringify(data.cfg)); }
    function persistTpl(t){ if(TOUR_MODE) return; t.up=Date.now(); saveCache(); csSetWarn("tpl_"+t.id, JSON.stringify(t)); }
    function unpersistTpl(id){ if(TOUR_MODE) return; saveCache(); csDel("tpl_"+id); }

    // ============ миграции данных (по записям, а не по cfg.schema) ============
    // Состояние миграции определяется самими записями: cfg может быть новее отдельных дней (слияние, старый клиент).
    // Миграция: { id, needs(rec,kind)→bool, run(rec,kind)→rec }, kind = "day" | "tpl". run идемпотентна.
    // cfg.schema — только информационная метка, для решения о запуске миграций не используется.
    const APP_SCHEMA=2;   // 2 — модель упражнения base/plan/variant
    const MIGRATIONS=[
        // schema 2: у каждого упражнения дня появляются base/plan/variant, применяются алиасы, name пересобирается
        { id:"log-fields",
          needs:function(rec,kind){ return kind==="day" && (rec.exercises||[]).some(function(e){ return !e.base; }); },
          run:function(rec){ for(const e of (rec.exercises||[])) if(!e.base) ensureEx(e); return rec; } }
    ];
    const PREMIG_KEEP=3;
    function migNeeds(m,rec,kind){ try{ return !!m.needs(rec,kind); }catch(e){ return false; } }
    // Проходит по всем дням и шаблонам d, применяет миграции там, где needs()===true. Меняет d на месте.
    // Не трогает up. Возвращает {days:[ключи], tpls:[id], errors, snapshot}
    function migrateAll(d, list){
        migCtx={cfg:d.cfg||{}, templates:d.templates||[]};
        try{ return migrateAllInner(d,list); }finally{ migCtx=null; }
    }
    function migrateAllInner(d, list){
        list=list||MIGRATIONS;
        const res={days:[], tpls:[], errors:0, snapshot:null};
        if(!list.length) return res;
        const todo=[];
        for(const k of Object.keys(d.log||{}).sort()) if(list.some(function(m){ return migNeeds(m,d.log[k],"day"); })) todo.push(["day",k]);
        for(const t of (d.templates||[])) if(list.some(function(m){ return migNeeds(m,t,"tpl"); })) todo.push(["tpl",t.id]);
        if(!todo.length) return res;
        // снапшот перед применением: localStorage (в CloudStorage лимит 4096 символов), храним PREMIG_KEEP последних
        const snapName="premig_"+new Date().toISOString().replace(/[:.]/g,"-");
        try{
            lsSet(snapName, JSON.stringify(d));
            const all=lsKeys("premig_");
            while(all.length>PREMIG_KEEP) lsDel(all.shift());
            res.snapshot=snapName;
        }catch(e){ res.errors=todo.length; return res; }   // без снапшота не мигрируем
        for(const item of todo){
            const kind=item[0], key=item[1];
            const idx=kind==="day"?null:d.templates.findIndex(function(t){ return t.id===key; });
            const orig=kind==="day"?d.log[key]:d.templates[idx];
            try{
                let rec=JSON.parse(JSON.stringify(orig));
                for(const m of list) if(migNeeds(m,rec,kind)) rec=m.run(rec,kind)||rec;
                if(orig.up===undefined) delete rec.up; else rec.up=orig.up;   // эквивалентное преобразование: up не меняется
                if(JSON.stringify(rec)===JSON.stringify(orig)) continue;
                if(kind==="day"){ d.log[key]=rec; res.days.push(key); }
                else { d.templates[idx]=rec; res.tpls.push(key); }
            }catch(e){ res.errors++; }
        }
        return res;
    }
    // «грязные» записи (мигрированы, но ещё не записаны в облако) переживают перезапуск
    function getDirty(){ try{ const o=JSON.parse(lsGet("migdirty")||"null"); if(o) return {days:o.days||[],tpls:o.tpls||[]}; }catch(e){} return {days:[],tpls:[]}; }
    function setDirty(o){ try{ if(o.days.length||o.tpls.length) lsSet("migdirty",JSON.stringify(o)); else lsDel("migdirty"); }catch(e){} }
    function serializeKey(k){
        if(k==="cfg") return JSON.stringify(data.cfg);
        if(k.indexOf("w_")===0){ const r=data.log[k.slice(2)]; return r?JSON.stringify(r):null; }
        if(k.indexOf("tpl_")===0){ const t=data.templates.find(function(x){ return x.id===k.slice(4); }); return t?JSON.stringify(t):null; }
        return null;
    }
    let flushing=false;
    async function flushDirty(){
        if(flushing||TOUR_MODE) return; flushing=true;
        try{
            const dirty=getDirty();
            if(!dirty.days.length&&!dirty.tpls.length) return;
            const left={days:[],tpls:[]};
            for(const k of dirty.days){ const v=serializeKey("w_"+k); if(v===null) continue; if(!(await csSet("w_"+k,v))) left.days.push(k); }
            for(const id of dirty.tpls){ const v=serializeKey("tpl_"+id); if(v===null) continue; if(!(await csSet("tpl_"+id,v))) left.tpls.push(id); }
            setDirty(left);
        }finally{ flushing=false; }
    }
    // единая точка: вызывается везде, где данные попадают в память (загрузка, слияние, восстановление, импорт, клон).
    // true — если что-то мигрировало
    function applyMigrations(){
        if((data.cfg.schema||1)<APP_SCHEMA) data.cfg.schema=APP_SCHEMA;
        const r=migrateAll(data);
        if(r.errors) toast("Часть данных не мигрирована ("+r.errors+"), будет повтор при следующей загрузке");
        const changed=r.days.length+r.tpls.length>0;
        if(changed){
            const dirty=getDirty();
            for(const k of r.days) if(dirty.days.indexOf(k)<0) dirty.days.push(k);
            for(const id of r.tpls) if(dirty.tpls.indexOf(id)<0) dirty.tpls.push(id);
            setDirty(dirty); saveCache();
        }
        flushDirty();
        return changed;
    }

    // ============ test: клонирование боевых данных (только чтение прода) ============
    function showAlertP(msg){
        return new Promise(function(res){
            if(tg&&tg.showAlert&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")){ tg.showAlert(msg,function(){ res(); }); return; }
            window.alert(msg); res();
        });
    }
    function errText(e){ return String(e&&e.message||e||"неизвестная ошибка"); }
    function askConfirm(msg){
        return new Promise(function(res){
            try{ if(tg&&tg.showConfirm&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.2")){ tg.showConfirm(msg,function(ok){ res(!!ok); }); return; } }catch(e){}
            res(window.confirm(msg));
        });
    }
    // результат клонирования показывается всегда: успех — showAlert с итогом и перезагрузка, ошибка — showAlert с названием шага
    function cloneDone(msg,isErr){
        ui.cloneBusy=false; ui.cloneProgress=null; ui.cloneMsg=msg; ui.cloneIsErr=!!isErr;
        if(isErr) ui.lastCloneError=msg;
        render();
        if(isErr) hap("error");
    }
    // маркер состояния клонирования (tst_clone_state): "running" → "done;<дата>;<число ключей>"
    const CLONE_STATE="clone_state", CLONE_BATCH=50, CLONE_PARALLEL=6;
    function cloneOverlay(text){
        let o=document.getElementById("cloneOverlay");
        if(text===null){ if(o) o.remove(); return; }
        if(!o){
            o=document.createElement("div"); o.id="cloneOverlay";
            o.style.cssText="position:fixed;inset:0;z-index:3000;background:color-mix(in srgb, var(--black) 78%, transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.625rem;color:var(--text);font-size:1.25rem;font-weight:700;text-align:center;padding:1.5rem;touch-action:none";
            o.innerHTML='<div id="cloneOverlayText"></div><div style="font-size:0.8125rem;font-weight:400;opacity:.8">Не закрывайте приложение до окончания копирования</div>';
            document.body.appendChild(o);
        }

    }
    function cloneProgress(done,total){
        ui.cloneProgress={done:done,total:total};
        const txt="Копирование "+done+"/"+total;
        cloneOverlay(txt);
        const btn=document.querySelector('[data-act="cloneProd"]'); if(btn) btn.innerHTML=ICON_SYNC+" "+txt;
    }
    function ms(t0){ return Math.round(performance.now()-t0); }
    async function cloneFromProd(){
        if(ui.cloneBusy) return;
        ui.cloneBusy=true; ui.cloneMsg="Копирование…"; ui.cloneIsErr=false; render();
        let step="Проверка среды", ownBusy=false, success=null, closingOn=false, markerWritten=false;
        const T={ read:0, del:0, write:0, total:0, keys:0, batches:0, deleted:0, parallel:CLONE_PARALLEL };
        const tAll=performance.now();
        try{
            if(ENV!=="test") throw new Error("клонирование доступно только в test");
            if(!cs) throw new Error("CloudStorage недоступен (открыто не в Telegram или версия клиента ниже 6.9). См. «Диагностика».");
            if(syncState.busy) throw new Error("идёт синхронизация с облаком, повторите через несколько секунд");
            syncState.busy=true; ownBusy=true;
            // ---- чтение: все ключи без префикса tst_ (в них ничего не пишем), значения пачками
            step="Чтение списка ключей"; lastCsErr="";
            let t0=performance.now();
            const all=await rawKeys();
            if(all===null) throw new Error("не удалось прочитать список ключей CloudStorage"+(lastCsErr?" — "+lastCsErr:""));
            const prod=all.filter(function(k){ return k.indexOf(KP)!==0; });
            const mine=all.filter(function(k){ return k.indexOf(KP)===0; });
            step="Проверка основных данных";
            if(!prod.length) throw new Error("основные данные не найдены: в CloudStorage нет ключей без префикса «"+KP+"» (всего ключей: "+all.length+"). Проверьте, что test открыт тем же ботом, — см. «Диагностика».");
            // лимит CloudStorage: 1024 ключа на бота и пользователя
            if(prod.length*2>=1000) throw new Error("слишком много ключей ("+prod.length+"): копия не поместится в лимит 1024 (нужно: прод-ключи × 2 < 1000)");
            step="Чтение значений"; const items={};
            for(let i=0;i<prod.length;i+=CLONE_BATCH){
                const part=prod.slice(i,i+CLONE_BATCH); lastCsErr="";
                const got=await rawGetItems(part); T.batches++;
                for(const k of part){ if(got[k]==null) throw new Error("не удалось прочитать значение ключа «"+k+"»"+(lastCsErr?" — "+lastCsErr:"")+". Тестовые данные не тронуты."); items[k]=got[k]; }
            }
            T.read=ms(t0); T.keys=prod.length;
            // ---- подтверждение (после прерванного копирования — не спрашиваем)
            step="Подтверждение";
            const hasTestData=mine.some(function(k){ return k.indexOf(KP+"w_")===0; })||!!data.cfg.cycle.anchorDate;
            if(hasTestData && !ui.cloneIncomplete && !(await askConfirm("Перезаписать тестовые данные копией основных?"))){ cloneDone("Отменено: тестовые данные не изменены",false); return; }
            step="Снимок текущих тестовых данных";
            lsSet("preclone", JSON.stringify(data));
            // ---- с этого момента пользователь не должен уйти: оверлей + подтверждение закрытия
            if(tg&&tg.enableClosingConfirmation){ tg.enableClosingConfirmation(); closingOn=true; }
            cloneProgress(0,prod.length);
            step="Запись маркера «running»";
            if(!(await rawSet(KP+CLONE_STATE,"running"))) throw new Error("не удалось записать маркер состояния"+(lastCsErr?" — "+lastCsErr:""));
            markerWritten=true;
            // ---- удаление: только лишние tst_-ключи (которых нет в новой копии); остальные перезапишутся
            step="Удаление лишних тестовых ключей"; t0=performance.now();
            const target={}; for(const k of prod) target[KP+k]=1;
            const extra=mine.filter(function(k){ return k!==KP+CLONE_STATE && !target[k]; });
            lastCsErr="";
            if(!(await rawDelMany(extra))) throw new Error("не удалены ключи ("+extra.length+"): "+extra.slice(0,5).join(", ")+(lastCsErr?" — "+lastCsErr:""));
            T.del=ms(t0); T.deleted=extra.length;
            // ---- запись: параллельно, не более CLONE_PARALLEL одновременных запросов
            step="Запись копии"; t0=performance.now(); lastCsErr="";
            const wr=await runPool(prod,CLONE_PARALLEL,function(k){ return rawSet(KP+k,items[k]); },cloneProgress);
            T.write=ms(t0);
            const wrFail=prod.filter(function(k,i){ return !wr[i]; });
            if(wrFail.length) throw new Error("не записано ключей: "+wrFail.length+" из "+prod.length+" (например, "+wrFail.slice(0,3).join(", ")+")"+(lastCsErr?" — "+lastCsErr:""));
            step="Запись маркера «done»";
            if(!(await rawSet(KP+CLONE_STATE,"done;"+new Date().toISOString()+";"+prod.length))) throw new Error("не удалось записать маркер завершения"+(lastCsErr?" — "+lastCsErr:""));
            // ---- кэш localStorage из только что записанных значений: первый рендер после перезагрузки сразу покажет новые данные
            step="Заполнение локального кэша";
            data=normalizeData(cloudObjFromItems(prod,items));
            applyMigrations(); saveCache();
            T.total=ms(tAll);
            ui.cloneTimings=T;
            lsSet("clone_timings",JSON.stringify(T));
            console.log("[clone] чтение "+T.read+" мс ("+T.keys+" ключей, пачек: "+T.batches+"), удаление "+T.del+" мс ("+T.deleted+" ключей), запись "+T.write+" мс (параллельно "+T.parallel+"), всего "+T.total+" мс");
            const nW=prod.filter(function(k){return k.indexOf("w_")===0;}).length, nT=prod.filter(function(k){return k.indexOf("tpl_")===0;}).length;
            success="Скопировано: "+nW+" тренировок, "+nT+" шаблонов, "+prod.length+" ключей";
        }catch(e){
            const full="Шаг «"+step+"»: "+errText(e)+(lastCsErr&&errText(e).indexOf(lastCsErr)<0?" ("+lastCsErr+")":"");
            if(markerWritten) ui.cloneIncomplete=true;   // облако могло остаться с неполной копией
            cloneOverlay(null);
            if(closingOn){ tg.disableClosingConfirmation(); closingOn=false; }
            cloneDone(full,true);
            await showAlertP("Ошибка клонирования. "+full);
            return;
        }
        finally{
            if(ownBusy) syncState.busy=false; ui.cloneBusy=false;
            if(closingOn&&!success) tg.disableClosingConfirmation();
        }
        ui.cloneIncomplete=false; ui.cloneMsg=success; ui.cloneIsErr=false;
        cloneOverlay(null);
        if(closingOn){ tg.disableClosingConfirmation(); }
        await showAlertP(success);
        location.reload();
    }
    // при старте test: если клонирование было прервано, в приложение не пускаем
    async function checkCloneState(){
        if(ENV!=="test"||!cs) return;
        const got=await rawGetItems([KP+CLONE_STATE]);
        ui.cloneStateValue=got[KP+CLONE_STATE]||null;
        if(got[KP+CLONE_STATE]==="running") ui.cloneIncomplete=true;
    }
    function incompleteHtml(){

    async function cloudLoad(){
        if(!cs||syncState.busy||ui.cloneIncomplete||TOUR_MODE) return;
        syncState.busy=true;
        try{
            const keys=await csKeys();
            if(keys===null){ syncState.busy=false; return; }
            syncState.verified=true;
            if(!keys.length){ maybeCreateDefaults(); await cloudPushAll(); syncState.last=new Date(); syncState.count=1+data.templates.length+Object.keys(data.log).length; syncState.busy=false; render(); return; }
            const items=await csGetItems(keys);
            if(TOUR_MODE) return;   // тур начался во время загрузки: демо-данные не трогаем, в следующий раз
            const cloud=cloudObjFromItems(keys,items);
            // слияние по меткам времени .up: новее — побеждает; чего нет в облаке — доливаем
            const before=JSON.stringify(data);
            const push=[];
            const merged=normalizeData({ cfg:cloud.cfg, templates:cloud.templates.slice(), log:cloud.log });
            if((data.cfg.up||0)>(merged.cfg.up||0)){ merged.cfg=data.cfg; push.push(["cfg",JSON.stringify(data.cfg)]); }
            merged.cfg=normalizeData({cfg:merged.cfg}).cfg;
            for(const k of Object.keys(data.log).sort()){
                const loc=data.log[k], cld=merged.log[k];
                if(!cld||(loc.up||0)>(cld.up||0)){ merged.log[k]=loc; push.push(["w_"+k,JSON.stringify(loc)]); }
            }
            for(const t of data.templates){
                const i=merged.templates.findIndex(function(c){return c.id===t.id;});
                if(i<0){ merged.templates.push(t); push.push(["tpl_"+t.id,JSON.stringify(t)]); }
                else if((t.up||0)>(merged.templates[i].up||0)){ merged.templates[i]=t; push.push(["tpl_"+t.id,JSON.stringify(t)]); }
            }
            data=merged;
            maybeCreateDefaults();
            applyMigrations();
            syncState.last=new Date(); syncState.count=keys.length;
            if(JSON.stringify(data)!==before){ saveCache(); render(); }
            else if(ui.tab==="set") render(); // обновить строку статуса
            for(const p of push){ const v=serializeKey(p[0]); if(v!==null) await csSet(p[0],v); }
        }finally{ syncState.busy=false; }
    }

    function dayHasContent(d){

    // ============ шаблоны из текста ============
    // Строка с "3х8-12" → упражнение (имя до плана); строка без плана → название нового шаблона
    const PLAN_RE=/(\d+)\s*[хx×*]\s*(\d+)\s*(?:[-–—]\s*(\d+))?/i;
    const DATE_RE=/\d{1,2}[.\/]\d{1,2}(?:[.\/]\d{2,4})?/g;
    function parseTemplatesText(text){
        const out=[]; let cur=null;
        for(let line of String(text||"").split(/\r?\n/)){
            line=line.trim(); if(!line) continue;
            const m=line.match(PLAN_RE);
            if(m){
                let name=line.slice(0,m.index).replace(/^\s*\d+[.)]\s*/,"").replace(/[\s,;:—–-]+$/,"").replace(/\(\s*$/,"").trim();
                if(!name) continue; // строка из одних цифр (результаты) — пропускаем
                const plan=m[1]+"х"+m[2]+(m[3]?"-"+m[3]:"");
                if(!cur){ cur={name:"",exercises:[]}; out.push(cur); }
                cur.exercises.push(name+" ("+plan+")");
            } else {
                const title=line.replace(DATE_RE,"").replace(/^\s*\d+[.)]\s*/,"").replace(/[\s,;:—–-]+$/,"").trim();
                cur={name:title,exercises:[]}; out.push(cur);
            }
        }
        const res=out.filter(function(t){return t.exercises.length;});
        res.forEach(function(t,i){ if(!t.name) t.name="Шаблон "+(i+1); });
        return res;
    }

    // последние результаты по типу недели (для строк «Рабочая … / Отдых …»)
    function lastByType(name,type){
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            if(dayWeekType(k)!==type) continue;
            const hit=(data.log[k].exercises||[]).find(function(e){ return e.name.toLowerCase()===name.toLowerCase() && e.sets.length; });
            if(hit) return { date:k, str:hit.sets.map(function(s){return fmtW(s.w)+"×"+s.r;}).join(", ") };
        }
        return null;
    }
    function repRange(ex){
        const plan=ex.base?ex.plan:parseExName(ex.name).plan;
        if(!plan) return null;
        const m=plan.match(/\d+\s*[хx×*]\s*(\d+)\s*(?:[-–—]\s*(\d+))?/i);
        if(!m) return null;
        const low=parseInt(m[1],10), top=m[2]?parseInt(m[2],10):low;
        return {low,top};
    }
    function weightStep(w,exStep){
        if(exStep!=null) return exStep;
        const ds=data.cfg.defaultWeightStep;
        if(ds!=null&&ds>0) return ds;
        const raw=w*0.11;
        if(raw>=3.75) return 5;
        if(raw>=1.75) return 2.5;
        return 1;
    }
    // ============ прошлая тренировка с учётом варианта ============
    function normKey(v){ const k=v==null?"":String(v).trim().toLowerCase(); return k||null; }
    // findPrev(base, variant, weekType, maxStep): даты строго раньше текущей, по убыванию; weekType "work"/"rest" (null — любой тип).
    // Шаги (каждый — по всем датам): 1) тот же base и variant; 2) тот же base, variant=null; 3) тот же base, другой variant.
    // Для рекомендаций maxStep=2: результат шага 3 (другой вариант) для них не годится.
    // Возвращает {date, sets, str, variant, step, name} | null
    function findPrev(base,variant,weekType,maxStep){
        const bl=normKey(base), vl=normKey(variant);
        if(!bl) return null;
        const cand=[];
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            if(weekType&&dayWeekType(k)!==weekType) continue;
            for(const e of (data.log[k].exercises||[])){
                if(!e.sets||!e.sets.length) continue;
                if(normKey(exBaseOf(e))!==bl) continue;
                cand.push({k:k,e:e,v:normKey(exVariantOf(e))});
            }
        }
        let hit=cand.find(function(c){return c.v===vl;}), step=1;
        if(!hit&&vl!==null){ hit=cand.find(function(c){return c.v===null;}); step=2; }
        if(!hit&&(maxStep||3)>=3){ hit=cand.find(function(c){return c.v!==vl;}); step=3; }
        if(!hit) return null;
        return { date:hit.k, sets:hit.e.sets, str:hit.e.sets.map(function(s){return fmtW(s.w)+'×'+s.r;}).join(', '),
                 variant:exVariantOf(hit.e), step:step, name:hit.e.name };
    }
    function lastExNote(name){
        const low=name.toLowerCase();
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            const hit=(data.log[k].exercises||[]).find(function(e){return e.name.toLowerCase()===low&&e.note;});
            if(hit) return {date:k, note:hit.note};
        }
        return null;
    }
    function lastDayNote(title){
        if(!(title||'').trim()) return null;
        const low=title.toLowerCase().trim();
        const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
        for(const k of dates){
            const d=data.log[k];
            if(d.note&&(d.title||'').toLowerCase().trim()===low) return {date:k, note:d.note};
        }
        return null;
    }
    function getExVariants(ex){
        const bl=normKey(exBaseOf(ex)), seen={}, out=[];
        const add=function(v){ const k=normKey(v); if(!k||seen[k]) return; seen[k]=1; out.push(String(v).trim()); };
        for(const t of data.templates) for(const b of t.blocks) for(const it of b.items){
            if(normKey(it.name)===bl&&it.vars) for(const v of it.vars) add(v);
        }
        for(const k of Object.keys(data.log).sort()) for(const e of (data.log[k].exercises||[])){
            if(normKey(exBaseOf(e))===bl) add(exVariantOf(e));
        }
        return out;
    }
    function calcRec(ex,isRest){
        const b=exBaseOf(ex), v=exVariantOf(ex);
        const wp=findPrev(b,v,"work",2);
        if(!wp||!wp.sets.length) return null;
        const workSets=wp.sets;
        const range=repRange(ex);
        if(!range) return null;
        // For deload: use most recent session if its weight >= last work week weight
        // (prevents rest-week lighter loads from dragging down deload, but uses better rest results)
        let baseSets=workSets;
        if(isRest){
            const rp=findPrev(b,v,null,2), recentSets=rp?rp.sets:null;
            if(recentSets&&recentSets.length){
                const wb=workSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
                const rb=recentSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
                if(rb.w>=wb.w) baseSets=recentSets;
            }
        }
        const base=baseSets.reduce(function(b,s){return s.w>b.w||(s.w===b.w&&s.r>b.r)?s:b;});
        const step=weightStep(base.w,null);
        const {low,top}=range;
        const r2=function(v){return Math.round(v*100)/100;};
        if(isRest){
            if(base.r>=top) return {w:base.w, r:Math.max(1,base.r-(top<=12?4:5))};
            return {w:Math.max(0,r2(base.w-step)), r:8};
        }
        if(base.r>=top) return {w:r2(base.w+step), r:low};
        const inc=(top-base.r)>=3?2:1;
        return {w:base.w, r:Math.min(base.r+inc,top)};
    }

    // ============ shared axes chart helper (переиспользуется историей упражнения и сводкой) ============
    function niceStep(range,targetTicks){
        targetTicks=targetTicks||5;
        if(!(range>0)) return 1;
        const rough=range/targetTicks;
        const mag=Math.pow(10,Math.floor(Math.log10(rough)));
        const norm=rough/mag;
        const step=norm<1.5?1:norm<3?2:norm<7?5:10;
        return step*mag;
    }
    // points: [{k:dateKey, v:number}]; opts: {yUnit, yLabel(v), pointColor(d,i), lineColor, padL}
    function chartSvg(points,opts){
        opts=opts||{};
        const n=points.length;
        if(!n) return '';
        const pointColor=opts.pointColor||function(){return 'var(--accent)';};
        const yLabel=opts.yLabel||fmtW;
        const K=fontScale();
        const padL=(opts.padL||36)*K;
        const vs=points.map(function(d){return d.v;});
        const minV=Math.min.apply(null,vs), maxV=Math.max.apply(null,vs);
        const range=maxV-minV;
        const ystep=niceStep(range>0?range:Math.max(1,maxV*0.2),5);
        const ymin=Math.floor(minV/ystep)*ystep, ymax=Math.ceil(maxV/ystep)*ystep;
        const yticks=[];
        for(let y=ymin;y<=ymax+ystep*0.001;y+=ystep) yticks.push(Math.round(y*1000)/1000);
        const W=340, H=Math.round(180+(K-1)*80), padR=10, padT=Math.round(16*K), padB=Math.round(26*K);
        const pw=W-padL-padR, ph=H-padT-padB;
        const px=function(i){ return padL+(n>1?i/(n-1)*pw:pw/2); };
        const py=function(v){ const r=ymax-ymin||1; return padT+ph-(v-ymin)/r*ph; };
        const pts=points.map(function(d,i){return px(i)+','+py(d.v);}).join(' ');
        let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:hidden" xmlns="http://www.w3.org/2000/svg">';
        for(const y of yticks){
            const ypx=Math.round(py(y));
            svg+='<line x1="'+padL+'" y1="'+ypx+'" x2="'+(W-padR)+'" y2="'+ypx+'" stroke="var(--border)" stroke-width="1"/>';
            svg+='<text x="'+(padL-4)+'" y="'+(ypx+3)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="end">'+yLabel(y)+'</text>';
        }
        if(opts.yUnit) svg+='<text x="'+(padL-4)+'" y="'+(padT-3)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="end">'+esc(opts.yUnit)+'</text>';
        const xStep=Math.max(1,Math.ceil(n/6));
        const xIdxs=[];
        for(let i=0;i<n;i+=xStep) xIdxs.push(i);
        if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
        for(const i of xIdxs){
            const anchor=i===0?'start':i===n-1?'end':'middle';
            svg+='<text x="'+Math.round(px(i))+'" y="'+(H-4)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="'+anchor+'">'+esc(fmtShort(points[i].k))+'</text>';
        }
        if(n>1) svg+='<polyline points="'+pts+'" fill="none" stroke="'+(opts.lineColor||'var(--accent)')+'" stroke-width="2" stroke-linejoin="round"/>';
        points.forEach(function(d,i){
            const col=pointColor(d,i);
            svg+=(opts.pointHollow&&opts.pointHollow(d,i))?'<circle cx="'+Math.round(px(i))+'" cy="'+Math.round(py(d.v))+'" r="3" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>':'<circle cx="'+Math.round(px(i))+'" cy="'+Math.round(py(d.v))+'" r="3" fill="'+col+'"/>';
            if(n<3) svg+='<text x="'+Math.round(px(i))+'" y="'+(Math.round(py(d.v))-6)+'" font-size="'+(9*K)+'" fill="'+col+'" text-anchor="middle">'+yLabel(d.v)+'</text>';
        });
        svg+='</svg>';
        return svg;
    }

    // ============ Exercise history ============
    const SERIES_COLORS=["var(--accent)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
    function exBaseOf(e){ return e.base||parseExName(e.name).base; }
    function exVariantOf(e){ return e.base?(e.variant||null):parseExName(e.name).variant; }
    // записи с подходами по base (регистр не важен; план на группировку не влияет)
    function groupEntries(baseName){
        const key=String(baseName).trim().toLowerCase(), out=[];
        for(const k of Object.keys(data.log).sort()) for(const e of (data.log[k].exercises||[])){
            if(!e.sets||!e.sets.length) continue;
            if(exBaseOf(e).trim().toLowerCase()!==key) continue;
            out.push({k:k, e:e, variant:exVariantOf(e), w:e.sets.reduce(function(m,s){return Math.max(m,s.w);},0)});
        }
        return out;
    }
    // серии: по одной на variant (без учёта регистра); записи без варианта — своя серия
    function groupSeries(entries){
        const map={};
        for(const it of entries){
            const vk=(it.variant||"").trim().toLowerCase();
            const sr=map[vk]||(map[vk]={key:vk, label:it.variant?it.variant.trim():"без варианта", pts:{}, n:0});
            if(it.variant) sr.label=it.variant.trim();
            sr.pts[it.k]=Math.max(sr.pts[it.k]||0,it.w); sr.n++;
        }
        const list=Object.keys(map).map(function(k){
            const sr=map[k];
            sr.points=Object.keys(sr.pts).sort().map(function(d){return {k:d,v:sr.pts[d]};});
            return sr;
        });
        list.sort(function(a,b){ return b.n-a.n || (a.key<b.key?-1:1); });
        list.forEach(function(sr,i){ sr.color=SERIES_COLORS[i%SERIES_COLORS.length]; });
        return list;
    }
    // несколько линий на общей оси дат (ось — по объединению дат группы)

        const ystep=niceStep(range>0?range:Math.max(1,maxV*0.2),5);
        const ymin=Math.floor(minV/ystep)*ystep, ymax=Math.ceil(maxV/ystep)*ystep, yticks=[];
        for(let y=ymin;y<=ymax+ystep*0.001;y+=ystep) yticks.push(Math.round(y*1000)/1000);
        const W=340, H=Math.round(180+(K-1)*80), padR=10, padT=Math.round(16*K), padB=Math.round(26*K), pw=W-padL-padR, ph=H-padT-padB;
        const px=function(i){ return padL+(n>1?i/(n-1)*pw:pw/2); };
        const py=function(v){ const r=ymax-ymin||1; return padT+ph-(v-ymin)/r*ph; };
        let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:hidden" xmlns="http://www.w3.org/2000/svg">';
        for(const y of yticks){
            const ypx=Math.round(py(y));
            svg+='<line x1="'+padL+'" y1="'+ypx+'" x2="'+(W-padR)+'" y2="'+ypx+'" stroke="var(--border)" stroke-width="1"/>';
            svg+='<text x="'+(padL-4)+'" y="'+(ypx+3)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="end">'+yLabel(y)+'</text>';
        }
        if(opts.yUnit) svg+='<text x="'+(padL-4)+'" y="'+(padT-3)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="end">'+esc(opts.yUnit)+'</text>';
        const xStep=Math.max(1,Math.ceil(n/6)), xIdxs=[];
        for(let i=0;i<n;i+=xStep) xIdxs.push(i);
        if(xIdxs[xIdxs.length-1]!==n-1) xIdxs.push(n-1);
        for(const i of xIdxs){
            const anchor=i===0?'start':i===n-1?'end':'middle';
            svg+='<text x="'+Math.round(px(i))+'" y="'+(H-4)+'" font-size="'+(9*K)+'" fill="var(--text-muted)" text-anchor="'+anchor+'">'+esc(fmtShort(dates[i]))+'</text>';
        }
        for(const sr of series){
            const pts=sr.points.map(function(p){return px(dates.indexOf(p.k))+','+py(p.v);}).join(' ');

    // ============ Аналитика («Сводка») ============
    function dayTonnage(day){ let t=0; for(const e of (day.exercises||[])) for(const s of (e.sets||[])) t+=s.w*s.r; return t; }
    function daySetsCount(day){ let n=0; for(const e of (day.exercises||[])) n+=(e.sets||[]).length; return n; }
    function dayExCount(day){ return (day.exercises||[]).filter(function(e){return (e.sets||[]).length;}).length; }
    function fmtTonnage(v){ return Math.round(v).toLocaleString("ru-RU"); }
    function fmtTonnageShort(v){ return v>=1000?(Math.round(v/100)/10)+"k":String(Math.round(v)); }
    function computeCycles(workouts){
        if(!data.cfg.cycle.anchorDate) return [];
        const groups={};
        for(const w of workouts){
            const wi=weekInfo(w.k); if(!wi) continue;
            const start=addDays(w.k,-wi.day);
            if(!groups[start]) groups[start]={start:start,workouts:[]};
            groups[start].workouts.push(w);
        }
        const cycleLen=(data.cfg.cycle.workWeeks+data.cfg.cycle.restWeeks)*7;
        const list=Object.keys(groups).sort().map(function(start){
            const g=groups[start];
            const tonnage=g.workouts.reduce(function(a,w){return a+w.tonnage;},0);
            return { start:start, end:addDays(start,cycleLen-1), count:g.workouts.length, tonnage:tonnage };
        });
        list.forEach(function(c,i){
            c.idx=i+1;
            c.changePct=(i>0&&list[i-1].tonnage>0)?Math.round((c.tonnage-list[i-1].tonnage)/list[i-1].tonnage*100):null;
        });
        return list;
    }
    function computeRecords(){
        const best={};
        for(const k of Object.keys(data.log).sort()) for(const e of (data.log[k].exercises||[])){
            if(!e.sets||!e.sets.length) continue;
            const top=e.sets.reduce(function(a,s){return s.w>a.w?s:a;});
            const b=exBaseOf(e).trim(), v=exVariantOf(e), key=b.toLowerCase()+"|"+(v||"").trim().toLowerCase();
            if(!best[key]||top.w>best[key].w) best[key]={name:composeName(b,null,v),base:b,w:top.w,date:k};
        }
        return Object.keys(best).map(function(k){return best[k];}).sort(function(a,b){return b.w-a.w;}).slice(0,10);
    }
    function computeSummary(period){
        const cutoff=period==="1m"?Date.now()-30*86400000:period==="3m"?Date.now()-90*86400000:null;
        const workouts=Object.keys(data.log).sort().filter(function(k){
            const day=data.log[k];
            if(!daySetsCount(day)) return false;
            if(cutoff!==null&&parseKey(k).getTime()<cutoff) return false;
            return true;
        }).sort().map(function(k){
            const day=data.log[k];
            return { k:k, title:(day.title||"").trim(), tonnage:dayTonnage(day), sets:daySetsCount(day), ex:dayExCount(day) };
        });
        const totalWorkouts=workouts.length;
        const totalTonnage=workouts.reduce(function(a,w){return a+w.tonnage;},0);
        const avgTonnage=totalWorkouts?totalTonnage/totalWorkouts:0;
        let heaviest=null;
        for(const w of workouts) if(!heaviest||w.tonnage>heaviest.tonnage) heaviest=w;
        const byTitleMap={};
        for(const w of workouts){
            const key=w.title||"Без названия";
            if(!byTitleMap[key]) byTitleMap[key]={title:key,count:0,tonnage:0};
            byTitleMap[key].count++; byTitleMap[key].tonnage+=w.tonnage;
        }
        const byTitle=Object.keys(byTitleMap).map(function(k){
            const b=byTitleMap[k]; return {title:b.title,count:b.count,tonnage:b.tonnage,avg:b.tonnage/b.count};
        }).sort(function(a,b){return b.tonnage-a.tonnage;});
        return { workouts:workouts, totalWorkouts:totalWorkouts, totalTonnage:totalTonnage, avgTonnage:avgTonnage,
            heaviest:heaviest, byTitle:byTitle, cycles:computeCycles(workouts), records:computeRecords() };
    }
    function getSummaryData(period){
        if(summaryCache.period!==period){ summaryCache.period=period; summaryCache.result=computeSummary(period); }
        return summaryCache.result;
    }
    function statBlock(label,value){ return '<div><div class="lbl">'+esc(label)+'</div><div style="font-size:1.1875rem;font-weight:700;margin-top:2px">'+value+'</div></div>'; }

                    +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+esc(r.name)+'</span>'

    // ============ Import from text notes ============
    function normalizeExName(name){
        return name.toLowerCase().replace(/ё/g,'е').replace(/\([^()]*\)\s*$/,'').replace(/\s+/g,' ').trim();
    }
    function parseWorkoutText(text){
        const DATE_LINE=/^(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?:\s|$)/;
        const SET_PAT=/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)(?:\s*[-–—]\s*(\d+))?/gi;
        const curYear=new Date().getFullYear();
        const workouts=[], out=workouts;
        let cur=null, prevEx=null;
        for(let line of String(text||'').split(/\r?\n/)){
            line=line.trim(); if(!line) continue;
            const dm=line.match(DATE_LINE);
            if(dm){
                const day2=parseInt(dm[1],10), mon=parseInt(dm[2],10);
                if(day2>=1&&day2<=31&&mon>=1&&mon<=12){
                    let yr=dm[3]?parseInt(dm[3],10):curYear;
                    if(yr<100) yr=2000+yr;
                    const dk=yr+'-'+String(mon).padStart(2,'0')+'-'+String(day2).padStart(2,'0');
                    const title=line.replace(DATE_LINE,'').replace(/^\s*[,;:—–-]*\s*/,'').trim();
                    cur={date:dk,title:title,exercises:[],conflicts:'skip'};
                    out.push(cur); prevEx=null; continue;
                }
            }
            const matches=[]; let m; SET_PAT.lastIndex=0;
            while((m=SET_PAT.exec(line))!==null) matches.push({idx:m.index,n:parseFloat(m[1].replace(',','.')),reps:parseInt(m[2],10),top:m[3]?parseInt(m[3],10):null});
            if(!matches.length){
                if(!cur){ cur={date:null,title:line,exercises:[],conflicts:'skip'}; out.push(cur); prevEx=null; }
                else if(!cur.exercises.length) cur.title=line;
                continue;
            }
            const beforeFirst=line.slice(0,matches[0].idx).trim();
            if(!beforeFirst&&prevEx){
                for(const mt of matches) if(mt.top===null) prevEx.sets.push({w:mt.n,r:mt.reps});
                continue;
            }
            if(!cur){ cur={date:null,title:'',exercises:[],conflicts:'skip'}; out.push(cur); }
            let name=line.slice(0,matches[0].idx).replace(/^\s*\d+[.)]\s*/,'').replace(/[\s,;:—–-]+$/,'').replace(/\(\s*$/,'').trim();
            if(!name&&prevEx){ for(const mt of matches) if(mt.top===null) prevEx.sets.push({w:mt.n,r:mt.reps}); continue; }
            if(!name) continue;
            const first=matches[0];
            const isFrac=(first.n%1)!==0;
            let planStr=null;
            const resultSets=[];
            const isPlanA=first.top!==null&&!isFrac; // диапазон: 3х8-12
            const hasEnoughFollow=matches.length-1>=2;
            const isPlanB=!isFrac&&Number.isInteger(first.n)&&first.n<=8&&hasEnoughFollow&&matches.slice(1).every(function(mt){return mt.n!==first.n;});
            if(isPlanA){
                planStr=first.n+'х'+first.reps+'-'+first.top;
                for(let i=1;i<matches.length;i++) if(matches[i].top===null) resultSets.push({w:matches[i].n,r:matches[i].reps});
            } else if(isPlanB){
                planStr=first.n+'х'+first.reps;
                for(let i=1;i<matches.length;i++) if(matches[i].top===null) resultSets.push({w:matches[i].n,r:matches[i].reps});
            } else {
                for(const mt of matches) if(mt.top===null) resultSets.push({w:mt.n,r:mt.reps});
            }
            const fullName=planStr?name+' ('+planStr+')':name;
            const ex={name:fullName,sets:resultSets};
            cur.exercises.push(ex); prevEx=ex;
        }
        return out.filter(function(w){return w.exercises.length;});
    }
    function canonicalExName(rawName){
        const norm=normalizeExName(rawName);
        for(const t of data.templates) for(const b of t.blocks) for(const it of b.items){
            const cn=fullEx(it); if(normalizeExName(cn)===norm) return cn;
        }
        for(const k of Object.keys(data.log).sort()) for(const e of (data.log[k].exercises||[])){
            if(normalizeExName(e.name)===norm) return e.name;
        }
        return rawName;
    }
    // "40х10, 40х10, 42.5х8" → {sets:[{w,r}], valid} — используется в редактируемом предпросмотре импорта
    function parseSetsStr(str){
        const s=String(str||"").trim();
        if(!s) return {sets:[], valid:true};
        const PAIR_RE=/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)/gi;
        const sets=[];
        let m;
        while((m=PAIR_RE.exec(s))!==null) sets.push({w:parseFloat(m[1].replace(",",".")), r:parseInt(m[2],10)});
        const rest=s.replace(/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)/gi,"").replace(/[\s,;]+/g,"");
        if(rest) return {sets:[], valid:false};
        return {sets:sets, valid:true};
    }

    // ============ Excel ============
    // плоская таблица «одна строка на подход»: Дата | Тренировка | Неделя цикла | Упражнение(base) | Вариант | План | Подход | Вес, кг | Повторы | Заметка
    const EXPORT_HEADER=["Дата","Тренировка","Неделя цикла","Упражнение","Вариант","План","Подход","Вес, кг","Повторы","Заметка"];
    // формат как в v1: «Рабочая · неделя N» / «Отдых»; если тип, записанный в дне, расходится с текущим циклом — верим записанному
    function exportWeekLabel(k){
        const day=data.log[k], wi=weekInfo(k), wt=day&&day.weekType;
        if(wt&&(!wi||(wi.isRest?"rest":"work")!==wt)) return wt==="rest"?"Отдых":"Рабочая";

    function buildExportRows(){
        const rows=[EXPORT_HEADER.slice()];

    // CSV для русского Excel: UTF-8 с BOM, разделитель «;», десятичная запятая
    function csvCell(v){

    function exportFilename(ext){ return "gym-tracker-"+toKey(new Date())+"."+ext; }
    const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    function buildXlsxBytes(){
        const ws=XLSX.utils.aoa_to_sheet(buildExportRows());
        ws["!cols"]=[{wch:12},{wch:14},{wch:18},{wch:34},{wch:14},{wch:10},{wch:8},{wch:9},{wch:9},{wch:24}];

    // ============ отправка копии в чат через Cloudflare Worker (worker/) ============
    const BACKUP_ENDPOINT="";   // адрес Worker после деплоя; пусто — кнопки отправки скрыты, приложение работает без сервера
    function bytesToBase64(u8){
        let bin=""; const arr=new Uint8Array(u8);
        for(let i=0;i<arr.length;i+=0x8000) bin+=String.fromCharCode.apply(null,arr.subarray(i,i+0x8000));
        return btoa(bin);
    }
    function canSendBackup(){ return !!(BACKUP_ENDPOINT&&tg&&tg.initData); }
    // ядро отправки: {ok:true} | {ok:false, text, expired}
    async function postBackup(format){
        let content, encoding="text";
        if(format==="json") content=JSON.stringify(buildBackupDump());
        else if(format==="csv") content=buildCsv();
        else if(format==="xlsx"){
            if(typeof XLSX==="undefined") return {ok:false,text:"Нет интернета — библиотека Excel не загрузилась",noLib:true};
            content=bytesToBase64(buildXlsxBytes()); encoding="base64";
        } else return {ok:false,text:"Неизвестный формат"};
        const ctl=new AbortController(), timer=setTimeout(function(){ ctl.abort(); },30000);
        try{
            const res=await fetch(BACKUP_ENDPOINT,{ method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
                body:JSON.stringify({ initData:tg.initData, env:ENV, format:format, filename:exportFilename(format), content:content, encoding:encoding }) });
            let j=null; try{ j=await res.json(); }catch(parseErr){ j=null; }
            if(res.ok&&j&&j.ok) return {ok:true};
            const why=(j&&(j.description||j.error))||("HTTP "+res.status);
            if(res.status===403&&j&&j.error==="expired") return {ok:false,text:"Сессия устарела — откройте приложение заново",expired:true,reason:why};
            return {ok:false,text:"Не отправлено: "+why,reason:why};
        }catch(e){
            if(e&&e.name==="AbortError") return {ok:false,text:"Не отправлено: сервер не ответил за 30 с",reason:"сервер не ответил за 30 с"};
            return {ok:false,text:"Не удалось отправить: "+errText(e),reason:errText(e)};
        }finally{ clearTimeout(timer); }
    }
    async function sendBackup(format){
        if(!canSendBackup()||ui.sending) return;
        if(format==="xlsx"&&typeof XLSX==="undefined"){ toast("Нет интернета — библиотека Excel не загрузилась"); return; }
        ui.sending=format; render();
        const r=await postBackup(format);
        ui.sending=null;
        if(r.ok){
            toast("Отправлено в чат");
            if(format==="json"){ data.cfg.lastBackup=new Date().toISOString(); persistCfg(); }   // только JSON — полная копия
        } else toast(r.text);
        render();
    }

    // ============ диалоги и автоотправка копии ============

    function snoozeBackup(hours){ data.cfg.backupSnooze=Date.now()+hours*3600000; persistCfg(); render(); }

    async function autoBackupSend(){
