    // ============ Аналитика («Сводка») ============
    function dayTonnage(day){ let t=0; for(const e of (day.exercises||[])) for(const s of (e.sets||[])) t+=s.w*s.r; return t; }
    function daySetsCount(day){ let n=0; for(const e of (day.exercises||[])) n+=(e.sets||[]).length; return n; }
    function dayExCount(day){ return (day.exercises||[]).filter(function(e){return (e.sets||[]).length;}).length; }
    function fmtTonnage(v){ return Math.round(v).toLocaleString("ru-RU"); }
    function fmtTonnageShort(v){ return v>=1000?(Math.round(v/100)/10)+"k":String(Math.round(v)); }
    function computeCycles(workouts){
        if(!data.cfg.cycle.anchorDate) return [];
        const groups={};
        for(const w of workouts){
            const wi=weekInfo(w.k); if(!wi) continue;
            const start=addDays(w.k,-wi.day);
            if(!groups[start]) groups[start]={start:start,workouts:[]};
            groups[start].workouts.push(w);
        }
        const cycleLen=(data.cfg.cycle.workWeeks+data.cfg.cycle.restWeeks)*7;
        const list=Object.keys(groups).sort().map(function(start){
            const g=groups[start];
            const tonnage=g.workouts.reduce(function(a,w){return a+w.tonnage;},0);
            return { start:start, end:addDays(start,cycleLen-1), count:g.workouts.length, tonnage:tonnage };
        });
        list.forEach(function(c,i){
            c.idx=i+1;
            c.changePct=(i>0&&list[i-1].tonnage>0)?Math.round((c.tonnage-list[i-1].tonnage)/list[i-1].tonnage*100):null;
        });
        return list;
    }
    function computeRecords(){
        const best={};
        for(const k of Object.keys(data.log)) for(const e of (data.log[k].exercises||[])){
            if(!e.sets||!e.sets.length) continue;
            const top=e.sets.reduce(function(a,s){return s.w>a.w?s:a;});
            const b=exBaseOf(e).trim(), v=exVariantOf(e), key=b.toLowerCase()+"|"+(v||"").trim().toLowerCase();
            if(!best[key]||top.w>best[key].w) best[key]={name:composeName(b,null,v),base:b,w:top.w,date:k};
        }
        return Object.keys(best).map(function(k){return best[k];}).sort(function(a,b){return b.w-a.w;}).slice(0,10);
    }
    function computeSummary(period){
        const cutoff=period==="1m"?Date.now()-30*86400000:period==="3m"?Date.now()-90*86400000:null;
        const workouts=Object.keys(data.log).filter(function(k){
            const day=data.log[k];
            if(!daySetsCount(day)) return false;
            if(cutoff!==null&&parseKey(k).getTime()<cutoff) return false;
            return true;
        }).sort().map(function(k){
            const day=data.log[k];
            return { k:k, title:(day.title||"").trim(), tonnage:dayTonnage(day), sets:daySetsCount(day), ex:dayExCount(day) };
        });
        const totalWorkouts=workouts.length;
        const totalTonnage=workouts.reduce(function(a,w){return a+w.tonnage;},0);
        const avgTonnage=totalWorkouts?totalTonnage/totalWorkouts:0;
        let heaviest=null;
        for(const w of workouts) if(!heaviest||w.tonnage>heaviest.tonnage) heaviest=w;
        const byTitleMap={};
        for(const w of workouts){
            const key=w.title||"Без названия";
            if(!byTitleMap[key]) byTitleMap[key]={title:key,count:0,tonnage:0};
            byTitleMap[key].count++; byTitleMap[key].tonnage+=w.tonnage;
        }
        const byTitle=Object.keys(byTitleMap).map(function(k){
            const b=byTitleMap[k]; return {title:b.title,count:b.count,tonnage:b.tonnage,avg:b.tonnage/b.count};
        }).sort(function(a,b){return b.tonnage-a.tonnage;});
        return { workouts:workouts, totalWorkouts:totalWorkouts, totalTonnage:totalTonnage, avgTonnage:avgTonnage,
            heaviest:heaviest, byTitle:byTitle, cycles:computeCycles(workouts), records:computeRecords() };
    }
    function getSummaryData(period){
        if(summaryCache.period!==period){ summaryCache.period=period; summaryCache.result=computeSummary(period); }
        return summaryCache.result;
    }

                    +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+esc(r.name)+'</span>'
                    +'<span class="num" style="color:var(--mut);flex-shrink:0">'+fmtW(r.w)+' кг · '+esc(fmtShort(r.date))+'</span></button>';

    // ============ Import from text notes ============
    function normalizeExName(name){
        return name.toLowerCase().replace(/ё/g,'е').replace(/\([^()]*\)\s*$/,'').replace(/\s+/g,' ').trim();
    }
    function parseWorkoutText(text){
        const DATE_LINE=/^(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?:\s|$)/;
        const SET_PAT=/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)(?:\s*[-–—]\s*(\d+))?/gi;
        const curYear=new Date().getFullYear();
        const workouts=[], out=workouts;
        let cur=null, prevEx=null;
        for(let line of String(text||'').split(/\r?\n/)){
            line=line.trim(); if(!line) continue;
            const dm=line.match(DATE_LINE);
            if(dm){
                const day2=parseInt(dm[1],10), mon=parseInt(dm[2],10);
                if(day2>=1&&day2<=31&&mon>=1&&mon<=12){
                    let yr=dm[3]?parseInt(dm[3],10):curYear;
                    if(yr<100) yr=2000+yr;
                    const dk=yr+'-'+String(mon).padStart(2,'0')+'-'+String(day2).padStart(2,'0');
                    const title=line.replace(DATE_LINE,'').replace(/^\s*[,;:—–-]*\s*/,'').trim();
                    cur={date:dk,title:title,exercises:[],conflicts:'skip'};
                    out.push(cur); prevEx=null; continue;
                }
            }
            const matches=[]; let m; SET_PAT.lastIndex=0;
            while((m=SET_PAT.exec(line))!==null) matches.push({idx:m.index,n:parseFloat(m[1].replace(',','.')),reps:parseInt(m[2],10),top:m[3]?parseInt(m[3],10):null});
            if(!matches.length){
                if(!cur){ cur={date:null,title:line,exercises:[],conflicts:'skip'}; out.push(cur); prevEx=null; }
                else if(!cur.exercises.length) cur.title=line;
                continue;
            }
            const beforeFirst=line.slice(0,matches[0].idx).trim();
            if(!beforeFirst&&prevEx){
                for(const mt of matches) if(mt.top===null) prevEx.sets.push({w:mt.n,r:mt.reps});
                continue;
            }
            if(!cur){ cur={date:null,title:'',exercises:[],conflicts:'skip'}; out.push(cur); }
            let name=line.slice(0,matches[0].idx).replace(/^\s*\d+[.)]\s*/,'').replace(/[\s,;:—–-]+$/,'').replace(/\(\s*$/,'').trim();
            if(!name&&prevEx){ for(const mt of matches) if(mt.top===null) prevEx.sets.push({w:mt.n,r:mt.reps}); continue; }
            if(!name) continue;
            const first=matches[0];
            const isFrac=(first.n%1)!==0;
            let planStr=null;
            const resultSets=[];
            const isPlanA=first.top!==null&&!isFrac; // диапазон: 3х8-12
            const hasEnoughFollow=matches.length-1>=2;
            const isPlanB=!isFrac&&Number.isInteger(first.n)&&first.n<=8&&hasEnoughFollow&&matches.slice(1).every(function(mt){return mt.n!==first.n;});
            if(isPlanA){
                planStr=first.n+'х'+first.reps+'-'+first.top;
                for(let i=1;i<matches.length;i++) if(matches[i].top===null) resultSets.push({w:matches[i].n,r:matches[i].reps});
            } else if(isPlanB){
                planStr=first.n+'х'+first.reps;
                for(let i=1;i<matches.length;i++) if(matches[i].top===null) resultSets.push({w:matches[i].n,r:matches[i].reps});
            } else {
                for(const mt of matches) if(mt.top===null) resultSets.push({w:mt.n,r:mt.reps});
            }
            const fullName=planStr?name+' ('+planStr+')':name;
            const ex={name:fullName,sets:resultSets};
            cur.exercises.push(ex); prevEx=ex;
        }
        return out.filter(function(w){return w.exercises.length;});
    }
    function canonicalExName(rawName){
        const norm=normalizeExName(rawName);
        for(const t of data.templates) for(const b of t.blocks) for(const it of b.items){
            const cn=fullEx(it); if(normalizeExName(cn)===norm) return cn;
        }
        for(const k of Object.keys(data.log)) for(const e of (data.log[k].exercises||[])){
            if(normalizeExName(e.name)===norm) return e.name;
        }
        return rawName;
    }
    // "40х10, 40х10, 42.5х8" → {sets:[{w,r}], valid} — используется в редактируемом предпросмотре импорта
    function parseSetsStr(str){
        const s=String(str||"").trim();
        if(!s) return {sets:[], valid:true};
        const PAIR_RE=/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)/gi;
        const sets=[];
        let m;
        while((m=PAIR_RE.exec(s))!==null) sets.push({w:parseFloat(m[1].replace(",",".")), r:parseInt(m[2],10)});
        const rest=s.replace(/(\d+(?:[.,]\d+)?)\s*[хx×*]\s*(\d+)/gi,"").replace(/[\s,;]+/g,"");
        if(rest) return {sets:[], valid:false};
        return {sets:sets, valid:true};
    }
    function setsToStr(sets){ return (sets||[]).map(function(s){return fmtW(s.w)+"х"+s.r;}).join(", "); }

    function exportXlsx(){
        if(typeof XLSX==="undefined"){ toast("Нет интернета — библиотека Excel не загрузилась"); return; }
        const rows=[["Дата","Тренировка","Неделя цикла","Упражнение","Подход","Вес, кг","Повторы","Заметка дня","Заметка упражнения"]];
        for(const k of Object.keys(data.log).sort()){
            const wi=weekInfo(k), day=data.log[k];
            for(const ex of day.exercises)
                ex.sets.forEach(function(s,i){ rows.push([k, day.title||"", wi?weekLabel(wi):"", ex.name, i+1, s.w, s.r, i===0?day.note||"":"", i===0?ex.note||"":""]); });
        }
        const ws=XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"]=[{wch:12},{wch:14},{wch:18},{wch:28},{wch:8},{wch:9},{wch:9},{wch:22},{wch:22}];
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,"Тренировки");
        XLSX.writeFile(wb,"Тренировки.xlsx");
    }
    function normDate(v){
        if(v instanceof Date && !isNaN(v)) return toKey(new Date(v.getTime()+12*3600000));
        if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
        if(typeof v==="string"){
            const s=v.trim();
            let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
            m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
        }
        return null;
    }
    function importXlsx(file){
        if(typeof XLSX==="undefined"){ toast("Нет интернета — библиотека Excel не загрузилась"); return; }
        const reader=new FileReader();
        reader.onload=async function(e){
            try{
                const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
                const ws=wb.Sheets[wb.SheetNames[0]];
                const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
                let hi=-1, col={};
                for(let i=0;i<Math.min(rows.length,10);i++){
                    const low=(rows[i]||[]).map(function(c){return String(c||"").toLowerCase();});
                    const di=low.findIndex(function(c){return c.indexOf("дата")>=0;});
                    if(di>=0){
                        hi=i; col.date=di;
                        col.title=low.findIndex(function(c){return c.indexOf("трениров")>=0;});
                        col.ex=low.findIndex(function(c){return c.indexOf("упражн")>=0;});
                        col.w=low.findIndex(function(c){return c.indexOf("вес")>=0;});
                        col.r=low.findIndex(function(c){return c.indexOf("повтор")>=0;});
                        break;
                    }
                }
                if(hi<0||col.ex<0||col.w<0||col.r<0){ toast("Не нашёл нужные колонки в файле"); return; }
                const low0=(rows[hi]||[]).map(function(c){return String(c||"").toLowerCase();});
                col.dayNote=low0.findIndex(function(c){return c.indexOf("заметка дня")>=0;});
                col.exNote=low0.findIndex(function(c){return c.indexOf("заметка упражн")>=0;});
                const imported={}; let nSets=0;
                for(let i=hi+1;i<rows.length;i++){
                    const row=rows[i]; if(!row) continue;
                    const dk=normDate(row[col.date]); if(!dk) continue;
                    const exName=String(row[col.ex]||"").trim(); if(!exName) continue;
                    const w=parseFloat(String(row[col.w]).replace(",","."));
                    const r=parseInt(row[col.r],10);
                    if(isNaN(w)||isNaN(r)) continue;
                    if(!imported[dk]) imported[dk]={title:"",exercises:[]};
                    if(col.title>=0&&row[col.title]&&!imported[dk].title) imported[dk].title=String(row[col.title]).trim();
                    if(col.dayNote>=0&&row[col.dayNote]&&!imported[dk].note) imported[dk].note=String(row[col.dayNote]).trim();
                    const pe=parseExName(exName), cand=newEx(pe.base,pe.plan,pe.variant);
                    let ex=imported[dk].exercises.find(function(x){return x.name.toLowerCase()===cand.name.toLowerCase();});
                    if(!ex){ ex=cand; imported[dk].exercises.push(ex); }
                    if(col.exNote>=0&&row[col.exNote]&&!ex.note) ex.note=String(row[col.exNote]).trim();
                    ex.sets.push({w:w,r:r}); nSets++;
                }
                const days=Object.keys(imported);
                if(!days.length){ toast("В файле не нашлось данных"); return; }
                for(const dk of days){
                    const wi=weekInfo(dk); if(wi) imported[dk].weekType=wi.isRest?"rest":"work";
                    data.log[dk]=imported[dk];
                }
                applyMigrations(); saveCache(); render();
                toast("Импортировано: дней — "+days.length+", подходов — "+nSets);
                for(const dk of days) await csSet("w_"+dk, JSON.stringify(data.log[dk]));
            }catch(err){ console.error(err); toast("Не удалось прочитать файл"); }
        };
        reader.readAsArrayBuffer(file);
    }

                h+='<button class="note-toggle" data-act="noteToggle">'+(ui.dayNoteOpen?ICON_CHEVRON_DOWN+' Заметка':ICON_NOTE+' '+(notePreview||'Заметка'))+'</button>';

                +'<button class="btn-gray" data-act="tplCancel">'+ICON_CLOSE+'</button></div>';

        if(applicable.length){
            h+='<div class="sec-label">Начать по шаблону</div><div class="chips">';
            for(const t of applicable)
                h+='<button class="chip" data-act="tplApply" data-id="'+t.id+'">'+esc(t.name)+'</button>';

    function calPage(){
        const parts=calMonth.split("-").map(Number), y=parts[0], m=parts[1];
        const first=new Date(y,m-1,1);
        const daysIn=new Date(y,m,0).getDate();
        const lead=(first.getDay()+6)%7;
        const today=toKey(new Date());
        const monthName=first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
        let h='<div class="card"><div class="cal-head">'
            +'<button class="cal-nav" data-act="calPrev">'+ICON_CHEVRON_LEFT+'</button>'
            +'<div class="cal-title">'+esc(monthName)+'</div>'
            +'<button class="cal-nav" data-act="calNext">'+ICON_CHEVRON_RIGHT+'</button></div><div class="cal-grid">';
        for(const d of ["пн","вт","ср","чт","пт","сб","вс"]) h+='<div class="cal-dow">'+d+'</div>';
        for(let i=0;i<lead;i++) h+='<div></div>';
        for(let d=1;d<=daysIn;d++){
            const key=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
            const entry=data.log[key];
            const hasSets=entry&&entry.exercises.some(function(e){return e.sets.length;});
            const wi=weekInfo(key);
            let cls="cal-day";
            if(wi&&wi.isRest) cls+=" rest";
            if(entry) cls+=" has";
            if(key===curDate) cls+=" sel";
            if(key===today) cls+=" today";
            h+='<button class="'+cls+'" data-act="calGo" data-date="'+key+'">'
                +'<span class="n num">'+d+'</span>'
                +(entry&&entry.title?'<span class="t">'+esc(entry.title)+'</span>':hasSets||entry?'<span class="dotm"></span>':'')
                +'</button>';
        }
        h+='</div><div class="cal-legend">'
            +'<span><i style="background:rgba(52,211,153,.35)"></i>неделя отдыха</span>'
            +'<span><i style="background:var(--btn)"></i>есть тренировка</span>'
            +'</div></div>';
        return h;
    }

    const ACCENT_PRESETS=['#ff9f0a','#2481cc','#34d399','#8b5cf6','#f87171','#22d3ee'];
    const PALETTE_VARS=['--bg','--card','--text','--mut','--border','--card2'];
    const DARK_PAL={'--bg':'#09090b','--card':'#18181b','--text':'#f4f4f5','--mut':'#a1a1aa','--border':'rgba(128,128,128,.22)','--card2':'rgba(128,128,128,.14)'};
    const LIGHT_PAL={'--bg':'#f8f8f8','--card':'#ffffff','--text':'#09090b','--mut':'#71717a','--border':'rgba(0,0,0,.12)','--card2':'rgba(0,0,0,.06)'};
    function hexToRgb(hex){ return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)}; }
    function accentBtnText(hex){ const {r,g,b}=hexToRgb(hex); return (r*0.299+g*0.587+b*0.114)/255>0.5?'#09090b':'#ffffff'; }
    function applyTheme(){
        const el=document.documentElement;
        const theme=data.cfg.theme||'tg', accent=data.cfg.accent||'#ff9f0a';
        if(theme==='tg'){ PALETTE_VARS.forEach(function(v){ el.style.removeProperty(v); }); }
        else { const pal=theme==='dark'?DARK_PAL:LIGHT_PAL; PALETTE_VARS.forEach(function(v){ el.style.setProperty(v,pal[v]); }); }
        const {r,g,b}=hexToRgb(accent);
        el.style.setProperty('--btn',accent);
        el.style.setProperty('--accent',accent);
        el.style.setProperty('--link',accent);
        el.style.setProperty('--accent-bg','rgba('+r+','+g+','+b+',.14)');
        el.style.setProperty('--btn-text',accentBtnText(accent));
    }

    function fmtBackupDate(iso){
        if(!iso) return null;
        const d=new Date(iso);
        return d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"})+' '+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    }

    // сохранить изменённые алиасы и повторно применить их к логу
    function aliasCommit(msg,pre){
        persistCfg();
        const ch=recomputeLog(pre);
        toast(ch.length?(msg+". Пересчитано дней: "+ch.length):msg);
        render();
    }
    function aliasEntries(kind){ return Object.entries(kind==="var"?data.cfg.variantAliases:data.cfg.aliases); }
    function aliasWrite(kind,entries){ const o={}; for(const e of entries) o[e[0]]=e[1]; if(kind==="var") data.cfg.variantAliases=o; else data.cfg.aliases=o; }
    function aliasValidate(kind,entries,idx,oldv,newv){
        if(!oldv||!newv){ toast("Заполните оба поля"); return false; }
        if(oldv.toLowerCase()===newv.toLowerCase()){ toast("Старое и каноническое значения совпадают"); return false; }
        const dup=entries.some(function(e,i){ return i!==idx && e[0].trim().toLowerCase()===oldv.toLowerCase(); });
        if(dup){ toast("Такой алиас уже есть"); return false; }
        return true;
    }
    function aliasRowChanged(target){
        const row=target.closest(".alias-row"), kind=row.dataset.kind, idx=+row.dataset.i;
        const inp=row.querySelectorAll("input"), oldv=inp[0].value.trim(), newv=inp[1].value.trim();
        const entries=aliasEntries(kind);
        if(!aliasValidate(kind,entries,idx,oldv,newv)){ render(); return; }
        const prevTarget=entries[idx][1];
        entries[idx]=[oldv,newv]; aliasWrite(kind,entries);
        // если сменилось каноническое значение, записи со старым каноническим значением переезжают на новое
        let pre=null;
        if(prevTarget.trim().toLowerCase()!==newv.toLowerCase()){
            if(kind==="var"){
                pre=function(e){ if(e.variant&&e.variant.trim().toLowerCase()===prevTarget.trim().toLowerCase()) e.variant=newv; };
            } else {
                const po=parseAliasTarget(prevTarget), pn=parseAliasTarget(newv);
                pre=function(e){
                    if(!e.base||e.base.trim().toLowerCase()!==po.base.toLowerCase()) return;
                    if(po.variant&&(e.variant||"").toLowerCase()!==po.variant.toLowerCase()) return;
                    e.base=pn.base; if(po.variant) e.variant=pn.variant;
                };
            }
        }
        aliasCommit("Алиас изменён",pre);
    }

    app.addEventListener("change",function(e){
        if(e.target.dataset.chg==="aliasPair"){ aliasRowChanged(e.target); return; }
        const setField=e.target.dataset.set;
        if(setField==="w"||setField==="r"){
            const d=getDay();
            const ex=d.exercises.find(function(x){return x.id===e.target.dataset.id;});
            if(!ex) return;
            const i=+e.target.dataset.i;
            if(i<0||i>=ex.sets.length) return;
            const s=ex.sets[i];
            if(setField==="w"){
                const v=parseFloat(String(e.target.value).replace(",","."));
                if(isNaN(v)||v<0){ e.target.value=s.w; return; }
                s.w=v;
            } else {
                const v=parseInt(e.target.value,10);
                if(isNaN(v)||v<=0){ e.target.value=s.r; return; }
                s.r=v;
            }
            const wi=weekInfo(curDate);
            if(wi) d.weekType=wi.isRest?"rest":"work";
            d.up=Date.now();
            if(!d.exercises.length&&!(d.title||"").trim()) delete data.log[curDate];
            else data.log[curDate]=d;
            persistDay(curDate);
            return;
        }
        const et=e.target.dataset.et;
        if(et&&ui.editTpl){
            const it=ui.editTpl.blocks[+e.target.dataset.k].items[+e.target.dataset.i];
            if(et==="name") it.name=e.target.value.trim();
            else if(et==="plan") it.plan=e.target.value.trim();
            else if(et==="alt") it.alt=Math.max(1,parseInt(e.target.value,10)||1);
            return;
        }
        if(e.target.id==="et-name"&&ui.editTpl){ ui.editTpl.name=e.target.value.trim(); return; }
        if(e.target.id==="backupFile"){
            const file=e.target.files&&e.target.files[0]; if(!file) return;
            const reader=new FileReader();
            reader.onload=function(ev){
                try{
                    const obj=JSON.parse(ev.target.result);

    function applyTemplate(t){
        const day=getDay();
        if(!day.title&&(t.title||t.name)) day.title=t.title||t.name;
        for(const b of t.blocks){
            const ssId=b.type==="superset"?uid():null;
            for(const it of b.items){
                if(!it.name) continue;
                const fam=fullEx(it);
                const vr=pickVariant(it,countBase(it.name));
                const ex=newEx(it.name,it.plan||null,vr);
                if(!day.exercises.some(function(x){return x.name.toLowerCase()===ex.name.toLowerCase();})){
                    if(ssId) ex.ss=ssId;
                    day.exercises.push(ex);
                }
            }
        }
        setDay(day);
    }
    function deleteDay(){
        delete data.log[curDate];
        ui.confirmDel=false; persistDay(curDate); render();

    function doAction(act,ds){
        const day=getDay();
        switch(act){
            case "setupNext":{
                const v=document.getElementById("startInput").value;
                if(!v) return;
                ui.setupDate=v; ui.setupStep=2; renderSetup();

            }
            case "setupSkip":
                data.cfg.cycle.anchorDate=ui.setupDate; ui.setupStep=1;
                persistCfg(); render();
                break;
            case "setupParse":{
                const parsed=parseTemplatesText(document.getElementById("setupText").value);
                if(!parsed.length){ toast("Не нашёл упражнений — нужен формат «Жим 3х8-12»"); return; }
                data.templates=[]; // свои шаблоны вместо дефолтных
                let nEx=0;
                for(const p of parsed){
                    const t=normalizeTpl({id:uid(),name:p.name,title:p.name,exercises:p.exercises});
                    data.templates.push(t); persistTpl(t); nEx+=p.exercises.length;
                }

                ui.editTpl=JSON.parse(JSON.stringify(t)); render(); break;
            }
            case "etCancel": ui.editTpl=null; render(); break;
            case "etAddEx": ui.editTpl.blocks.push({type:"single",items:[{name:"",plan:""}]}); render(); break;
            case "etDelItem":{
                const b=ui.editTpl.blocks[+ds.k];
                b.items.splice(+ds.i,1);
                if(!b.items.length) ui.editTpl.blocks.splice(+ds.k,1);
                else if(b.items.length===1) b.type="single";
                render(); break;
            }
            case "etBlockUp": case "etBlockDown":{
                const k=+ds.k, k2=act==="etBlockUp"?k-1:k+1, bl=ui.editTpl.blocks;
                if(k2<0||k2>=bl.length) return;
                const tmp=bl[k]; bl[k]=bl[k2]; bl[k2]=tmp;
                render(); break;
            }
            case "etItemUp": case "etItemDown":{
                const its=ui.editTpl.blocks[+ds.k].items, i=+ds.i, i2=act==="etItemUp"?i-1:i+1;
                if(i2<0||i2>=its.length) return;
                const tmp=its[i]; its[i]=its[i2]; its[i2]=tmp;
                render(); break;
            }
            case "etJoin":{
                const k=+ds.k, bl=ui.editTpl.blocks;
                if(k+1>=bl.length) return;
                bl[k]={type:"superset",items:bl[k].items.concat(bl[k+1].items)};
                bl.splice(k+1,1);
                render(); break;
            }
            case "etSplit":{
                const k=+ds.k, bl=ui.editTpl.blocks;
                const singles=bl[k].items.map(function(it){return {type:"single",items:[it]};});
                bl.splice.apply(bl,[k,1].concat(singles));
                render(); break;
            }
            case "etVarAdd":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                const inp=document.getElementById("etv-"+ds.k+"-"+ds.i);
                let v=((inp&&inp.value)||"").trim();
                if(!v){ toast("Введите название варианта"); return; }
                const al=aliasLookup(data.cfg.variantAliases,v); if(al) v=String(al).trim()||v;
                const vars=it.vars||[];
                if(vars.some(function(x){return x.trim().toLowerCase()===v.toLowerCase();})){ toast("Такой вариант уже есть"); return; }
                it.vars=vars.concat([v]); it.alt=Math.max(1,parseInt(it.alt,10)||1); it._v=true;
                render();
                const again=document.getElementById("etv-"+ds.k+"-"+ds.i); if(again) again.focus();
                break;
            }
            case "etVarDel":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                if(!it.vars) return;
                it.vars.splice(+ds.vi,1);
                if(!it.vars.length){ delete it.vars; delete it.alt; }
                it._v=true;
                render(); break;
            }
            case "etVarsToggle":{
                const it=ui.editTpl.blocks[+ds.k].items[+ds.i];
                const showing=it._v===true||(it._v!==false&&!!it.vars);
                it._v=!showing;
                render(); break;
            }
            case "etSave":{
                const t=normalizeTpl(JSON.parse(JSON.stringify(ui.editTpl)));
                t.blocks.forEach(function(b){ b.items=b.items.filter(function(it){return it.name;}); });
                t.blocks=t.blocks.filter(function(b){return b.items.length;});
                t.blocks.forEach(function(b){ b.items.forEach(function(it){ delete it._v; }); if(b.items.length===1) b.type="single"; });
                if(!t.name){ toast("Дайте шаблону название"); return; }
                if(!t.blocks.length){ toast("Добавьте хотя бы одно упражнение"); return; }
                t.title=t.name;
                if(!t.id){ t.id=uid(); data.templates.push(t); }
                else { const i=data.templates.findIndex(function(x){return x.id===t.id;}); if(i>=0) data.templates[i]=t; else data.templates.push(t); }
                persistTpl(t); ui.editTpl=null; render();
                hap("ok"); toast("Шаблон «"+t.name+"» сохранён");
                break;

            case "tplFromText": ui.tplFromText=true; render(); break;
            case "tplTextCancel": ui.tplFromText=false; ui.tplParsed=null; render(); break;
            case "tplTextParse":{
                const parsed=parseTemplatesText(document.getElementById("tplText").value);
                if(!parsed.length){ toast("Не нашёл упражнений — нужен формат «Жим 3х8-12»"); return; }
                ui.tplParsed=parsed.map(function(t){
                    return { name:t.name, exercises:t.exercises.map(function(s){ const p=splitPlan(s); return {name:p.name, plan:p.plan}; }) };

            }

            case "tplTextSave":{

                if(hasEmptyName){ toast("Укажите название для всех упражнений"); render(); return; }
                const toSave=ui.tplParsed.filter(function(t){return t.exercises.length;});
                if(!toSave.length){ toast("Добавьте хотя бы одно упражнение"); return; }
                let nEx=0;
                toSave.forEach(function(p,i){
                    const name=(p.name||"").trim()||("Шаблон "+(i+1));
                    const old=data.templates.find(function(t){return t.name===name;});
                    if(old){ data.templates=data.templates.filter(function(t){return t.id!==old.id;}); unpersistTpl(old.id); }

            case "openHist": ui.histEx=ds.name; render(); break;
            case "histBack": ui.histEx=null; render(); break;
            case "histVariant": ui.histEx=ds.name; render(); break;
            case "noteToggle": ui.dayNoteOpen=!ui.dayNoteOpen; render(); break;
            case "exNoteToggle": ui.exNoteOpen[ds.id]=!ui.exNoteOpen[ds.id]; render(); break;

            case "applyVariant":{

                setExVariant(ex,v);
                const base=composeName(ex.base,ex.plan,null), cv=ex.variant||v;

                if(hasDateErr){ toast("Укажите дату для всех тренировок"); render(); return; }

                const toSync=[];

            case "backupCopy":{
                const dump=buildBackupDump();
                copyToClipboard(JSON.stringify(dump)).then(function(){
                    data.cfg.lastBackup=new Date().toISOString(); persistCfg(); render();
                    toast("Скопировано. Вставьте в «Избранное» в Telegram");
                }).catch(function(){ toast("Не удалось скопировать — попробуйте «Скачать файл»"); });
                break;
            }
            case "backupRestoreToggle":
                ui.backupRestoreOpen=!ui.backupRestoreOpen;
                if(!ui.backupRestoreOpen){ ui.backupParsed=null; ui.backupConfirmStep=0; }
                render(); break;
            case "backupParseText":{
                const raw=(document.getElementById("backupText")||{}).value||"";
                let obj;
                try{ obj=JSON.parse(raw); }catch(e){ toast("Не удалось разобрать JSON"); return; }
                if(!isBackupDump(obj)){ toast("Это не похоже на резервную копию Gym Tracker"); return; }
                ui.backupParsed=obj; ui.backupParsedSrc="paste"; ui.backupMode="merge"; ui.backupConfirmStep=0;
                render();
                break;
            }
            case "backupSnapshotRestore":{
                const snap=getSnapshot();
                if(!snap){ toast("Локального снимка пока нет"); return; }
                ui.backupRestoreOpen=true; ui.backupParsed=snap; ui.backupParsedSrc="snapshot"; ui.backupMode="merge"; ui.backupConfirmStep=0;
                render();
                break;
            }
            case "backupReplaceAsk": ui.backupConfirmStep=1; render(); break;
            case "backupConfirmNext": ui.backupConfirmStep=2; render(); break;
            case "backupConfirmCancel": ui.backupConfirmStep=0; render(); break;
            case "backupApplyGo":{
                if(!ui.backupParsed) return;
                const mode=ui.backupMode;
                if(mode==="replace"&&ui.backupConfirmStep!==2) return;
                const res=applyBackupDump(ui.backupParsed, mode);
                ui.backupParsed=null; ui.backupParsedSrc=null; ui.backupRestoreOpen=false; ui.backupConfirmStep=0; ui.backupMode="merge";
                applyTheme(); render();
                hap("ok");
                if(res.cloudReplace){
                    toast("Данные заменены: дней — "+res.days+", шаблонов — "+res.tpl+". Синхронизация с облаком…");
                    cloudReplaceAll().then(function(){ toast("Облако обновлено"); });
                } else {
                    toast("Объединено: добавлено дней — "+res.days+", шаблонов — "+res.tpl);
                    (async function(){
                        for(const dk of res.toSyncDays) await csSet("w_"+dk, JSON.stringify(data.log[dk]));
                        for(const t of res.toSyncTpl) await csSet("tpl_"+t.id, JSON.stringify(t));
                    })();
                }
                break;
            }
            case "backupApplyCancel":
                ui.backupParsed=null; ui.backupParsedSrc=null; ui.backupRestoreOpen=false; ui.backupConfirmStep=0; ui.backupMode="merge";
                render(); break;
            case "bannerBackupOpen": ui.tab="set"; hap("light"); render(); break;
            case "bannerBackupSnooze": data.cfg.backupSnooze=Date.now()+3*86400000; persistCfg(); render(); break;

            case "addEx":{
                const inp=document.getElementById("newEx");
                const name=inp.value.trim(); if(!name) return;
                const pn=parseExName(name); day.exercises.push(newEx(pn.base,pn.plan,pn.variant));
                hap("light"); setDay(day); break;
            }
            case "delEx":{
                const i=day.exercises.findIndex(function(x){return x.id===ds.id;}); if(i<0) return;
                const removed=day.exercises[i], remDate=curDate;
                day.exercises.splice(i,1);
                hap("medium"); setDay(day);
                toast("«"+removed.name.slice(0,24)+(removed.name.length>24?"…":"")+"» удалено","Вернуть",function(){
                    const d2=data.log[remDate]||{title:"",exercises:[]};
                    d2.exercises.splice(Math.min(i,d2.exercises.length),0,removed);
                    data.log[remDate]=d2; d2.up=Date.now();
                    persistDay(remDate); render();
                });
                break;
            }
            case "syncNow":
                cloudLoad().then(function(){ toast(syncState.last?"Синхронизировано · записей: "+syncState.count:"Не удалось связаться с облаком"); });
                break;

            case "wipe1": ui.wipeStep=1; render(); break;
            case "wipe2": ui.wipeStep=2; render(); break;
            case "wipeNo": ui.wipeStep=0; render(); break;
            case "wipeYes":
                (async function(){
                    ui.wipeStep=0;
                    const keys=await csKeys();
                    if(keys) for(const k of keys) await csDel(k);
                    try{ lsDel(CACHE_KEY); lsDel(SNAPSHOT_KEY); }catch(e){}
                    data=emptyData();
                    data.templates=DEFAULT_TEMPLATES.map(function(t){return normalizeTpl({id:uid(),name:t.name,title:t.title,exercises:t.exercises.slice()});});
                    syncState.last=null; syncState.count=null; warnedCloud=false;
                    curDate=toKey(new Date()); ui.tab="day";
                    saveCache(); render();
                    hap("ok"); toast("Все данные удалены");
                })();
                break;

            case "addSet":{
                const wEl=document.getElementById("w-"+ds.id), rEl=document.getElementById("r-"+ds.id);
                const w=parseFloat(String(wEl.value).replace(",","."));
                const r=parseInt(rEl.value,10);
                if(isNaN(w)||w<0||isNaN(r)||r<=0) return;
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                ex.sets.push({w:w,r:r});
                if(data.cfg.autoTimer) startTimer();
                hap("light"); setDay(day);
                const w2=document.getElementById("w-"+ds.id); if(w2) w2.value=w;
                break;
            }
            case "repSet":{
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex||!ex.sets.length) return;
                ex.sets.push(Object.assign({},ex.sets[ex.sets.length-1]));
                hap("light"); setDay(day); break;
            }
            case "delSet":{
                const ex=day.exercises.find(function(x){return x.id===ds.id;}); if(!ex) return;
                const i=Number(ds.i);
                lastDel={date:curDate,exId:ds.id,i:i,set:ex.sets[i]};
                ex.sets.splice(i,1);
                hap("medium"); setDay(day);
                toast("Подход удалён","Вернуть",function(){
                    if(!lastDel) return;
                    const d2=data.log[lastDel.date]||{title:"",exercises:[]};
                    let ex2=d2.exercises.find(function(x){return x.id===lastDel.exId;});
                    if(!ex2) return;
                    ex2.sets.splice(Math.min(lastDel.i,ex2.sets.length),0,lastDel.set);
                    d2.up=Date.now();
                    data.log[lastDel.date]=d2;
                    const dd=lastDel.date; lastDel=null;
                    persistDay(dd); render();
                });
                break;
            }
            case "copyLast":{
                const dates=Object.keys(data.log).filter(function(k){return k<curDate;}).sort().reverse();
                if(!dates.length) return;
                const prev=data.log[dates[0]];
                if(!day.title&&prev.title) day.title=prev.title;
                for(const p of prev.exercises)
                    if(!day.exercises.some(function(x){return x.name.toLowerCase()===p.name.toLowerCase();}))
                        day.exercises.push(exShell(p));
                setDay(day); break;
            }
            case "tplStart": ui.savingTpl=true; render(); break;
            case "tplCancel": ui.savingTpl=false; render(); break;
            case "tplSave":{
                const name=(document.getElementById("tplName").value||"").trim();
                if(!name||!day.exercises.length) return;
                const old=data.templates.find(function(t){return t.name===name;});
                if(old){ data.templates=data.templates.filter(function(t){return t.id!==old.id;}); unpersistTpl(old.id); }
                const t=normalizeTpl({id:uid(),name:name,title:day.title||"",exercises:day.exercises.map(function(x){return x.base?composeName(x.base,x.plan,null):x.name;})});
                data.templates.push(t);
                ui.savingTpl=false; persistTpl(t); render();
                hap("ok"); toast("Шаблон «"+name+"» сохранён");
                break;
            }
            case "tplApply":{
                const t=data.templates.find(function(x){return x.id===ds.id;}); if(t) applyTemplate(t);
                break;
            }
            case "tplApplyGo":{
                const t=data.templates.find(function(x){return x.id===ds.id;}); if(!t) return;
                applyTemplate(t); ui.tab="day"; hap("ok"); render();
                toast("Шаблон применён к "+fmtShort(curDate));
                break;
            }
            case "tplDelAsk": ui.tplDelId=ds.id; render(); break;
            case "tplDelNo": ui.tplDelId=null; render(); break;
            case "tplDelYes":{
                data.templates=data.templates.filter(function(t){return t.id!==ds.id;});
                unpersistTpl(ds.id); ui.tplDelId=null; render();
                toast("Шаблон удалён");
                break;
            }
            case "selectProg": progEx=(progEx!=null&&progEx.trim().toLowerCase()===ds.name.trim().toLowerCase()?null:ds.name); render(); break;
            case "progVariant": progEx=ds.name; render(); break;
            case "progMode": ui.progMode=ds.mode; render(); break;
            case "progPeriod": ui.progPeriod=ds.period; render(); break;
            case "setAccent": data.cfg.accent=ds.accent; persistCfg(); applyTheme(); render(); break;
            case "weekTypeToggle": ui.weekTypeOpen=!ui.weekTypeOpen; render(); break;
            case "setWeekType":{
                const mKey=getMondayKey(curDate);
                if(!data.cfg.weekOverrides) data.cfg.weekOverrides={};
                if(ds.type==='reset'){
                    delete data.cfg.weekOverrides[mKey];
                } else {
                    data.cfg.weekOverrides[mKey]={type:ds.type,index:parseInt(ds.index,10)||0};
                }
                // Update weekType on existing day entry so recommendations stay correct
                const d2=data.log[curDate];
                if(d2){ const wi2=weekInfo(curDate); if(wi2) d2.weekType=wi2.isRest?"rest":"work"; d2.up=Date.now(); data.log[curDate]=d2; persistDay(curDate); }
                persistCfg(); ui.weekTypeOpen=false;
                toast(ds.type==='reset'?"Тип недели сброшен (по циклу)":"Неделя задана вручную");
                render(); break;
            }
            case "delWeekOverride":
                if(data.cfg.weekOverrides) delete data.cfg.weekOverrides[ds.key];
                persistCfg(); render(); break;
        }
    }

    // ============ init ============
    (function init(){
        const hadCache=loadCache();
        if(!hadCache){
            if(migrateOld()) toast("Данные перенесены из старой версии");
            else { data.templates=DEFAULT_TEMPLATES.map(function(t){return normalizeTpl({id:uid(),name:t.name,title:t.title,exercises:t.exercises.slice()});}); saveCache(); }
        }
        applyMigrations();
        applyTheme();
        if(ENV==="test"){
            const b=document.createElement("div"); b.id="envBadge"; b.className="env-badge env-fixed"; b.textContent="TEST"; document.body.appendChild(b);
        }
        render();
        // до первой проверки облака мастер в test не показываем: тестовые данные могут уже лежать в tst_-ключах
        const cloudChecked=function(){ if(!ui.cloudChecked){ ui.cloudChecked=true; render(); } };
        setTimeout(function(){ ui.stateChecked=true; cloudChecked(); },6000);
        checkCloneState().then(function(){ ui.stateChecked=true; },function(e){ ui.stateChecked=true; ui.lastCloneError="Шаг «Проверка маркера клонирования»: "+errText(e); })
            .then(function(){ render(); return cloudLoad(); }).then(cloudChecked,cloudChecked); // фоновая синхронизация с Telegram CloudStorage
    })();
</script>
</body>
</html>
