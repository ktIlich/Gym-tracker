<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#09090b">
<title>Трекер тренировок</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#09090b; --card:#18181b; --card2:#27272a; --border:#27272a; --border2:#3f3f46;
    --text:#f4f4f5; --mut:#a1a1aa; --dim:#71717a; --faint:#52525b;
    --amber:#f59e0b; --amber2:#fbbf24; --green:#34d399; --red:#f87171;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:15px}
  #app{max-width:440px; margin:0 auto; padding:0 16px 90px}
  button{font-family:inherit; font-size:inherit; border:none; background:none; color:inherit; cursor:pointer; padding:0}
  input{font-family:inherit; font-size:15px; color:var(--text); background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:9px 12px; outline:none; width:100%}
  input:focus{border-color:var(--amber)}
  input::placeholder{color:var(--faint)}
  input[type=date]{color-scheme:dark}
  .num{font-variant-numeric:tabular-nums}

  header{position:sticky; top:0; z-index:10; background:rgba(9,9,11,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border); margin:0 -16px; padding:0 16px}
  .hrow{display:flex; align-items:center; justify-content:space-between; padding:12px 0 8px}
  .logo{font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
  .logo svg{color:var(--amber)}
  .hbtns{display:flex; gap:4px}
  .icon-btn{padding:8px; color:var(--mut); border-radius:10px}
  .icon-btn:active{color:var(--amber)}

  .strip{display:flex; gap:4px; height:8px; border-radius:99px; overflow:hidden; position:relative; margin-top:2px}
  .strip>i{flex:1}
  .s-work{background:rgba(245,158,11,.3)} .s-rest{background:rgba(52,211,153,.3)}
  .dot{position:absolute; top:0; width:8px; height:8px; border-radius:50%; background:var(--text); box-shadow:0 0 4px rgba(0,0,0,.6)}
  .strip-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin:4px 1px 10px}

  .datenav{display:flex; align-items:center; justify-content:space-between; margin-top:14px}
  .datenav .nav{padding:8px; color:var(--mut); font-size:22px; line-height:1}
  .dmain{text-align:center}
  .dtitle{font-weight:600; text-transform:capitalize}
  .badge{font-size:12px; font-weight:600; margin-top:1px}
  .b-work{color:var(--amber2)} .b-rest{color:var(--green)}
  .today-link{font-size:11px; color:var(--dim); text-decoration:underline; margin-top:2px}

  .subtitle-row{margin:12px 0 4px}
  .subtitle-row input{background:transparent; border:1px dashed var(--border2); text-align:center;
    font-weight:600; font-size:16px; border-radius:14px}
  .subtitle-row input:focus{border-style:solid}

  .rest-hint{text-align:center; color:rgba(52,211,153,.85); font-size:14px;
    background:rgba(52,211,153,.08); border:1px solid rgba(52,211,153,.2); border-radius:14px; padding:12px; margin-top:12px}

  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 16px; margin-top:12px}
  .ex-head{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
  .ex-name{font-weight:600; line-height:1.25}
  .ex-last{font-size:12px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .del{color:var(--faint); padding:4px; margin:-2px -4px 0 0}
  .del:active{color:var(--red)}

  .sets{margin-top:6px}
  .set{display:flex; align-items:center; gap:12px; padding:6px 0; border-top:1px solid rgba(63,63,70,.4)}
  .set:first-child{border-top:none}
  .set .idx{width:20px; font-size:12px; color:var(--dim)}
  .set .val{flex:1; font-weight:600; letter-spacing:-.01em}
  .set .unit{color:var(--dim); font-weight:400; font-size:13px}
  .set .x{color:var(--faint); margin:0 6px}

  .addset{display:flex; gap:8px; margin-top:10px}
  .addset input{width:76px; padding:8px 10px; font-size:14px; background:var(--card2); border-color:var(--border2)}
  .btn-amber{background:var(--amber); color:#09090b; border-radius:10px; padding:8px 11px; font-weight:700; display:flex; align-items:center}
  .btn-amber:active{background:var(--amber2)}
  .btn-amber:disabled{opacity:.4}
  .btn-gray{background:var(--card2); color:var(--mut); border-radius:10px; padding:8px 11px; display:flex; align-items:center}
  .btn-gray:active{background:var(--border2)}

  .addex{display:flex; gap:8px; margin-top:12px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .chip{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mut);
    background:var(--card); border:1px solid var(--border); border-radius:99px; padding:6px 12px}
  .chip:active{background:var(--card2)}
  .chip .cx{color:var(--faint); padding:2px; margin-right:-4px}
  .sec-label{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:20px 0 8px}

  .settings .row{margin-top:10px}
  .settings .lbl{font-size:13px; color:var(--mut); margin-bottom:6px}
  .wide-btn{width:100%; display:flex; justify-content:center; align-items:center; gap:8px;
    background:var(--card2); border-radius:10px; padding:10px; font-size:14px; margin-top:10px}
  .wide-btn:active{background:var(--border2)}
  .note{font-size:12px; color:var(--dim); margin-top:8px; line-height:1.45}

  .setup{min-height:92vh; display:flex; align-items:center; justify-content:center}
  .setup .card{max-width:340px; width:100%; padding:22px}
  .setup p{color:var(--mut); font-size:14px; line-height:1.5}
  .setup .wide-btn{background:var(--amber); color:#09090b; font-weight:700}

  .cal{margin-top:12px}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
  .cal-title{font-weight:600; text-transform:capitalize}
  .cal-nav{padding:6px 12px; color:var(--mut); font-size:20px; line-height:1}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal-dow{font-size:10px; color:var(--dim); text-align:center; padding-bottom:2px}
  .cal-day{aspect-ratio:1; border-radius:10px; border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; color:var(--mut); overflow:hidden}
  .cal-day.rest{background:rgba(52,211,153,.09)}
  .cal-day.has{color:var(--text)}
  .cal-day.sel{border-color:var(--amber)}
  .cal-day.today .n{color:var(--amber2); font-weight:800}
  .cal-day .t{font-size:8px; color:var(--amber2); line-height:1.1; margin-top:2px;
    max-width:95%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .cal-day .dotm{width:4px; height:4px; border-radius:50%; background:var(--amber); margin-top:3px}
  .cal-legend{display:flex; gap:14px; font-size:10px; color:var(--dim); margin-top:8px}
  .cal-legend i{display:inline-block; width:8px; height:8px; border-radius:3px; margin-right:4px; vertical-align:-1px}

  .chip.danger{color:var(--red); border-color:rgba(248,113,113,.35)}
  .confirm{display:flex; align-items:center; gap:10px; justify-content:space-between;
    background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.3);
    border-radius:14px; padding:10px 14px; margin-top:12px; font-size:13px}
  .confirm .btns{display:flex; gap:8px; flex-shrink:0}
  .btn-red{background:var(--red); color:#09090b; border-radius:10px; padding:7px 12px; font-weight:700; font-size:13px}
  .btn-red:active{opacity:.85}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--card2); border:1px solid var(--border2); color:var(--text);
    padding:10px 18px; border-radius:99px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept=".xlsx,.xls" style="display:none">
<div class="toast" id="toast"></div>

<script>
"use strict";
// ================= state =================
const KEY = "gym-tracker-v1";
const DEFAULT_TEMPLATES = [
  { name:"Жимовая (пн)", title:"Жимовая", exercises:[
    "Отведения в Пек-Дек на заднюю дельту (3х12-20)",
    "Жим штанги лёжа под углом в Смите (3х8-12)",
    "Жим гантелями лёжа под углом (2х8-12)",
    "Сведения в кроссовере (2х10-15)",
    "Отведения в тренажёре на плечи (3х10-15)",
    "Отведения по 1 руке с нижнего блока (2х10-15)",
    "Жим Смит / гантели на плечи (2х10)",
    "Разгибания в блоке с прямой рукоятью (4х10-15)",
    "Пресс (4х12-20)"
  ]},
  { name:"Тяговая (ср)", title:"Тяговая", exercises:[
    "Пуловер в кроссовере (2х10-15)",
    "Вертикальная тяга широким хватом (3х8-12)",
    "Тяга Т-грифа (2х8-12)",
    "Вертикальная тяга средним параллельным хватом (3х12-15)",
    "Горизонтальная тяга сидя широким хватом (2х10-15)",
    "Гиперэкстензия (3х12)",
    "Сгибания с гантелями стоя по 1 руке (2х8-15)",
    "Молотки, свободный вес или блок (2х8-15)",
    "Гиперэкстензия, акцент разгибатели и поясница (3х12-15)"
  ]},
  { name:"Ноги (пт)", title:"Ноги", exercises:[
    "Сгибания голени сидя или стоя (2х8-12)",
    "Сведения ног сидя (2х10-15)",
    "Приседания в гакк-машине (2х8-12)",
    "Жим ногами, стандартная постановка (2х8-12)",
    "Болгарские приседания (2х10-15)",
    "Разгибания сидя (2х10-15)",
    "Голень стоя (3х10-20)",
    "Задняя дельта Пек-Дек (3х12)",
    "Задняя дельта гантели в наклоне (2х15)"
  ]}
];
let data = load();
let curDate = toKey(new Date());
let ui = { settings:false, savingTpl:false, calendar:false, confirmDel:false };
let calMonth = null; // "YYYY-MM"

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign({settings:{cycleStart:null},templates:[],log:{}}, JSON.parse(raw));
  }catch(e){}
  return {settings:{cycleStart:null},templates:DEFAULT_TEMPLATES.map(t=>({name:t.name,title:t.title,exercises:t.exercises.slice()})),log:{}};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ toast("Не удалось сохранить"); } }

// ================= helpers =================
function toKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return toKey(d); }
function fmtDate(k){ return parseKey(k).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"}); }
function cyclePos(dateKey,startKey){
  if(!startKey) return null;
  const diff = Math.round((parseKey(dateKey)-parseKey(startKey))/86400000);
  const week = Math.floor(diff/7);
  return { pos:((week%3)+3)%3, day:((diff%21)+21)%21 };
}
function weekLabel(p){ return p===0?"Рабочая · неделя 1":p===1?"Рабочая · неделя 2":"Отдых"; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtW(w){ return (Math.round(w*100)/100).toString().replace(".",","); }
let toastTimer;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function getDay(){ return data.log[curDate] || {title:"",exercises:[]}; }
function setDay(day){
  if(!day.exercises.length && !(day.title||"").trim()) delete data.log[curDate];
  else data.log[curDate]=day;
  save(); render();
}

// last results per exercise name before current date
function lastResult(name){
  const dates = Object.keys(data.log).filter(k=>k<curDate).sort().reverse();
  for(const k of dates){
    const hit = (data.log[k].exercises||[]).find(e=>e.name.toLowerCase()===name.toLowerCase() && e.sets.length);
    if(hit) return hit.sets.map(s=>fmtW(s.w)+"×"+s.r).join(", ");
  }
  return null;
}

// ================= export =================
function exportXlsx(){
  if(typeof XLSX==="undefined"){ toast("Нет интернета — библиотека Excel не загрузилась"); return; }
  const rows=[["Дата","Тренировка","Неделя цикла","Упражнение","Подход","Вес, кг","Повторы"]];
  for(const k of Object.keys(data.log).sort()){
    const c=cyclePos(k,data.settings.cycleStart);
    const day=data.log[k];
    for(const ex of day.exercises)
      ex.sets.forEach((s,i)=>rows.push([k, day.title||"", c?weekLabel(c.pos):"", ex.name, i+1, s.w, s.r]));
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:14},{wch:18},{wch:28},{wch:8},{wch:9},{wch:9}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Тренировки");
  XLSX.writeFile(wb,"Тренировки.xlsx");
}

// ================= import =================
function normDate(v){
  if(v instanceof Date && !isNaN(v)) return toKey(new Date(v.getTime()+12*3600000)); // guard timezone edge
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  if(typeof v==="string"){
    const s=v.trim();
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
    m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  }
  return null;
}
function importXlsx(file){
  if(typeof XLSX==="undefined"){ toast("Нет интернета — библиотека Excel не загрузилась"); return; }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      // find header row
      let hi=-1, col={};
      for(let i=0;i<Math.min(rows.length,10);i++){
        const low=(rows[i]||[]).map(c=>String(c||"").toLowerCase());
        const di=low.findIndex(c=>c.includes("дата"));
        if(di>=0){
          hi=i;
          col.date=di;
          col.title=low.findIndex(c=>c.includes("трениров"));
          col.ex=low.findIndex(c=>c.includes("упражн"));
          col.set=low.findIndex(c=>c.includes("подход"));
          col.w=low.findIndex(c=>c.includes("вес"));
          col.r=low.findIndex(c=>c.includes("повтор"));
          break;
        }
      }
      if(hi<0 || col.ex<0 || col.w<0 || col.r<0){ toast("Не нашёл нужные колонки в файле"); return; }

      const imported={}; let nSets=0;
      for(let i=hi+1;i<rows.length;i++){
        const row=rows[i]; if(!row) continue;
        const dk=normDate(row[col.date]); if(!dk) continue;
        const exName=String(row[col.ex]||"").trim(); if(!exName) continue;
        const w=parseFloat(String(row[col.w]).replace(",","."));
        const r=parseInt(row[col.r],10);
        if(isNaN(w)||isNaN(r)) continue;
        if(!imported[dk]) imported[dk]={title:"",exercises:[]};
        if(col.title>=0 && row[col.title] && !imported[dk].title) imported[dk].title=String(row[col.title]).trim();
        let ex=imported[dk].exercises.find(x=>x.name.toLowerCase()===exName.toLowerCase());
        if(!ex){ ex={id:uid(),name:exName,sets:[]}; imported[dk].exercises.push(ex); }
        ex.sets.push({w,r}); nSets++;
      }
      const nDays=Object.keys(imported).length;
      if(!nDays){ toast("В файле не нашлось данных"); return; }
      Object.assign(data.log, imported); // imported dates overwrite same dates
      save(); render();
      toast("Импортировано: дней — "+nDays+", подходов — "+nSets);
    }catch(err){ console.error(err); toast("Не удалось прочитать файл"); }
  };
  reader.readAsArrayBuffer(file);
}

// ================= render =================
const app=document.getElementById("app");
const ICON_DUMBBELL='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/></svg>';

function calHtml(){
  const [y,m]=calMonth.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const daysIn=new Date(y,m,0).getDate();
  const lead=(first.getDay()+6)%7; // Monday-first
  const today=toKey(new Date());
  const monthName=first.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
  let h='<div class="card cal">'
    +'<div class="cal-head">'
    +'<button class="cal-nav" data-act="calPrev">‹</button>'
    +'<div class="cal-title">'+esc(monthName)+'</div>'
    +'<button class="cal-nav" data-act="calNext">›</button></div>'
    +'<div class="cal-grid">';
  for(const d of ["пн","вт","ср","чт","пт","сб","вс"]) h+='<div class="cal-dow">'+d+'</div>';
  for(let i=0;i<lead;i++) h+='<div></div>';
  for(let d=1;d<=daysIn;d++){
    const key=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const entry=data.log[key];
    const hasSets=entry&&entry.exercises.some(e=>e.sets.length);
    const c=cyclePos(key,data.settings.cycleStart);
    let cls="cal-day";
    if(c&&c.pos===2) cls+=" rest";
    if(entry) cls+=" has";
    if(key===curDate) cls+=" sel";
    if(key===today) cls+=" today";
    h+='<button class="'+cls+'" data-act="calGo" data-date="'+key+'">'
      +'<span class="n num">'+d+'</span>'
      +(entry&&entry.title?'<span class="t">'+esc(entry.title)+'</span>'
        :hasSets||entry?'<span class="dotm"></span>':'')
      +'</button>';
  }
  h+='</div><div class="cal-legend">'
    +'<span><i style="background:rgba(52,211,153,.35)"></i>неделя отдыха</span>'
    +'<span><i style="background:var(--amber)"></i>есть тренировка</span>'
    +'</div></div>';
  return h;
}

function render(){
  if(!data.settings.cycleStart){ renderSetup(); return; }
  const cycle=cyclePos(curDate,data.settings.cycleStart);
  const day=getDay();
  const isRest=cycle.pos===2;
  const today=toKey(new Date());
  const hasPast=Object.keys(data.log).some(k=>k<curDate);

  let h='';
  h+='<header>'
    +'<div class="hrow"><div class="logo">'+ICON_DUMBBELL+'Трекер</div>'
    +'<div class="hbtns">'
    +'<button class="icon-btn" data-act="calToggle" title="Календарь">📅</button>'
    +'<button class="icon-btn" data-act="import" title="Импорт из Excel">⬆</button>'
    +'<button class="icon-btn" data-act="export" title="Скачать Excel">⬇</button>'
    +'<button class="icon-btn" data-act="settings" title="Настройки">⚙</button>'
    +'</div></div>'
    +'<div class="strip"><i class="s-work"></i><i class="s-work"></i><i class="s-rest"></i>'
    +'<span class="dot" style="left:calc('+(cycle.day/21*100)+'% - 4px)"></span></div>'
    +'<div class="strip-labels"><span>раб. 1</span><span>раб. 2</span><span>отдых</span></div>'
    +'</header>';

  if(ui.calendar) h+=calHtml();

  if(ui.settings){
    h+='<div class="card settings">'
      +'<div class="row"><div class="lbl">Начало первой рабочей недели</div>'
      +'<input type="date" value="'+esc(data.settings.cycleStart)+'" data-chg="cycleStart"></div>'
      +'<button class="wide-btn" data-act="export">⬇ Скачать Excel для Google Таблиц</button>'
      +'<button class="wide-btn" data-act="import">⬆ Импорт из Excel-файла</button>'
      +'<div class="note">Данные хранятся в этом браузере на этом устройстве. Периодически скачивай Excel как резервную копию.</div>'
      +'</div>';
  }

  h+='<div class="datenav">'
    +'<button class="nav" data-act="prev">‹</button>'
    +'<div class="dmain"><div class="dtitle">'+esc(fmtDate(curDate))+'</div>'
    +'<div class="badge '+(isRest?'b-rest':'b-work')+'">'+weekLabel(cycle.pos)+'</div>'
    +(curDate!==today?'<div><button class="today-link" data-act="today">к сегодня</button></div>':'')
    +'</div>'
    +'<button class="nav" data-act="next">›</button></div>';

  h+='<div class="subtitle-row"><input value="'+esc(day.title||"")+'" data-chg="title" '
    +'placeholder="Что качаем? (грудь, спина, ноги…)" maxlength="40"></div>';

  if(isRest && !day.exercises.length)
    h+='<div class="rest-hint">Неделя отдыха — восстанавливайся 💤</div>';

  for(const ex of day.exercises){
    const last=lastResult(ex.name);
    h+='<div class="card">'
      +'<div class="ex-head"><div style="min-width:0"><div class="ex-name">'+esc(ex.name)+'</div>'
      +(last?'<div class="ex-last">прошлый раз: '+esc(last)+'</div>':'')
      +'</div><button class="del" data-act="delEx" data-id="'+ex.id+'">🗑</button></div>';
    if(ex.sets.length){
      h+='<div class="sets">';
      ex.sets.forEach((s,i)=>{
        h+='<div class="set"><span class="idx num">'+(i+1)+'</span>'
          +'<span class="val num">'+fmtW(s.w)+' <span class="unit">кг</span><span class="x">×</span>'+s.r+'</span>'
          +'<button class="del" data-act="delSet" data-id="'+ex.id+'" data-i="'+i+'">✕</button></div>';
      });
      h+='</div>';
    }
    h+='<div class="addset">'
      +'<input type="number" inputmode="decimal" placeholder="кг" id="w-'+ex.id+'">'
      +'<input type="number" inputmode="numeric" placeholder="повт." id="r-'+ex.id+'" data-enter="addSet" data-id="'+ex.id+'">'
      +'<button class="btn-amber" data-act="addSet" data-id="'+ex.id+'">＋</button>'
      +(ex.sets.length?'<button class="btn-gray" data-act="repSet" data-id="'+ex.id+'" title="Повторить последний подход">⧉</button>':'')
      +'</div></div>';
  }

  h+='<div class="addex"><input placeholder="Новое упражнение…" id="newEx" data-enter="addEx">'
    +'<button class="btn-amber" data-act="addEx">＋</button></div>';

  h+='<div class="chips">'
    +(hasPast?'<button class="chip" data-act="copyLast">⧉ Повторить прошлую тренировку</button>':'')
    +(day.exercises.length&&!ui.savingTpl?'<button class="chip" data-act="tplStart">🔖 Сохранить как шаблон</button>':'')
    +((day.exercises.length||day.title)&&!ui.confirmDel?'<button class="chip danger" data-act="dayDelAsk">🗑 Очистить день</button>':'')
    +'</div>';

  if(ui.confirmDel){
    h+='<div class="confirm"><span>Удалить все записи за '+esc(fmtDate(curDate))+'?</span>'
      +'<span class="btns"><button class="btn-red" data-act="dayDelYes">Удалить</button>'
      +'<button class="btn-gray" data-act="dayDelNo">Отмена</button></span></div>';
  }

  if(ui.savingTpl){
    h+='<div class="addex"><input placeholder="Название шаблона (напр. День А)" id="tplName" data-enter="tplSave" '
      +'value="'+esc(day.title||"")+'">'
      +'<button class="btn-amber" data-act="tplSave">✓</button>'
      +'<button class="btn-gray" data-act="tplCancel">✕</button></div>';
  }

  if(data.templates.length){
    h+='<div class="sec-label">Шаблоны</div><div class="chips">';
    for(const t of data.templates){
      h+='<span class="chip"><button data-act="tplApply" data-name="'+esc(t.name)+'">'+esc(t.name)+'</button>'
        +'<button class="cx" data-act="tplDel" data-name="'+esc(t.name)+'">✕</button></span>';
    }
    h+='</div>';
  }
  app.innerHTML=h;
}

function renderSetup(){
  app.innerHTML='<div class="setup"><div class="card">'
    +'<div class="logo" style="margin-bottom:12px">'+ICON_DUMBBELL+'&nbsp;Трекер тренировок</div>'
    +'<p>Цикл: 2 рабочие недели, потом 1 неделя отдыха. Укажи дату начала первой рабочей недели.</p>'
    +'<input type="date" id="startInput" value="'+toKey(new Date())+'" style="margin:10px 0 14px">'
    +'<button class="wide-btn" data-act="start">Начать</button>'
    +'</div></div>';
}

// ================= actions =================
document.getElementById("importFile").addEventListener("change",function(){
  if(this.files[0]) importXlsx(this.files[0]);
  this.value="";
});

app.addEventListener("change",function(e){
  const chg=e.target.dataset.chg;
  if(chg==="cycleStart" && e.target.value){ data.settings.cycleStart=e.target.value; save(); render(); }
  if(chg==="title"){ const d=getDay(); d.title=e.target.value.trim(); setDay(d); }
});

app.addEventListener("keydown",function(e){
  if(e.key!=="Enter") return;
  const act=e.target.dataset.enter;
  if(act) doAction(act, e.target.dataset);
});

app.addEventListener("click",function(e){
  const btn=e.target.closest("[data-act]");
  if(btn) doAction(btn.dataset.act, btn.dataset);
});

function doAction(act,ds){
  const day=getDay();
  switch(act){
    case "start":{
      const v=document.getElementById("startInput").value;
      if(v){ data.settings.cycleStart=v; save(); render(); }
      break;
    }
    case "prev": curDate=addDays(curDate,-1); ui.confirmDel=false; render(); break;
    case "next": curDate=addDays(curDate,1); ui.confirmDel=false; render(); break;
    case "today": curDate=toKey(new Date()); ui.confirmDel=false; render(); break;
    case "dayDelAsk": ui.confirmDel=true; render(); break;
    case "dayDelNo": ui.confirmDel=false; render(); break;
    case "dayDelYes":
      delete data.log[curDate];
      ui.confirmDel=false; save(); render();
      toast("Записи за день удалены");
      break;
    case "settings": ui.settings=!ui.settings; render(); break;
    case "calToggle":
      ui.calendar=!ui.calendar;
      if(ui.calendar) calMonth=curDate.slice(0,7);
      render(); break;
    case "calPrev": case "calNext":{
      const d=parseKey(calMonth+"-01");
      d.setMonth(d.getMonth()+(act==="calNext"?1:-1));
      calMonth=toKey(d).slice(0,7);
      render(); break;
    }
    case "calGo":
      curDate=ds.date; ui.calendar=false; ui.confirmDel=false; render(); break;
    case "export": exportXlsx(); break;
    case "import": document.getElementById("importFile").click(); break;
    case "addEx":{
      const inp=document.getElementById("newEx");
      const name=inp.value.trim(); if(!name) return;
      day.exercises.push({id:uid(),name,sets:[]});
      setDay(day);
      break;
    }
    case "delEx":
      day.exercises=day.exercises.filter(x=>x.id!==ds.id); setDay(day); break;
    case "addSet":{
      const wEl=document.getElementById("w-"+ds.id), rEl=document.getElementById("r-"+ds.id);
      const w=parseFloat(String(wEl.value).replace(",","."));
      const r=parseInt(rEl.value,10);
      if(isNaN(w)||isNaN(r)||r<=0) return;
      const ex=day.exercises.find(x=>x.id===ds.id); if(!ex) return;
      ex.sets.push({w,r});
      setDay(day);
      const w2=document.getElementById("w-"+ds.id); if(w2){ w2.value=w; } // keep weight prefilled
      break;
    }
    case "repSet":{
      const ex=day.exercises.find(x=>x.id===ds.id); if(!ex||!ex.sets.length) return;
      ex.sets.push(Object.assign({},ex.sets[ex.sets.length-1]));
      setDay(day);
      break;
    }
    case "delSet":{
      const ex=day.exercises.find(x=>x.id===ds.id); if(!ex) return;
      ex.sets.splice(Number(ds.i),1);
      setDay(day);
      break;
    }
    case "copyLast":{
      const dates=Object.keys(data.log).filter(k=>k<curDate).sort().reverse();
      if(!dates.length) return;
      const prev=data.log[dates[0]];
      if(!day.title && prev.title) day.title=prev.title;
      for(const p of prev.exercises)
        if(!day.exercises.some(x=>x.name.toLowerCase()===p.name.toLowerCase()))
          day.exercises.push({id:uid(),name:p.name,sets:[]});
      setDay(day);
      break;
    }
    case "tplStart": ui.savingTpl=true; render(); break;
    case "tplCancel": ui.savingTpl=false; render(); break;
    case "tplSave":{
      const name=(document.getElementById("tplName").value||"").trim();
      if(!name||!day.exercises.length) return;
      data.templates=data.templates.filter(t=>t.name!==name);
      data.templates.push({name, title:day.title||"", exercises:day.exercises.map(x=>x.name)});
      ui.savingTpl=false; save(); render();
      toast("Шаблон «"+name+"» сохранён");
      break;
    }
    case "tplApply":{
      const t=data.templates.find(x=>x.name===ds.name); if(!t) return;
      if(!day.title && t.title) day.title=t.title;
      for(const n of t.exercises)
        if(!day.exercises.some(x=>x.name.toLowerCase()===n.toLowerCase()))
          day.exercises.push({id:uid(),name:n,sets:[]});
      setDay(day);
      break;
    }
    case "tplDel":
      data.templates=data.templates.filter(t=>t.name!==ds.name); save(); render(); break;
  }
}

render();
</script>
</body>
</html>
